<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Flappy</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f172a; color: #f8fafc;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    padding: 14px; user-select: none; -webkit-user-select: none; overflow-x: hidden;
  }
  .col { width: min(94vw, 400px); }
  #top { display: flex; align-items: center; justify-content: space-between; }
  #chip { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  #chip .av { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; background: #fde68a; }
  #chip b { color: #f9d71c; }
  #logout { background: #334155; color: #cbd5e1; border: 0; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  #bestChip { font-size: 14px; color: #cbd5e1; }
  #bestChip b { color: #f9d71c; font-size: 16px; }
  canvas {
    display: block; width: min(94vw, 400px); height: auto; aspect-ratio: 400 / 560;
    border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    touch-action: none; cursor: pointer;
  }
  /* account form */
  #account { background: #1e293b; border-radius: 12px; padding: 14px; }
  #account .atitle { font-size: 14px; font-weight: 600; color: #93c5fd; margin-bottom: 10px; }
  #account .arow { display: flex; gap: 8px; margin-bottom: 8px; }
  #account input { flex: 1; min-width: 0; padding: 10px 11px; font-size: 15px; border: 1px solid #334155; border-radius: 9px; background: #0f172a; color: #fff; }
  #account input::placeholder { color: #64748b; }
  #account input:focus { outline: none; border-color: #f9d71c; }
  #avatars { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 10px; }
  #avatars button { width: 30px; height: 30px; border: 2px solid transparent; border-radius: 8px; background: #0f172a; font-size: 17px; cursor: pointer; line-height: 1; padding: 0; }
  #avatars button.sel { border-color: #f9d71c; background: #2a3445; }
  #account .btns button { flex: 1; font: inherit; font-size: 15px; border: 0; border-radius: 9px; padding: 11px; cursor: pointer; }
  #account .btns .login { background: #334155; color: #e2e8f0; }
  #account .btns .create { background: #f9d71c; color: #1c2530; font-weight: 600; }
  #account button:active { transform: scale(0.98); }
  #amsg { min-height: 17px; font-size: 13px; margin-top: 8px; }
  #amsg.err { color: #ff8a7a; } #amsg.ok { color: #8fe388; } #amsg.busy { color: #94a3b8; }
  .guestnote { font-size: 12px; color: #64748b; margin-top: 8px; }
  /* leaderboard */
  #board { background: #1e293b; border-radius: 12px; padding: 12px 14px; }
  #board h2 { margin: 0 0 8px; font-size: 14px; color: #93c5fd; font-weight: 600; display: flex; justify-content: space-between; }
  #board ol { list-style: none; margin: 0; padding: 0; }
  #board li { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 14px; border-top: 1px solid rgba(255,255,255,0.06); }
  #board li:first-child { border-top: 0; }
  #board .rk { width: 22px; color: #64748b; }
  #board .nm { flex: 1; }
  #board .sc { color: #f9d71c; font-weight: 700; }
  #board li.me { color: #fff; }
  #board li.me .nm::after { content: " (you)"; color: #93c5fd; font-size: 12px; }
  #board .empty { color: #64748b; font-size: 13px; padding: 4px 0; }
</style>
</head>
<body>
  <div id="top" class="col">
    <div id="chip" hidden><span class="av" id="avatar">🦊</span><span id="name"></span><button id="logout">Log out</button></div>
    <div id="bestChip">Best <b id="best">0</b></div>
  </div>

  <canvas id="game" width="400" height="560"></canvas>

  <div id="account" class="col">
    <div class="atitle">Create an account to join the leaderboard</div>
    <div class="arow">
      <input id="u" type="text" maxlength="20" placeholder="Username" autocomplete="off" autocapitalize="off" />
      <input id="p" type="password" inputmode="numeric" maxlength="8" placeholder="PIN (4–8 digits)" autocomplete="off" />
    </div>
    <div id="avatars"></div>
    <div class="arow btns">
      <button class="login" id="loginBtn">Log in</button>
      <button class="create" id="createBtn">Create account</button>
    </div>
    <div id="amsg"></div>
    <div class="guestnote">…or just play as a guest — your best is saved on this device.</div>
  </div>

  <div id="board" class="col">
    <h2><span>Global leaderboard</span><span style="color:#5dcaa5">● live</span></h2>
    <ol id="rows"><li class="empty">Loading…</li></ol>
  </div>

<script>
(function () {
  const GAME = "flappy";
  const LS_BEST = "flappy:best";
  // Mirrors the server allowlist (avatars.ts) — off-list values collapse to default.
  const AVATARS = ["🦊","🐼","🐯","🦁","🐸","🐵","🐙","🦄","🐶","🐱","🐧","🐝","🦖","🐢","🦉","🐳"];
  const DEFAULT_COLOR = "#fde68a";
  const USER_RE = /^[a-z0-9_-]{3,20}$/;
  const PIN_RE = /^[0-9]{4,8}$/;

  let me = null; // { username, avatar, avatarColor }
  let best = Number(localStorage.getItem(LS_BEST) || 0) || 0;
  let chosenAvatar = AVATARS[0];

  const el = (id) => document.getElementById(id);
  const accountEl = el("account"), chipEl = el("chip"), avatarEl = el("avatar"), nameEl = el("name");
  const bestEl = el("best"), rowsEl = el("rows"), msgEl = el("amsg");
  const uEl = el("u"), pEl = el("p"), loginBtn = el("loginBtn"), createBtn = el("createBtn");

  function showBest() { bestEl.textContent = best; }
  function setMsg(t, k) { msgEl.textContent = t || ""; msgEl.className = k || ""; }
  function busy(on) { loginBtn.disabled = on; createBtn.disabled = on; }
  showBest();

  // avatar picker
  AVATARS.forEach(function (a, i) {
    const b = document.createElement("button");
    b.textContent = a; if (i === 0) b.className = "sel";
    b.onclick = function () {
      chosenAvatar = a;
      [...el("avatars").children].forEach((c) => c.classList.remove("sel"));
      b.classList.add("sel");
    };
    el("avatars").appendChild(b);
  });

  async function api(path, opts) {
    try {
      return await fetch(path, {
        credentials: "same-origin",
        headers: opts && opts.body ? { "content-type": "application/json" } : undefined,
        ...opts,
      });
    } catch (e) { return null; }
  }

  function renderAuthed() {
    if (me) {
      accountEl.hidden = true; chipEl.hidden = false;
      avatarEl.textContent = me.avatar || "🦊";
      avatarEl.style.background = me.avatarColor || DEFAULT_COLOR;
      nameEl.innerHTML = "Playing as <b>" + escapeHtml(me.username) + "</b>";
    } else {
      accountEl.hidden = false; chipEl.hidden = true;
    }
  }

  async function loadMe() {
    const r = await api("/api/me");
    me = r && r.ok ? await r.json() : null;
    renderAuthed();
  }

  function validate() {
    const u = uEl.value.trim().toLowerCase(), p = pEl.value.trim();
    if (!USER_RE.test(u)) { setMsg("Username: 3–20 letters, numbers, - or _.", "err"); return null; }
    if (!PIN_RE.test(p)) { setMsg("PIN must be 4–8 digits.", "err"); return null; }
    return { u, p };
  }

  async function createAccount() {
    const v = validate(); if (!v) return;
    busy(true); setMsg("Creating account…", "busy");
    const r = await api("/api/auth/signup", { method: "POST",
      body: JSON.stringify({ username: v.u, pin: v.p, avatar: chosenAvatar, avatarColor: DEFAULT_COLOR }) });
    if (!r) { setMsg("Network error — try again.", "err"); busy(false); return; }
    if (r.status === 409) { setMsg("Username taken — log in or pick another.", "err"); busy(false); return; }
    if (!r.ok) { setMsg("Check your username and PIN.", "err"); busy(false); return; }
    me = await r.json(); setMsg("Welcome, " + me.username + "!", "ok");
    finishAuth();
  }

  async function login() {
    const v = validate(); if (!v) return;
    busy(true); setMsg("Logging in…", "busy");
    const r = await api("/api/auth/login", { method: "POST", body: JSON.stringify({ username: v.u, pin: v.p }) });
    if (!r) { setMsg("Network error — try again.", "err"); busy(false); return; }
    if (r.status === 429) { setMsg("Too many tries — wait a few minutes.", "err"); busy(false); return; }
    if (!r.ok) { setMsg("Wrong username or PIN.", "err"); busy(false); return; }
    me = await r.json();
    finishAuth();
  }

  function finishAuth() {
    busy(false); uEl.value = ""; pEl.value = "";
    renderAuthed(); refreshBoard();
  }

  async function logout() {
    await api("/api/auth/logout", { method: "POST" });
    me = null; setMsg("", ""); renderAuthed(); refreshBoard();
  }

  loginBtn.onclick = login;
  createBtn.onclick = createAccount;
  el("logout").onclick = logout;
  uEl.addEventListener("keydown", (e) => { if (e.key === "Enter") pEl.focus(); });
  pEl.addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });

  async function submit(score) {
    if (score > (Number(localStorage.getItem(LS_BEST) || 0) || 0)) localStorage.setItem(LS_BEST, String(score));
    if (!me) { best = Number(localStorage.getItem(LS_BEST) || 0) || 0; showBest(); return; }
    const r = await api("/api/scores", { method: "POST", body: JSON.stringify({ game: GAME, score: score }) });
    if (r && r.ok) { const j = await r.json(); best = j.best; showBest(); }
    refreshBoard();
  }

  async function refreshBoard() {
    const r = await api("/api/leaderboard?game=" + GAME + "&limit=10");
    if (!r || !r.ok) return;
    const top = (await r.json()).top || [];
    if (!top.length) { rowsEl.innerHTML = '<li class="empty">No scores yet — be the first!</li>'; return; }
    rowsEl.innerHTML = top.map(function (row) {
      const mine = me && row.username === me.username ? ' class="me"' : "";
      return "<li" + mine + '><span class="rk">' + row.rank + '</span><span class="nm">' +
        escapeHtml(row.username) + '</span><span class="sc">' + row.score + "</span></li>";
    }).join("");
    if (me) {
      const mineRow = top.find((r2) => r2.username === me.username);
      if (mineRow && mineRow.score > best) { best = mineRow.score; showBest(); }
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  // ============================ GAME ============================
  const canvas = el("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const GRAVITY = 0.45, FLAP = -7.6;
  const PIPE_W = 64, GAP = 150, PIPE_SPEED = 2.4, PIPE_SPACING = 220;
  const GROUND_H = 70, BIRD_X = 110, BIRD_R = 14;
  let bird, pipes, score, state, frame;

  function reset() {
    bird = { y: H / 2, v: 0, rot: 0 };
    pipes = []; score = 0; frame = 0; state = "ready";
    spawnPipe(W + 80); spawnPipe(W + 80 + PIPE_SPACING);
  }
  function spawnPipe(x) {
    const margin = 60;
    const top = margin + Math.random() * (H - GROUND_H - GAP - margin * 2);
    pipes.push({ x: x, top: top, scored: false });
  }
  function flap() {
    if (state === "ready") { state = "playing"; bird.v = FLAP; }
    else if (state === "playing") { bird.v = FLAP; }
    else if (state === "dead") { reset(); }
  }
  function die() { state = "dead"; submit(score); }
  function update() {
    frame++;
    if (state !== "playing") return;
    bird.v += GRAVITY; bird.y += bird.v;
    bird.rot = Math.max(-0.5, Math.min(1.2, bird.v / 12));
    for (const p of pipes) p.x -= PIPE_SPEED;
    if (pipes.length && pipes[pipes.length - 1].x < W - PIPE_SPACING) spawnPipe(pipes[pipes.length - 1].x + PIPE_SPACING);
    if (pipes.length && pipes[0].x < -PIPE_W) pipes.shift();
    for (const p of pipes) {
      if (!p.scored && p.x + PIPE_W < BIRD_X) { p.scored = true; score++; }
      const inX = BIRD_X + BIRD_R > p.x && BIRD_X - BIRD_R < p.x + PIPE_W;
      const hit = bird.y - BIRD_R < p.top || bird.y + BIRD_R > p.top + GAP;
      if (inX && hit) die();
    }
    if (bird.y + BIRD_R > H - GROUND_H) { bird.y = H - GROUND_H - BIRD_R; die(); }
    if (bird.y - BIRD_R < 0) { bird.y = BIRD_R; bird.v = 0; }
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function drawBird() {
    const beat = state === "playing" ? Math.sin(frame * 0.4) : Math.sin(frame * 0.08) * 0.4;
    const wingAngle = (bird.v < 0 ? -0.5 : 0.2) + beat * 0.5;
    ctx.save(); ctx.translate(BIRD_X, bird.y); ctx.rotate(bird.rot);
    ctx.fillStyle = "#c8761b"; ctx.beginPath();
    ctx.moveTo(-12, -2); ctx.lineTo(-26, -7); ctx.lineTo(-24, 0); ctx.lineTo(-26, 7); ctx.lineTo(-12, 4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#e8a32a"; ctx.beginPath(); ctx.ellipse(0, 1, 16, 13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#f6d36b"; ctx.beginPath(); ctx.ellipse(2, 5, 11, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.translate(-2, -1); ctx.rotate(wingAngle * 0.7);
    ctx.fillStyle = "#b97816"; ctx.beginPath(); ctx.ellipse(-4, 4, 13, 6, -0.3, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    ctx.fillStyle = "#e8a32a"; ctx.beginPath(); ctx.arc(12, -6, 9, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.translate(-1, -2); ctx.rotate(wingAngle);
    ctx.fillStyle = "#d68f1f"; ctx.beginPath(); ctx.ellipse(-3, 3, 15, 7, -0.25, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#8a5510"; ctx.beginPath(); ctx.ellipse(-9, 4, 7, 3, -0.25, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(15, -8, 4.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#1a1a1a"; ctx.beginPath(); ctx.arc(16.5, -8, 2.1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(15.6, -9, 0.8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#f4922e"; ctx.beginPath(); ctx.moveTo(20, -8); ctx.lineTo(31, -5); ctx.lineTo(20, -3); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#d9781c"; ctx.beginPath(); ctx.moveTo(20, -3); ctx.lineTo(31, -5); ctx.lineTo(20, -1); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function draw() {
    ctx.fillStyle = "#4ec0ca"; ctx.fillRect(0, 0, W, H);
    for (const p of pipes) {
      ctx.fillStyle = "#5ca821"; ctx.fillRect(p.x, 0, PIPE_W, p.top); ctx.fillRect(p.x, p.top + GAP, PIPE_W, H - GROUND_H - (p.top + GAP));
      ctx.fillStyle = "#74c441"; ctx.fillRect(p.x - 4, p.top - 24, PIPE_W + 8, 24); ctx.fillRect(p.x - 4, p.top + GAP, PIPE_W + 8, 24);
      ctx.strokeStyle = "#3c7016"; ctx.lineWidth = 2; ctx.strokeRect(p.x, 0, PIPE_W, p.top); ctx.strokeRect(p.x, p.top + GAP, PIPE_W, H - GROUND_H - (p.top + GAP));
    }
    ctx.fillStyle = "#ded895"; ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
    ctx.fillStyle = "#83b53c"; ctx.fillRect(0, H - GROUND_H, W, 14);
    drawBird();
    ctx.fillStyle = "#fff"; ctx.strokeStyle = "#000"; ctx.lineWidth = 4; ctx.font = "bold 44px system-ui, sans-serif"; ctx.textAlign = "center";
    ctx.strokeText(score, W / 2, 70); ctx.fillText(score, W / 2, 70);
    if (state === "ready") banner("Tap to start", "Flap through the pipes");
    else if (state === "dead") banner(score >= best && score > 0 ? "New best!" : "Game over", "Tap to retry");
  }
  function banner(title, sub) {
    ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(0, 0, W, H); ctx.textAlign = "center";
    ctx.fillStyle = "#fff"; ctx.font = "bold 36px system-ui, sans-serif"; ctx.fillText(title, W / 2, H / 2 - 60);
    const cardW = 220, cardH = 86, cx = (W - cardW) / 2, cy = H / 2 - 30;
    ctx.fillStyle = "rgba(255,255,255,0.12)"; roundRect(cx, cy, cardW, cardH, 14); ctx.fill();
    ctx.textAlign = "left"; ctx.fillStyle = "#cfe9ec"; ctx.font = "16px system-ui, sans-serif";
    ctx.fillText("This run", cx + 22, cy + 32); ctx.fillText("Best", cx + 22, cy + 66);
    ctx.textAlign = "right"; ctx.fillStyle = "#fff"; ctx.font = "bold 26px system-ui, sans-serif";
    ctx.fillText(state === "dead" ? score : 0, cx + cardW - 22, cy + 36);
    ctx.fillStyle = "#f9d71c"; ctx.fillText(Math.max(best, score), cx + cardW - 22, cy + 70);
    ctx.textAlign = "center"; ctx.fillStyle = "#fff"; ctx.font = "17px system-ui, sans-serif";
    ctx.fillText(sub, W / 2, H / 2 + 92);
  }
  function loop() { update(); draw(); requestAnimationFrame(loop); }

  canvas.addEventListener("mousedown", function (e) { e.preventDefault(); flap(); });
  canvas.addEventListener("touchstart", function (e) { e.preventDefault(); flap(); }, { passive: false });
  window.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.key === " " || e.key === "ArrowUp") { e.preventDefault(); flap(); }
  });

  reset();
  loop();
  loadMe();
  refreshBoard();
})();
</script>
</body>
</html>
