<!DOCTYPE html>
<html lang="en">
<head>
<script src="/arcade/_sdk/compat.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Hide and Seek</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87ceeb; font-family: -apple-system, "Segoe UI", sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .panel { background: rgba(15,20,30,.72); border-radius: 10px; backdrop-filter: blur(4px); }

  #hud { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  #role { font-size: 15px; font-weight: 700; letter-spacing: .08em; padding: 3px 12px; border-radius: 99px; display: inline-block; }
  #role.hider { background: #2e9e5b; } #role.seeker { background: #d6443c; }
  #timer { font-size: 54px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
  #sub { font-size: 14px; opacity: .9; }

  #menu { position: fixed; top: 10px; right: 10px; width: 132px; padding: 6px 8px 8px; font-size: 12px; }
  #menu header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 700; }
  #menu .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 6px; }
  #menu.closed .swatches { display: none; }
  .sw { aspect-ratio: 1; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); cursor: pointer; padding: 0; }
  .sw.on { border-color: #fff; box-shadow: 0 0 0 2px #fff3; }

  #cross { position: fixed; left: 50%; top: 50%;  width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1.5px rgba(0,0,0,.6); pointer-events: none; }
  #cool { position: fixed; left: 50%; top: calc(50% + 16px); width: 46px; height: 5px; margin-left: -23px; background: rgba(0,0,0,.45); border-radius: 3px; overflow: hidden; pointer-events: none; display: none; }
  #cool i { display: block; height: 100%; width: 0; background: #5ad1ff; }
  #toast { position: fixed; top: 28%; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,.7); opacity: 0; transition: opacity .25s; pointer-events: none; text-align: center; }
  #help { position: fixed; left: 10px; bottom: 10px; font-size: 12px; padding: 6px 10px; line-height: 1.5; opacity: .85; }

  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8,12,20,.55); }
  #overlay .card { width: min(92vw, 400px); padding: 24px 26px; text-align: center; }
  #overlay h1 { margin: 0 0 4px; font-size: 32px; }
  #overlay p { margin: 6px 0; opacity: .85; font-size: 14px; }
  #slots { margin: 14px 0; text-align: left; font-size: 13px; }
  #slots div { padding: 3px 8px; border-radius: 6px; display: flex; justify-content: space-between; }
  #slots div:nth-child(odd) { background: rgba(255,255,255,.06); }
  #slots em { opacity: .6; font-style: normal; }
  button.big { margin-top: 8px; padding: 11px 30px; font-size: 17px; font-weight: 700; color: #fff; background: #2e7de0; border: 0; border-radius: 9px; cursor: pointer; }
  button.big:hover { background: #3b8cf0; }
  #result { font-size: 38px; font-weight: 800; margin: 0 0 4px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="role" class="hider">HIDER</div>
  <div id="timer">30</div>
  <div id="sub"></div>
</div>

<div id="menu" class="panel">
  <header id="menuHead"><span>Color</span><span id="menuArrow">▾</span></header>
  <div class="swatches" id="swatches"></div>
 <button id="shapeBtn" style="margin-top:7px;width:100%;font-size:11px;padding:3px 0;border-radius:6px;border:1px solid #fff5;background:#fff1;color:#fff;cursor:pointer">Shape: Bean ▸</button>
  <button id="fxBtn" style="margin-top:7px;width:100%;font-size:11px;padding:3px 0;border-radius:6px;border:1px solid #fff5;background:#fff1;color:#fff;cursor:pointer">Quality: Ultra</button>
</div>

<div id="cross"></div>
<div id="cool"><i></i></div>
<div id="toast"></div>
<div id="help" class="panel">WASD move · Space jump · two-finger drag turn camera · click to shoot (seeker)</div>

<div id="overlay"><div class="card panel">
  <h1 id="ovTitle">Hide &amp; Seek</h1>
  <p id="ovText">5 hiders, 2 seekers, 30 seconds. Roles are random.</p>
  <p id="ovWait" style="min-height:2.6em"></p>
  <div id="slots"></div>
  <button class="big" id="startBtn">Play</button>
</div></div>

<script src="./three.min.js"></script>
<script src="./CopyShader.js"></script>
<script src="./LuminosityHighPassShader.js"></script>
<script src="./EffectComposer.js"></script>

<script src="./ShaderPass.js"></script>
<script src="./MaskPass.js"></script>

<script>
'use strict';

const CFG = {
  SLOTS: 7, SEEKERS: 2,
  HEAD_START: 5, ROUND_TIME: 30,
  CHAR_H: 1.2, CHAR_R: 0.3, STEP: 0.5, GRAVITY: 45,
  SPEED: 8, JUMP_V: 22, BOT_HIDER_SPEED: 7, BOT_FLEE_SPEED: 7.8, BOT_SEEKER_SPEED: 6.3,
  SHOT_COOLDOWN: 1.0, SHOT_RANGE: 1e5, SOFT_PEEK: 5,
  ATTIC_Y: 16,
};

const PALETTE = [
  ['Black', 0x151515], ['White', 0xf4f4f4], ['Red', 0xe03c3c], ['Orange', 0xf08a24], ['Yellow', 0xf2d12e],
  ['Green', 0x2eb04f], ['Blue', 0x2f6fe0], ['Purple', 0x8a4fd0], ['Pink', 0xf277b8], ['Brown', 0x7a4a2a],
];

// ---------------------------------------------------------------- networking
// Online play: a small room server (hide-and-seek-server/) relays messages. The first player in a room is the
// host and runs the simulation (bots, tagging, timer); everyone else sends their own position/shots to the host
// and renders its snapshots. With no server configured the game runs offline with bots filling every slot.
const QS = new URLSearchParams(location.search);
const DEFAULT_SERVER = 'wss://hide-and-seek-server.fly.dev';   // put your deployed game server here, e.g. 'wss://hide-and-seek.example.com'
const SERVER_URL = QS.get('server') || window.HS_SERVER || DEFAULT_SERVER;
const LOBBY_WAIT_MS = 10000;
const Net = {
  ws: null, id: null, connected: false, mode: 'offline', isHost: false, hostId: null,
  lobby: { players: [], endsAt: 0, phase: 'lobby' }, roster: [], offlineEnds: 0, notice: '',
  connect() {
    if (!SERVER_URL) return;
    // Marshellis game pass (docs/game-pass.md): real nickname + the parent's play-time limit. Guests just connect.
    fetch('/api/family/pass', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ room: 'hide-and-seek' }) })
      .then(r => r.status === 403 ? 'NO-TIME' : r.ok ? r.json().then(j => j.pass) : undefined, () => undefined)
      .then(pass => {
        if (pass === 'NO-TIME') { this.notice = 'No play time left today. Do a brain break to earn more!'; this.failed = true; return; }
        this.open(pass);
      });
  },
  open(pass) {
    try { this.ws = new WebSocket(SERVER_URL.replace(/\/$/, '') + '/?room=' + encodeURIComponent(QS.get('room') || 'public') + (pass ? '&pass=' + encodeURIComponent(pass) : '')); } catch (e) { return; }
    this.ws.onopen = () => { this.connected = true; this.send({ type: 'join', hex: player.hex, shape: player.shape }); };
    this.ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (err) { return; } onNet(m); };
    this.ws.onclose = () => { const was = this.connected; if (!was) this.failed = true; this.connected = false; this.lobby.endsAt = 0; if (was) onNetClosed(); };
  },
  send(o) { if (this.connected && this.ws.readyState === 1) this.ws.send(JSON.stringify(o)); },
};
const r2 = v => Math.round(v * 100) / 100;
const rv = v => ({ x: r2(v.x), y: r2(v.y), z: r2(v.z) });

// ---------------------------------------------------------------- renderer / scene
const HAS_FX = !!(THREE.EffectComposer && THREE.UnrealBloomPass && THREE.ShaderPass && THREE.RenderPass);
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !HAS_FX, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const lin = hex => new THREE.Color(hex).convertSRGBToLinear();
const HORIZON = new THREE.Color(0.62, 0.8, 0.97);
scene.fog = new THREE.Fog(HORIZON, 110, 520);
const camera = new THREE.PerspectiveCamera(62, 1, 0.1, 700);

// ---- sky: gradient, sun, drifting clouds (also baked into an environment map for reflections)
const SUN_DIR = new THREE.Vector3(.5, .68, .4).normalize();
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uSun: { value: SUN_DIR }, uTime: { value: 0 }, uDisc: { value: 28 } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.); gl_Position = p.xyww; }`,
  fragmentShader: `
    varying vec3 vDir; uniform vec3 uSun; uniform float uTime, uDisc;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
      return mix(mix(h(i), h(i+vec2(1,0)), f.x), mix(h(i+vec2(0,1)), h(i+vec2(1,1)), f.x), f.y); }
    float fbm(vec2 p){ float a = .5, s = 0.; for(int i = 0; i < 5; i++){ s += a*n(p); p = p*2.03 + 7.1; a *= .5; } return s; }
    void main(){
      vec3 d = normalize(vDir); float y = max(d.y, 0.);
      vec3 zen = vec3(.05, .2, .72), hor = vec3(.62, .8, .97);
      vec3 col = mix(hor, zen, pow(y, .42));
      float sd = max(dot(d, uSun), 0.);
      col += vec3(1., .78, .5) * pow(sd, 6.) * .22 + vec3(1., .85, .6) * pow(sd, 64.) * .6;
      col += vec3(1., .92, .75) * smoothstep(.9993, .9998, sd) * uDisc;
      if (d.y > 0.) {
        vec2 p = d.xz / (d.y + .14) * 1.3 + vec2(uTime * .01, uTime * .004);
        float c = smoothstep(.5, .86, fbm(p));
        float lit = .8 + .35 * pow(sd, 3.);
        col = mix(col, vec3(1., .99, .97) * lit, c * smoothstep(0., .22, d.y) * .92);
      }
      col = mix(col, hor, smoothstep(.0, -.12, d.y));
      gl_FragColor = vec4(col, 1.);
    }`,

const skyGeo = new THREE.SphereGeometry(900, 32, 16);
const skyDome = new THREE.Mesh(skyGeo, skyMat); skyDome.frustumCulled = false; skyDome.renderOrder = -10; scene.add(skyDome);
{
  const pm = new THREE.PMREMGenerator(renderer), s = new THREE.Scene();
  skyMat.uniforms.uDisc.value = 6; s.add(new THREE.Mesh(skyGeo, skyMat));
  scene.environment = pm.fromScene(s).texture;
  skyMat.uniforms.uDisc.value = 28; pm.dispose();
}

// ---- lights (sun follows the player so shadows stay sharp)
scene.add(new THREE.HemisphereLight(lin(0xc4dcff), lin(0x6a7a4a), 0.5));
const sun = new THREE.DirectionalLight(lin(0xfff0d8), 2.6);
const SHADOW_SIZE = Math.min(4096, renderer.capabilities.maxTextureSize), SHADOW_SPAN = 120;
sun.castShadow = true; sun.shadow.mapSize.set(SHADOW_SIZE, SHADOW_SIZE);
Object.assign(sun.shadow.camera, { left: -SHADOW_SPAN / 2, right: SHADOW_SPAN / 2, top: SHADOW_SPAN / 2, bottom: -SHADOW_SPAN / 2, near: 1, far: 420 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.07;
scene.add(sun, sun.target);
function updateSun(x, y, z) {
  const t = SHADOW_SPAN / SHADOW_SIZE;
  sun.target.position.set(Math.round(x / t) * t, y, Math.round(z / t) * t);
  sun.position.copy(SUN_DIR).multiplyScalar(180).add(sun.target.position);
}

// ---- post-processing: HDR + MSAA + bloom, then ACES tone map / grade / vignette / dither
const fx = { on: HAS_FX, level: 0, composer: null, bloom: null, grade: null };
if (HAS_FX) {
  const pr = renderer.getPixelRatio();
  const W = Math.floor(innerWidth * pr), H = Math.floor(innerHeight * pr);
  const rtOpts = { type: THREE.HalfFloatType, format: THREE.RGBAFormat };
  const rt = renderer.capabilities.isWebGL2 ? new THREE.WebGLMultisampleRenderTarget(W, H, rtOpts) : new THREE.WebGLRenderTarget(W, H, rtOpts);
  if (rt.samples !== undefined) rt.samples = 4;
  const comp = fx.composer = new THREE.EffectComposer(renderer, rt);
  fx.renderPass = new THREE.RenderPass(scene, camera);
  comp.addPass(fx.renderPass);
  if (THREE.SSAOPass) try {   // ambient occlusion: contact shadows in corners, under furniture, around the character
    const ao = new THREE.SSAOPass(scene, camera, W, H);
    ao.kernelRadius = 1.4; ao.minDistance = .0004; ao.maxDistance = .006;
    ao.beautyRenderTarget.dispose();
    ao.beautyRenderTarget = renderer.capabilities.isWebGL2 ? new THREE.WebGLMultisampleRenderTarget(W, H, rtOpts) : new THREE.WebGLRenderTarget(W, H, rtOpts);
    if (ao.beautyRenderTarget.samples !== undefined) ao.beautyRenderTarget.samples = 4;
    comp.addPass(ao); fx.ssao = ao;
  } catch (e) { console.warn('SSAO unavailable', e); }
  fx.bloom = new THREE.UnrealBloomPass(new THREE.Vector2(W, H), 0.32, 0.65, 0.88);
  comp.addPass(fx.bloom);
  fx.grade = new THREE.ShaderPass({
    uniforms: { tDiffuse: { value: null }, uTime: { value: 0 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
    fragmentShader: `
      uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv;
      vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14), 0., 1.); }
      void main(){
        vec3 c = texture2D(tDiffuse, vUv).rgb * 1.05;
        c = aces(c);
        float l = dot(c, vec3(.2126, .7152, .0722));
        c = mix(vec3(l), c, 1.14);                                  // a touch more saturation
        c = mix(c, c * vec3(1.04, 1.0, .93), smoothstep(.4, 1., l)); // warm highlights
        vec2 d = vUv - .5; c *= 1. - dot(d, d) * .85;               // vignette
        c = pow(c, vec3(1. / 2.2));
        c += (fract(sin(dot(vUv * 1000. + uTime, vec2(12.9898, 78.233))) * 43758.5453) - .5) / 255.;
        gl_FragColor = vec4(c, 1.);
      }`,
  });
  comp.addPass(fx.grade);
}
// quality: 2 = ultra (AO + bloom + grade), 1 = high (bloom + grade), 0 = plain
function setFx(level) {
  if (!HAS_FX) level = 0;
  if (level === 2 && !fx.ssao) level = 1;
  fx.level = level; fx.on = level >= 1;
  if (fx.ssao) { fx.ssao.enabled = level === 2; fx.renderPass.enabled = level !== 2; }
  renderer.toneMapping = fx.on ? THREE.NoToneMapping : THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
}
setFx(2);
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  const pr = renderer.getPixelRatio();
  if (fx.composer) fx.composer.setSize(Math.floor(innerWidth * pr), Math.floor(innerHeight * pr));
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
function renderFrame(time) {
  skyDome.position.copy(camera.position); skyMat.uniforms.uTime.value = time * .001;
  if (fx.on) { fx.grade.uniforms.uTime.value = time * .001 % 100; fx.composer.render(); } else renderer.render(scene, camera);
}

// ---- procedural textures (neutral grey detail maps; material colour tints them) ----
let _ts = 1234567; const trnd = () => { _ts = (_ts * 1664525 + 1013904223) >>> 0; return _ts / 4294967296; };
const TEX_SCALE = { grass: 6, wood: 8, plaster: 10, tile: 8, shingle: 9, concrete: 10, fabric: 3, bark: 6, leaf: 3, cardboard: 6, brick: 8 };
const texCache = {};
function wrapped(ctx, n, x, y, r, fn) { for (const dx of [-n, 0, n]) for (const dy of [-n, 0, n]) if (x + dx > -r && x + dx < n + r && y + dy > -r && y + dy < n + r) fn(x + dx, y + dy); }
const g = v => { v = Math.max(0, Math.min(255, v | 0)); return `rgb(${v},${v},${v})`; };
function noiseDots(ctx, n, count, lo, hi, size, alpha) {
  for (let i = 0; i < count; i++) { const x = trnd() * n, y = trnd() * n, s = size * (.4 + trnd());
    ctx.fillStyle = g(lo + trnd() * (hi - lo)); ctx.globalAlpha = alpha; wrapped(ctx, n, x, y, s, (a, b) => ctx.fillRect(a, b, s, s)); }
  ctx.globalAlpha = 1;
}
function blotches(ctx, n, count, rad, alpha) {
  for (let i = 0; i < count; i++) { const x = trnd() * n, y = trnd() * n, r = rad * (.5 + trnd()), dark = trnd() < .5;
    wrapped(ctx, n, x, y, r, (a, b) => { const gr = ctx.createRadialGradient(a, b, 0, a, b, r);
      gr.addColorStop(0, dark ? `rgba(0,0,0,${alpha})` : `rgba(255,255,255,${alpha})`); gr.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = gr; ctx.fillRect(a - r, b - r, r * 2, r * 2); }); }
}
const TEX_GEN = {
  grass(ctx, n) {
    ctx.fillStyle = g(168); ctx.fillRect(0, 0, n, n); blotches(ctx, n, 60, 90, .1);
    for (let i = 0; i < 9000; i++) { const x = trnd() * n, y = trnd() * n, l = 6 + trnd() * 12, a = -Math.PI / 2 + (trnd() - .5) * 1.1;
      ctx.strokeStyle = g(90 + trnd() * 165); ctx.globalAlpha = .55; ctx.lineWidth = 1 + trnd() * .8;
      wrapped(ctx, n, x, y, l, (px, py) => { ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l); ctx.stroke(); }); }
    ctx.globalAlpha = 1;
  },
  wood(ctx, n) {
    const pw = n / 4;
    for (let p = 0; p < 4; p++) {
      ctx.fillStyle = g(150 + trnd() * 70); ctx.fillRect(p * pw, 0, pw, n);
      for (let i = 0; i < 70; i++) { const x = p * pw + trnd() * pw, w = .5 + trnd() * 1.6; ctx.fillStyle = g(90 + trnd() * 150); ctx.globalAlpha = .22;
        let y = 0; ctx.beginPath(); ctx.moveTo(x, 0); for (; y <= n; y += 32) ctx.lineTo(x + Math.sin(y * .02 + i) * 2.2, y); ctx.lineTo(x + w, n); ctx.lineTo(x + w, 0); ctx.fill(); }
      ctx.globalAlpha = 1;
      if (trnd() < .7) { const kx = p * pw + pw * (.25 + trnd() * .5), ky = trnd() * n; ctx.fillStyle = g(90); ctx.globalAlpha = .5;
        wrapped(ctx, n, kx, ky, 14, (a, b) => { ctx.beginPath(); ctx.ellipse(a, b, 5, 10, 0, 0, 7); ctx.fill(); }); ctx.globalAlpha = 1; }
      ctx.fillStyle = g(40); ctx.fillRect(p * pw, 0, 3, n);
    }
    for (let i = 0; i < 6; i++) { ctx.fillStyle = g(50); ctx.fillRect(0, (i * n / 6 + trnd() * 40), n, 0); }
  },
  plaster(ctx, n) { ctx.fillStyle = g(228); ctx.fillRect(0, 0, n, n); blotches(ctx, n, 40, 110, .05); noiseDots(ctx, n, 9000, 195, 250, 2, .5); },
  tile(ctx, n) {
    ctx.fillStyle = g(60); ctx.fillRect(0, 0, n, n); const t = n / 4;
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { ctx.fillStyle = g(((i + j) & 1 ? 215 : 238) + trnd() * 10); ctx.fillRect(i * t + 3, j * t + 3, t - 6, t - 6); }
    noiseDots(ctx, n, 4000, 170, 255, 2, .25);
  },
  shingle(ctx, n) {
    ctx.fillStyle = g(50); ctx.fillRect(0, 0, n, n); const rh = n / 12, sw = n / 6;
    for (let r = 0; r < 12; r++) for (let c = 0; c < 6; c++) { const x = c * sw + (r & 1 ? sw / 2 : 0), y = r * rh;
      ctx.fillStyle = g(150 + trnd() * 90);
      wrapped(ctx, n, x, y, sw, (a, b) => { ctx.beginPath(); ctx.moveTo(a + 2, b); ctx.lineTo(a + sw - 2, b); ctx.lineTo(a + sw - 2, b + rh - 8); ctx.quadraticCurveTo(a + sw / 2, b + rh + 4, a + 2, b + rh - 8); ctx.fill(); }); }
    noiseDots(ctx, n, 3000, 80, 200, 2, .2);
  },
  concrete(ctx, n) { ctx.fillStyle = g(190); ctx.fillRect(0, 0, n, n); blotches(ctx, n, 60, 80, .12); noiseDots(ctx, n, 14000, 120, 255, 2, .35);
    ctx.strokeStyle = g(90); ctx.globalAlpha = .4; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, n / 3); ctx.lineTo(n, n / 3); ctx.moveTo(n / 2, 0); ctx.lineTo(n / 2, n); ctx.stroke(); ctx.globalAlpha = 1; },
  fabric(ctx, n) { ctx.fillStyle = g(205); ctx.fillRect(0, 0, n, n);
    for (let i = 0; i < n; i += 4) { ctx.fillStyle = g(150); ctx.globalAlpha = .35; ctx.fillRect(i, 0, 1.5, n); ctx.fillRect(0, i, n, 1.5); }
    ctx.globalAlpha = 1; noiseDots(ctx, n, 8000, 160, 255, 2, .25); },
  bark(ctx, n) { ctx.fillStyle = g(135); ctx.fillRect(0, 0, n, n);
    for (let i = 0; i < 380; i++) { const x = trnd() * n, w = 1 + trnd() * 7; ctx.fillStyle = g(55 + trnd() * 150); ctx.globalAlpha = .6;

// sunbeams slanting in through the sun-side windows, with dust floating in them
function buildShafts() {
  const d = SUN_DIR.clone().negate();
  const shaftMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    vertexShader: 'attribute float aA; varying float vA; void main(){ vA = aA; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
    fragmentShader: 'varying float vA; void main(){ gl_FragColor = vec4(vec3(1., .82, .55) * pow(vA, 1.6) * .16, 1.); }',
  });
  const dustMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: { uTime: skyMat.uniforms.uTime },
    vertexShader: `uniform float uTime; attribute float aSeed; void main(){
      vec3 p = position + vec3(sin(uTime*.4 + aSeed*6.), sin(uTime*.3 + aSeed*9.), cos(uTime*.35 + aSeed*4.)) * .6;
      vec4 mv = modelViewMatrix * vec4(p, 1.); gl_Position = projectionMatrix * mv; gl_PointSize = clamp(110. * (.5 + aSeed) / -mv.z, 1., 6.); }`,
    fragmentShader: 'void main(){ float r = length(gl_PointCoord - .5); if (r > .5) discard; gl_FragColor = vec4(vec3(1., .9, .7) * (1. - r * 2.) * .9, 1.); }',
  });
  const pos = [], alpha = [], dustPos = [], dustSeed = [];
  const addShaft = (corners) => {
    const far = corners.map(v => v.clone().addScaledVector(d, Math.min(16, v.y / Math.max(d.y * -1, .01))));
    for (let i = 0; i < 4; i++) {
      const j = (i + 1) % 4, n0 = corners[i], n1 = corners[j], f0 = far[i], f1 = far[j];
      [[n0, 1], [n1, 1], [f1, 0], [n0, 1], [f1, 0], [f0, 0]].forEach(([v, a]) => { pos.push(v.x, v.y, v.z); alpha.push(a); });
    }
    for (let k = 0; k < 40; k++) {
      const u = Math.random(), w = Math.random(), t = Math.random();
      const nb = corners[0].clone().lerp(corners[1], u), nt = corners[3].clone().lerp(corners[2], u), nv = nb.lerp(nt, w);
      const fb = far[0].clone().lerp(far[1], u), ft = far[3].clone().lerp(far[2], u), fv = fb.lerp(ft, w);
      const p = nv.lerp(fv, t * .9); if (p.y < .5) continue;
      dustPos.push(p.x, p.y, p.z); dustSeed.push(Math.random());
    }
  };
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  for (const [a, b] of [[-46, -36], [-16, -6], [4, 14], [34, 44]]) addShaft([V(a, 4, -21), V(b, 4, -21), V(b, 11, -21), V(a, 11, -21)]);
  for (const [a, b] of [[-84, -72], [-58, -46], [-40, -28]]) addShaft([V(49, 4, a), V(49, 4, b), V(49, 11, b), V(49, 11, a)]);
  const g1 = new THREE.BufferGeometry(); g1.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g1.setAttribute('aA', new THREE.Float32BufferAttribute(alpha, 1));
  const m1 = new THREE.Mesh(g1, shaftMat); m1.frustumCulled = false; m1.renderOrder = 3; scene.add(m1);
  const g2 = new THREE.BufferGeometry(); g2.setAttribute('position', new THREE.Float32BufferAttribute(dustPos, 3)); g2.setAttribute('aSeed', new THREE.Float32BufferAttribute(dustSeed, 1));
  const m2 = new THREE.Points(g2, dustMat); m2.frustumCulled = false; m2.renderOrder = 4; scene.add(m2);
}

// ---------------------------------------------------------------- geometry queries
function floorAt(x, z, y) {
  let best = 0;
  for (const f of floors) {
    if (x < f.minx || x > f.maxx || z < f.minz || z > f.maxz) continue;
    const fy = f.ramp ? f.y1 * clamp((f.x0 - x) / (f.x0 - f.x1), 0, 1) : f.y;
    if (fy <= y + CFG.STEP && fy > best) best = fy;
  }
  for (const b of colliders) {   // tops of furniture, books, etc. are landable
    if (b.maxy > best && b.maxy <= y + CFG.STEP && x > b.minx && x < b.maxx && z > b.minz && z < b.maxz) best = b.maxy;
  }
  return best;
}

function collide(c) {
  const R = CFG.CHAR_R;
  for (let it = 0; it < 2; it++) for (const b of colliders) {
    if (b.maxy <= c.y + CFG.STEP || b.miny >= c.y + CFG.CHAR_H) continue;
    const nx = clamp(c.x, b.minx, b.maxx), nz = clamp(c.z, b.minz, b.maxz);
    const dx = c.x - nx, dz = c.z - nz, d2 = dx * dx + dz * dz;
    if (d2 >= R * R) continue;
    if (d2 > 1e-8) { const d = Math.sqrt(d2), k = (R - d) / d; c.x += dx * k; c.z += dz * k; }
    else {
      const l = c.x - b.minx, r = b.maxx - c.x, t = c.z - b.minz, bt = b.maxz - c.z, m = Math.min(l, r, t, bt);
      if (m === l) c.x = b.minx - R; else if (m === r) c.x = b.maxx + R; else if (m === t) c.z = b.minz - R; else c.z = b.maxz + R;
    }
  }
}

function physics(c, dt) {
  const fl = floorAt(c.x, c.z, c.y);
  if (c.grounded && fl <= c.y + CFG.STEP && c.y - fl < 0.8) { c.y = fl; c.vy = 0; }
  else {
    const oy = c.y;
    c.vy -= CFG.GRAVITY * dt; c.y += c.vy * dt;
    if (c.vy > 0) for (const b of colliders) {   // bonk your head on tables, slabs, shelves
      if (b.miny >= oy + CFG.CHAR_H - .01 && c.y + CFG.CHAR_H > b.miny && c.x > b.minx - .2 && c.x < b.maxx + .2 && c.z > b.minz - .2 && c.z < b.maxz + .2) { c.y = b.miny - CFG.CHAR_H; c.vy = 0; }
    }
    if (c.vy <= 0 && c.y <= fl) { c.y = fl; c.vy = 0; c.grounded = true; } else c.grounded = false;
  }
}

// ray vs AABB: returns [tmin, tmax] or null
function rayBox(ox, oy, oz, dx, dy, dz, b) {
  let t0 = -Infinity, t1 = Infinity;
  const slab = (o, d, lo, hi) => {
    if (Math.abs(d) < 1e-9) return o >= lo && o <= hi;
    let a = (lo - o) / d, c = (hi - o) / d; if (a > c) { const t = a; a = c; c = t; }
    if (a > t0) t0 = a; if (c < t1) t1 = c; return t0 <= t1;
  };
  if (!slab(ox, dx, b.minx, b.maxx) || !slab(oy, dy, b.miny, b.maxy) || !slab(oz, dz, b.minz, b.maxz)) return null;
  return t1 < 0 ? null : [t0, t1];
}
// nearest blocking distance along a ray (Infinity if clear). Bushes only block when the target is farther than SOFT_PEEK.
function blockT(ox, oy, oz, dx, dy, dz, maxT, targetDist, hardOnly) {
  let best = Infinity;
  for (const b of colliders) { const r = rayBox(ox, oy, oz, dx, dy, dz, b); if (r && r[0] > 0 && r[0] < maxT && r[0] < best) best = r[0]; }
  if (!hardOnly && targetDist > CFG.SOFT_PEEK) for (const b of softs) { const r = rayBox(ox, oy, oz, dx, dy, dz, b); if (r && r[0] > 0 && r[0] < maxT && r[0] < best) best = r[0]; }
  return best;
}
function raySphere(o, d, cx, cy, cz, r) {
  const mx = o.x - cx, my = o.y - cy, mz = o.z - cz;
  const b = mx * d.x + my * d.y + mz * d.z, c = mx * mx + my * my + mz * mz - r * r;
  if (c > 0 && b > 0) return null;
  const disc = b * b - c; if (disc < 0) return null;
  return Math.max(0, -b - Math.sqrt(disc));
}
function hasLOS(a, b) {
  const ox = a.x, oy = a.y + .7, oz = a.z, dx = b.x - ox, dy = b.y + .6 - oy, dz = b.z - oz, L = Math.hypot(dx, dy, dz);
  return blockT(ox, oy, oz, dx / L, dy / L, dz / L, L - .5, L, false) === Infinity;
}

// round, glossy eyes sitting on the face surface (f = ellipsoid or box describing the head)
function addEyes(rig, f) {
  const er = Math.min(f.rx, f.ry) * .4;
  for (const sd of [-1, 1]) {
    const ex = f.cx + sd * f.rx * .42, ey = f.cy + f.ry * .1;
    const ez = f.flat ? f.cz + f.rz - er * .3 : f.cz + f.rz * Math.sqrt(Math.max(0, 1 - .42 * .42 - .1 * .1)) - er * .15;
    part(sphG, eyeMat, er, er, er * .9, ex, ey, ez, rig);
    part(sphG, pupilMat, er * .55, er * .55, er * .5, ex, ey, ez + er * .7, rig);
    part(sphG, glintMat, er * .18, er * .18, er * .18, ex + er * .2, ey + er * .25, ez + er * 1.05, rig);
  }
}

    a.replan = (a.replan || 0) - dt;
    if (a.replan <= 0) { a.replan = .6; setGoal(c, t.x, t.z, t.y); }
    if (d > 4.5) followPath(c, CFG.BOT_SEEKER_SPEED, dt); else c.yaw = Math.atan2(t.x - c.x, t.z - c.z);
    return;
  }
  if (!a.path || !a.path.length) {
    if (Math.random() < .3) setGoal(c, -90 + Math.random() * 180, -10 + Math.random() * 90, 0);
    else { const s = hideSpots[Math.floor(Math.random() * hideSpots.length)]; setGoal(c, s.x, s.z, s.y); }
  }
  followPath(c, CFG.BOT_SEEKER_SPEED, dt);
  if (stuckCheck(c, dt)) a.path = null;
}

// ---------------------------------------------------------------- main update
function playerMove(c, dt) {
  let f = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0);
  let r = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
  const frozen = game.state === 'countdown' && c.role === 'seeker';
  if (frozen) f = r = 0;
  if (keys[' '] && c.grounded && !frozen) { c.vy = CFG.JUMP_V; c.grounded = false; }
  if (!f && !r) return;
  const sy = Math.sin(cam.yaw), cy = Math.cos(cam.yaw);
  let mx = -sy * f + cy * r, mz = -cy * f - sy * r; const L = Math.hypot(mx, mz); mx /= L; mz /= L;
  c.x += mx * CFG.SPEED * dt; c.z += mz * CFG.SPEED * dt; collide(c);
  if (c.faceT <= 0) c.yaw = Math.atan2(mx, mz);
  c.moving = true;
}

// characters simulated elsewhere (other humans; on clients, everyone but you): glide toward the last received state
function puppetStep(c, dt) {
  if (c.tx === undefined) return;
  const k = Math.min(1, dt * 14);
  c.x += (c.tx - c.x) * k; c.y += (c.ty - c.y) * k; c.z += (c.tz - c.z) * k;
  let da = c.tyaw - c.yaw; da = Math.atan2(Math.sin(da), Math.cos(da)); c.yaw += da * k;
  c.moving = !!c.rmoving;
}
function setTarget(c, x, y, z, yaw, moving) {
  c.tx = x; c.ty = y; c.tz = z; c.tyaw = yaw; c.rmoving = moving;
  if (!c.seeded) { c.seeded = true; c.x = x; c.y = y; c.z = z; c.yaw = yaw; }
}

// ---- network message handlers
function onNet(m) {
  switch (m.type) {
    case 'welcome': Net.id = m.id; break;
    case 'full': Net.notice = 'That room is full (7 players).'; break;
    case 'timeup': Net.notice = "That's all the play time for today!"; break;
    case 'signin': Net.notice = 'Please sign in to play online.'; break;
    case 'lobby': Net.hostId = m.hostId; Net.notice = ''; Net.lobby = { players: m.players, phase: m.phase, endsAt: m.startsIn ? performance.now() + m.startsIn : 0 }; break;
    case 'start':
      Net.roster = m.humans; Net.hostId = m.hostId; Net.isHost = m.hostId === Net.id; Net.mode = Net.isHost ? 'host' : 'client'; Net.lobby.endsAt = 0;
      if (Net.isHost) startRound(); else game.state = 'joining';
      break;
    case 'init': if (Net.mode === 'client') onInit(m); break;
    case 'snap': if (Net.mode === 'client') onSnap(m); break;
    case 'end': if (Net.mode === 'client' && player) showEnd(m.seekersWin); break;
    case 'fx': if (m.s !== Net.id) { spawnStream(m.tip, m.end); if (m.sp) splash(m.end, m.hit ? 6 : 4); } break;
    case 'tag': onTag(m); break;
    case 'state': if (Net.mode === 'host') { const c = byId(m.id); if (c && c.remote) setTarget(c, m.x, m.y, m.z, m.yaw, !!m.m); } break;
    case 'shoot': if (Net.mode === 'host') onRemoteShoot(m); break;
    case 'profile': { const c = byId(m.id); if (c) { setColor(c, m.hex); if (c.shape !== m.shape && SHAPES[m.shape]) setShape(c, m.shape); } break; }
    case 'left': if (Net.mode === 'host') { const c = byId(m.id); if (c) { c.remote = false; c.puppet = false; c.isBot = true; c.ai = {}; } } break;
    case 'abort': abortToLobby(m.reason); break;
  }
}
function onNetClosed() {
  if (Net.mode === 'client' && (game.state === 'playing' || game.state === 'countdown' || game.state === 'joining')) abortToLobby('Lost connection to the server.');
  else Net.notice = 'Lost connection to the server — playing offline.';
}
function onInit(m) {
  const me = m.roster.find(r => r.id === Net.id); if (!me) return;
  chars.forEach(c => scene.remove(c.g));
  chars = m.roster.map(r => { const c = makeChar(r.id, r.name, r.hex, r.id === Net.id, r.shape); c.puppet = r.id !== Net.id; c.isBot = r.bot; return c; });
  player = chars.find(c => c.isLocal);
  cam.yaw = 0; cam.pitch = .35; Net.roleToast = false;
  game.state = 'countdown'; game.countdown = CFG.HEAD_START; game.t = CFG.ROUND_TIME;
  document.getElementById('overlay').style.display = 'none';
}
function onSnap(m) {
  if (!player || game.state === 'lobby' || game.state === 'joining') return;
  if (m.st === 'playing' && game.state === 'countdown') toast('GO!', 800);
  if (game.state !== 'over') game.state = m.st;
  game.t = m.t; game.countdown = m.cd;
  for (const e of m.c) {
    const c = byId(e[0]); if (!c) continue;
    const role = e[5] ? 'seeker' : 'hider';
    if (c.role !== role) setRole(c, role);
    if (c.isLocal) { if (!c.seeded) { c.seeded = true; c.x = e[1]; c.y = e[2]; c.z = e[3]; } } else setTarget(c, e[1], e[2], e[3], e[4], !!e[6]);
  }
  if (!Net.roleToast) { Net.roleToast = true; toast(player.role === 'seeker' ? 'You are a SEEKER — wait for the countdown' : 'You are a HIDER — go hide!', 2600); }
}
function onTag(m) {
  const t = byId(m.target); if (!t || Net.mode !== 'client') return;
  if (t.role !== 'seeker') { setRole(t, 'seeker'); t.cooldown = 1.5; }
  splash({ x: t.x, y: t.y + .8, z: t.z }, 14);
  if (m.target === Net.id) toast('You got splashed — you\'re a seeker now!', 2200);
  else if (m.by === Net.id) toast(`Splashed ${t.name}!`, 1400);
}
function onRemoteShoot(m) {
  const c = byId(m.id);
  if (!c || !c.remote || c.role !== 'seeker' || game.state !== 'playing' || c.cooldown > .2) return;
  c.yaw = Math.atan2(m.d.x, m.d.z);
  fire(c, m.o, m.d);
}
function abortToLobby(reason) {
  Net.mode = 'offline'; Net.notice = reason || '';
  game.state = 'lobby';
  chars.forEach(c => scene.remove(c.g)); chars = []; buildRoster();
  chars.forEach((c, i) => { c.x = -15 + i * 5; c.z = -6; });
  $('ovTitle').textContent = 'Hide & Seek'; $('ovText').textContent = '5 hiders, 2 seekers, 30 seconds. Roles are random.';
  $('startBtn').disabled = false; $('overlay').style.display = 'flex';
}

// send our state / snapshots 20x per second
setInterval(() => {
  if (!Net.connected || !player) return;
  if (game.state !== 'countdown' && game.state !== 'playing') return;
  if (Net.mode === 'client') Net.send({ type: 'state', x: r2(player.x), y: r2(player.y), z: r2(player.z), yaw: r2(player.yaw), m: player.moving ? 1 : 0 });
  else if (Net.mode === 'host') Net.send({ type: 'snap', st: game.state, t: r2(game.t), cd: r2(game.countdown), c: chars.map(c => [c.id, r2(c.x), r2(c.y), r2(c.z), r2(c.yaw), c.role === 'seeker' ? 1 : 0, c.moving ? 1 : 0]) });
}, 50);

function update(dt) {
  const client = Net.mode === 'client';
  if (game.state === 'countdown') { game.countdown -= dt; if (game.countdown <= 0 && !client) { game.state = 'playing'; toast('GO!', 800); } }
  else if (game.state === 'playing') {
    game.t = Math.max(0, game.t - dt);
    if (!client) { if (chars.every(c => c.role === 'seeker')) endRound(); else if (game.t <= 0) endRound(); }
  }
  const live = game.state === 'countdown' || game.state === 'playing';
  for (const c of chars) {
    c.moving = false; c.cooldown = Math.max(0, c.cooldown - dt); c.faceT = Math.max(0, c.faceT - dt);
    if (live) {
      if (c.puppet) puppetStep(c, dt);
      else {
        if (c.isLocal) playerMove(c, dt);
        else if (c.role === 'hider') hiderAI(c, dt); else seekerAI(c, dt);
        c.x = clamp(c.x, -99, 99); c.z = clamp(c.z, -94, 84);
        physics(c, dt);
      }
    }
    c.g.position.set(c.x, c.y, c.z); c.g.rotation.y = c.yaw;
    c.phase += (c.moving ? dt * 14 : 0);
    const sw = c.moving ? Math.sin(c.phase) : 0, bob = c.moving ? Math.abs(Math.sin(c.phase)) * .06 : 0;
    c.rig.position.y = bob;
    c.legL.rotation.x = sw * .8; c.legR.rotation.x = -sw * .8;
    c.armL.rotation.x = -sw * .7; c.armR.rotation.x = c.role === 'seeker' ? -1.2 : sw * .7;
    c.marker.position.y = c.markerY + Math.sin(performance.now() * .006) * .06; c.marker.rotation.y += dt * 2;
  }
  updateFx(dt);
  updateCamera();
  updateHud();
}

// ---------------------------------------------------------------- HUD / UI
const $ = id => document.getElementById(id);
function updateHud() {
  const role = $('role'); role.textContent = player.role.toUpperCase(); role.className = player.role;
  const left = chars.filter(c => c.role === 'hider').length;
  if (game.state === 'countdown') {
    $('timer').textContent = Math.ceil(game.countdown);
    $('sub').textContent = player.role === 'seeker' ? 'Counting… hiders are running' : 'Hide! Seekers are released soon';
  } else {
    $('timer').textContent = game.t.toFixed(1);
    $('sub').textContent = `Hiders left: ${left}`;
  }
  const showCool = player.role === 'seeker' && game.state === 'playing';
  $('cool').style.display = showCool ? 'block' : 'none';
  if (showCool) $('cool').firstElementChild.style.width = (1 - player.cooldown / CFG.SHOT_COOLDOWN) * 100 + '%';
}
let toastTimer = 0;
function toast(msg, ms) {
  const t = $('toast'); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.opacity = 0, ms);
}

// color menu
PALETTE.forEach(([name, hex], i) => {
  const b = document.createElement('button');
  b.className = 'sw' + (i === 6 ? ' on' : ''); b.title = name; b.style.background = '#' + hex.toString(16).padStart(6, '0');
  b.onclick = () => { if (player) { setColor(player, hex); Net.send({ type: 'profile', hex, shape: player.shape }); } document.querySelectorAll('.sw').forEach(s => s.classList.remove('on')); b.classList.add('on'); };
  $('swatches').appendChild(b);
});
$('shapeBtn').onclick = () => { if (!player) return; const n = SHAPE_NAMES[(SHAPE_NAMES.indexOf(player.shape) + 1) % SHAPE_NAMES.length]; setShape(player, n); Net.send({ type: 'profile', hex: player.hex, shape: n }); $('shapeBtn').textContent = 'Shape: ' + n + ' ▸'; };
const QNAMES = ['Low', 'High', 'Ultra'];
$('fxBtn').onclick = () => { setFx(fx.level === 0 ? 2 : fx.level - 1); $('fxBtn').textContent = 'Quality: ' + QNAMES[fx.level]; };
$('fxBtn').textContent = 'Quality: ' + QNAMES[fx.level];
if (!HAS_FX) $('fxBtn').style.display = 'none';
$('menuHead').onclick = () => { const m = $('menu'); m.classList.toggle('closed'); $('menuArrow').textContent = m.classList.contains('closed') ? '▸' : '▾'; };
for (const id of ['menu', 'overlay', 'help']) {
  $(id).addEventListener('mousedown', e => e.stopPropagation());
  $(id).addEventListener('touchstart', e => e.stopPropagation(), { passive: true });
}

// lobby overlay: who is in, who the bots will fill in for, and the 10-second wait for more players
let slotsSig = '';
function renderSlots() {
  const humans = Net.connected ? Net.lobby.players : [{ id: 'local', name: 'You' }];
  const sig = humans.map(h => h.id).join() + Net.id;
  if (sig === slotsSig) return; slotsSig = sig;
  $('slots').innerHTML = Array.from({ length: CFG.SLOTS }, (_, i) =>
    i < humans.length ? `<div><span>${humans[i].name}${humans[i].id === Net.id || !Net.connected ? ' (you)' : ''}</span><em>player</em></div>` : `<div><span>Bot ${BOT_NAMES[i]}</span><em>AI filler</em></div>`).join('');
}
function tickLobby(now) {
  if ($('overlay').style.display === 'none') return;
  renderSlots();
  const wait = $('ovWait'), btn = $('startBtn');
  if (game.state === 'joining') { wait.textContent = 'Game starting…'; btn.disabled = true; return; }
  const ends = Net.connected ? Net.lobby.endsAt : Net.offlineEnds;
  if (ends) {
    const sec = Math.max(0, Math.ceil((ends - now) / 1000));
    wait.textContent = 'Waiting for more players to join… the game starts when the clock hits 0.';
    btn.disabled = true; btn.textContent = `Starting in ${sec}`;
    if (!Net.connected && now >= ends) { Net.offlineEnds = 0; Net.mode = 'offline'; startRound(); }
    return;
  }
  btn.textContent = game.state === 'over' ? 'Play again' : 'Play';
  if (Net.connected) {
    const busy = Net.lobby.phase === 'playing';
    btn.disabled = busy;
    wait.textContent = Net.notice || (busy ? 'A round is in progress — you can join the next one.' : `Online: ${Net.lobby.players.length} player${Net.lobby.players.length === 1 ? '' : 's'} in this room. Send friends this page's link to play together.`);
  } else wait.textContent = Net.notice || (SERVER_URL && !Net.failed ? 'Connecting to the game server…' : SERVER_URL ? 'Offline: the game server is unreachable right now, so bots fill every spot.' : 'Offline: no game server is set, so bots fill every spot.');
}
$('startBtn').onclick = () => {
  $('startBtn').disabled = true;
  if (Net.connected) Net.send({ type: 'ready' }); else if (!Net.offlineEnds) Net.offlineEnds = performance.now() + LOBBY_WAIT_MS;
};

// idle backdrop behind the lobby
buildRoster(); setColor(player, 0x2f6fe0);
Net.connect();
chars.forEach((c, i) => { c.x = -15 + i * 5; c.z = -6; });
updateCamera();

let last = performance.now();
(function loop(now) {
  const dt = Math.min((now - last) / 1000, .05); last = now;
  tickLobby(now);
  if (game.state === 'lobby' || game.state === 'joining') { cam.yaw += dt * .15; chars.forEach(c => { c.g.position.set(c.x, 0, c.z); }); updateCamera(); }
  else update(dt);
  renderFrame(now);
  requestAnimationFrame(loop);
})(last);

window.__game = { Net, game, get chars() { return chars; }, get player() { return player; }, cam, CFG, startRound, hideSpots };
</script>
</body>
