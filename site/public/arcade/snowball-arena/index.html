<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Snowball Arena</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="hud-side hud-left">
          <div class="namebar">
            <span class="dot" id="youDot"></span>
            <span id="youName">You</span>
          </div>
          <div class="health"><div id="youHealth" class="health-fill"></div></div>
        </div>

        <div class="hud-center">
          <div id="objective" class="status">Snowball Arena</div>
          <div id="score" class="score">0&nbsp;–&nbsp;0</div>
        </div>

        <div class="hud-side hud-right">
          <div id="conn" class="conn">offline</div>
        </div>
      </header>

      <div id="scoreboard" class="scoreboard"></div>

      <div id="stage">
        <canvas id="game"></canvas>

        <div id="overlay" class="overlay">
          <div class="card" id="card">
            <h1>❄️ Snowball Arena</h1>
            <p class="tagline">Hop the bunkers, arc your snowballs, freeze your rivals.</p>

            <div class="modes" id="modes">
              <button class="mode" data-mode="duel">
                <span class="mode-name">Duel</span><span class="mode-sub">1v1 · small</span>
              </button>
              <button class="mode" data-mode="team">
                <span class="mode-name">Teams</span><span class="mode-sub">2v2 · bigger</span>
              </button>
              <button class="mode" data-mode="ffa">
                <span class="mode-name">Free-for-all</span><span class="mode-sub">8 players · huge</span>
              </button>
            </div>

            <div class="teampick" id="teampick" hidden>
              <span class="party-label">Your team</span>
              <div class="teampick-row">
                <button class="team-btn blue" data-team="0">Blue</button>
                <button class="team-btn red" data-team="1">Red</button>
              </div>
            </div>

            <div class="party">
              <div class="party-label">Play with friends — share a code (leave blank for bots)</div>
              <div class="party-row">
                <input id="codeInput" class="code-input" placeholder="CODE" maxlength="8"
                       autocomplete="off" autocapitalize="characters" spellcheck="false" />
                <button id="diceBtn" class="dice" title="Random code">🎲</button>
              </div>
            </div>

            <button id="startBtn" class="btn">Play</button>
            <p class="hint" id="onlineHint"></p>
          </div>
        </div>

        <div id="roundMsg" class="round-msg" hidden></div>

        <div id="touch" class="touch" hidden>
          <div class="pad">
            <button class="tbtn" data-act="left">◀</button>
            <button class="tbtn" data-act="duck">▼</button>
            <button class="tbtn" data-act="right">▶</button>
          </div>
          <div class="pad right">
            <button class="tbtn" data-act="jump">⤒</button>
            <button class="tbtn throw" data-act="throw">❄</button>
          </div>
        </div>
      </div>

      <footer class="footbar">
        <span id="aimMeterWrap" class="meter-wrap">Power <div class="meter"><div id="aimMeter"></div></div></span>
        <span class="spacer"></span>
        <span id="modeTag" class="conn"></span>
      </footer>
    </div>

    <script src="./peerjs.min.js"></script>
    <script src="./net.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
