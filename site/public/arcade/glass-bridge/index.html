<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Glass Bridge</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }   /* beat the #chip/#account display rules */
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 50% 20%, #1b1030 0%, #0a0716 70%);
    color: #f3eefc;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    padding: 14px; user-select: none; -webkit-user-select: none; overflow-x: hidden;
  }
  .col { width: min(94vw, 560px); }
  #top { display: flex; align-items: center; justify-content: space-between; }
  #chip { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  #chip .av { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; background: #ff5d8f; }
  #chip b { color: #ff5d8f; }
  #logout { background: #2a1e42; color: #cfc2e8; border: 0; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  #bestChip { font-size: 14px; color: #cfc2e8; }
  #bestChip b { color: #ffd166; font-size: 16px; }
  #wrap { position: relative; width: min(94vw, 560px); }
  canvas {
    display: block; width: 100%; height: auto; aspect-ratio: 800 / 500;
    background: rgba(0,0,0,0.35);
    border: 2px solid rgba(255,93,143,0.35); border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.45), inset 0 0 60px rgba(0,0,0,0.4);
    touch-action: none; cursor: pointer;
  }
  /* account form */
  #account { background: #1d1433; border-radius: 12px; padding: 14px; }
  #account .atitle { font-size: 14px; font-weight: 600; color: #ff8fb3; margin-bottom: 10px; }
  #account .arow { display: flex; gap: 8px; margin-bottom: 8px; }
  #account input { flex: 1; min-width: 0; padding: 10px 11px; font-size: 15px; border: 1px solid #3a2b5e; border-radius: 9px; background: #0a0716; color: #fff; }
  #account input::placeholder { color: #7a6a9c; }
  #account input:focus { outline: none; border-color: #ff5d8f; }
  #avatars { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 10px; }
  #avatars button { width: 30px; height: 30px; border: 2px solid transparent; border-radius: 8px; background: #0a0716; font-size: 17px; cursor: pointer; line-height: 1; padding: 0; }
  #avatars button.sel { border-color: #ff5d8f; background: #34204a; }
  #account .btns button { flex: 1; font: inherit; font-size: 15px; border: 0; border-radius: 9px; padding: 11px; cursor: pointer; }
  #account .btns .login { background: #2a1e42; color: #e6dcf5; }
  #account .btns .create { background: #ff5d8f; color: #16091f; font-weight: 600; }
  #account button:active { transform: scale(0.98); }
  #amsg { min-height: 17px; font-size: 13px; margin-top: 8px; }
  #amsg.err { color: #ff8a7a; } #amsg.ok { color: #8fe388; } #amsg.busy { color: #94a3b8; }
  .guestnote { font-size: 12px; color: #7a6a9c; margin-top: 8px; }
  /* leaderboard — an overlay on the game screen itself */
  #lb {
    position: absolute; top: 10px; right: 10px; width: 31%; min-width: 128px; max-width: 170px;
    background: linear-gradient(180deg, rgba(26,16,48,0.82), rgba(12,7,26,0.82));
    border: 1px solid rgba(255,209,102,0.45); border-radius: 10px;
    padding: 7px 9px 8px; pointer-events: none;
    box-shadow: 0 4px 18px rgba(0,0,0,0.5), inset 0 0 22px rgba(255,209,102,0.06);
  }
  #lb h2 {
    margin: 0 0 5px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-align: center;
    background: linear-gradient(180deg, #fff3c4 0%, #ffd166 45%, #e0a82e 75%, #ffe9a3 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.7)) drop-shadow(0 0 6px rgba(255,209,102,0.35));
  }
  #lb ol { list-style: none; margin: 0; padding: 0; }
  #lb li { display: flex; align-items: center; gap: 6px; padding: 2.5px 0; font-size: 11px; border-top: 1px solid rgba(255,209,102,0.12); }
  #lb li:first-child { border-top: 0; }
  #lb .rk { width: 17px; color: #b89b4e; text-align: center; flex: none; }
  #lb .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #e8ddfa; }
  #lb .sc { color: #ffd166; font-weight: 700; }
  #lb li.me .nm { color: #fff; font-weight: 700; }
  #lb .empty { color: #9c8ec2; font-size: 11px; padding: 2px 0; text-align: center; }
  /* camera angle button */
  #camBtn {
    position: absolute; top: 10px; left: 10px;
    background: rgba(26,16,48,0.82); color: #e8ddfa;
    border: 1px solid rgba(255,93,143,0.45); border-radius: 999px;
    padding: 6px 12px; font: inherit; font-size: 12px; cursor: pointer;
  }
  #camBtn:active { transform: scale(0.96); }
</style>
</head>
<body>
  <div id="top" class="col">
    <div id="chip" hidden><span class="av" id="avatar">🦊</span><span id="name"></span><button id="logout">Log out</button></div>
    <div id="bestChip">Best <b id="best">0</b></div>
  </div>

  <div id="wrap" class="col">
    <canvas id="game" width="800" height="500"></canvas>
    <div id="lb">
      <h2>🏆 BEST RUNS EVER 🏆</h2>
      <ol id="rows"><li class="empty">Loading…</li></ol>
    </div>
    <button id="camBtn" title="Change camera angle (C, fine-tilt Q/E)">📷 Classic</button>
  </div>

  <div id="account" class="col">
    <div class="atitle">Create an account to join the leaderboard</div>
    <div class="arow">
      <input id="u" type="text" maxlength="20" placeholder="Username" autocomplete="off" autocapitalize="off" />
      <input id="p" type="password" inputmode="numeric" maxlength="8" placeholder="PIN (4–8 digits)" autocomplete="off" />
    </div>
    <div id="avatars"></div>
    <div class="arow btns">
      <button class="login" id="loginBtn">Log in</button>
      <button class="create" id="createBtn">Create account</button>
    </div>
    <div id="amsg"></div>
    <div class="guestnote">…or just play as a guest — your best is saved on this device.</div>
  </div>

<script>
(function () {
  const GAME = "glass-bridge";
  const LS_BEST = "glass-bridge:best";
  // Mirrors the server allowlist (avatars.ts) — off-list values collapse to default.
  const AVATARS = ["🦊","🐼","🐯","🦁","🐸","🐵","🐙","🦄","🐶","🐱","🐧","🐝","🦖","🐢","🦉","🐳"];
  const DEFAULT_COLOR = "#ff5d8f";
  const USER_RE = /^[a-z0-9_-]{3,20}$/;
  const PIN_RE = /^[0-9]{4,8}$/;

  let me = null; // { username, avatar, avatarColor }
  let best = Number(localStorage.getItem(LS_BEST) || 0) || 0;
  let chosenAvatar = AVATARS[0];

  const el = (id) => document.getElementById(id);
  const accountEl = el("account"), chipEl = el("chip"), avatarEl = el("avatar"), nameEl = el("name");
  const bestEl = el("best"), rowsEl = el("rows"), msgEl = el("amsg");
  const uEl = el("u"), pEl = el("p"), loginBtn = el("loginBtn"), createBtn = el("createBtn");

  function showBest() { bestEl.textContent = best; }
  function setMsg(t, k) { msgEl.textContent = t || ""; msgEl.className = k || ""; }
  function busy(on) { loginBtn.disabled = on; createBtn.disabled = on; }
  showBest();

  // avatar picker
  AVATARS.forEach(function (a, i) {
    const b = document.createElement("button");
    b.textContent = a; if (i === 0) b.className = "sel";
    b.onclick = function () {
      chosenAvatar = a;
      [...el("avatars").children].forEach((c) => c.classList.remove("sel"));
      b.classList.add("sel");
    };
    el("avatars").appendChild(b);
  });

  async function api(path, opts) {
    try {
      return await fetch(path, {
        credentials: "same-origin",
        headers: opts && opts.body ? { "content-type": "application/json" } : undefined,
        ...opts,
      });
    } catch (e) { return null; }
  }

  function renderAuthed() {
    if (me) {
      accountEl.hidden = true; chipEl.hidden = false;
      avatarEl.textContent = me.avatar || "🦊";
      avatarEl.style.background = me.avatarColor || DEFAULT_COLOR;
      nameEl.innerHTML = "Playing as <b>" + escapeHtml(me.username) + "</b>";
    } else {
      accountEl.hidden = false; chipEl.hidden = true;
    }
  }

  async function loadMe() {
    const r = await api("/api/me");
    me = r && r.ok ? await r.json() : null;
    renderAuthed();
  }

  function validate() {
    const u = uEl.value.trim().toLowerCase(), p = pEl.value.trim();
    if (!USER_RE.test(u)) { setMsg("Username: 3–20 letters, numbers, - or _.", "err"); return null; }
    if (!PIN_RE.test(p)) { setMsg("PIN must be 4–8 digits.", "err"); return null; }
    return { u, p };
  }

  async function createAccount() {
    const v = validate(); if (!v) return;
    busy(true); setMsg("Creating account…", "busy");
    const r = await api("/api/auth/signup", { method: "POST",
      body: JSON.stringify({ username: v.u, pin: v.p, avatar: chosenAvatar, avatarColor: DEFAULT_COLOR }) });
    if (!r) { setMsg("Network error — try again.", "err"); busy(false); return; }
    if (r.status === 409) { setMsg("Username taken — log in or pick another.", "err"); busy(false); return; }
    if (!r.ok) { setMsg("Check your username and PIN.", "err"); busy(false); return; }
    me = await r.json(); setMsg("Welcome, " + me.username + "!", "ok");
    finishAuth();
  }

  async function login() {
    const v = validate(); if (!v) return;
    busy(true); setMsg("Logging in…", "busy");
    const r = await api("/api/auth/login", { method: "POST", body: JSON.stringify({ username: v.u, pin: v.p }) });
    if (!r) { setMsg("Network error — try again.", "err"); busy(false); return; }
    if (r.status === 429) { setMsg("Too many tries — wait a few minutes.", "err"); busy(false); return; }
    if (!r.ok) { setMsg("Wrong username or PIN.", "err"); busy(false); return; }
    me = await r.json();
    finishAuth();
  }

  function finishAuth() {
    busy(false); uEl.value = ""; pEl.value = "";
    renderAuthed(); refreshBoard();
  }

  async function logout() {
    await api("/api/auth/logout", { method: "POST" });
    me = null; setMsg("", ""); renderAuthed(); refreshBoard();
  }

  loginBtn.onclick = login;
  createBtn.onclick = createAccount;
  el("logout").onclick = logout;
  uEl.addEventListener("keydown", (e) => { if (e.key === "Enter") pEl.focus(); });
  pEl.addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });

  async function submit(score) {
    if (score > (Number(localStorage.getItem(LS_BEST) || 0) || 0)) localStorage.setItem(LS_BEST, String(score));
    if (!me) { best = Number(localStorage.getItem(LS_BEST) || 0) || 0; showBest(); return; }
    const r = await api("/api/scores", { method: "POST", body: JSON.stringify({ game: GAME, score: score }) });
    if (r && r.ok) { const j = await r.json(); best = j.best; showBest(); }
    refreshBoard();
  }

  async function refreshBoard() {
    const r = await api("/api/leaderboard?game=" + GAME + "&limit=10");
    if (!r || !r.ok) return;
    const top = (await r.json()).top || [];
    if (!top.length) { rowsEl.innerHTML = '<li class="empty">No runs yet — be the first!</li>'; return; }
    const MEDALS = ["🥇", "🥈", "🥉"];
    rowsEl.innerHTML = top.map(function (row) {
      const mine = me && row.username === me.username ? ' class="me"' : "";
      const rk = MEDALS[row.rank - 1] || row.rank;
      return "<li" + mine + '><span class="rk">' + rk + '</span><span class="nm">' +
        escapeHtml(row.username) + '</span><span class="sc">' + row.score + "</span></li>";
    }).join("");
    if (me) {
      const mineRow = top.find((r2) => r2.username === me.username);
      if (mineRow && mineRow.score > best) { best = mineRow.score; showBest(); }
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  // ========================== SOUND ==========================
  let actx = null;
  function initAudio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (actx && actx.state === "suspended") actx.resume();
  }
  function tone(freq, dur, type, vol, slideTo) {
    if (!actx) return;
    const t = actx.currentTime;
    const osc = actx.createOscillator(), gain = actx.createGain();
    osc.type = type || "square";
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + (dur || 0.08));
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol || 0.18, t + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.08));
    osc.connect(gain).connect(actx.destination);
    osc.start(t); osc.stop(t + (dur || 0.08) + 0.02);
  }
  function sndJump() { tone(260, 0.12, "square", 0.14, 520); }
  function sndLand() { tone(190, 0.07, "sine", 0.16); }
  function sndShatter() {
    if (!actx) return;
    const n = Math.floor(actx.sampleRate * 0.35);
    const buf = actx.createBuffer(1, n, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 1.6);
    const src = actx.createBufferSource(); src.buffer = buf;
    const hp = actx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1600;
    const g = actx.createGain(); g.gain.value = 0.5;
    src.connect(hp); hp.connect(g); g.connect(actx.destination); src.start();
  }
  function sndFall() { tone(420, 0.7, "sawtooth", 0.16, 60); }

  // ========================== GAME ==========================
  const canvas = el("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  // Perspective camera looking down the bridge (z = depth, x = lateral, h = up).
  // The camera orbits vertically around the character: pitch is adjustable, from a
  // low cinematic angle up to a near-top-down view for precise aiming.
  const FOCAL = 420, LAT = 1.35, SCREEN_CY = 250;
  const CAM_PRESETS = [
    { name: "Low", pitch: 16 },
    { name: "Classic", pitch: 32 },
    { name: "High", pitch: 52 },
    { name: "Top", pitch: 72 },
  ];
  const LS_CAM = "glass-bridge:cam";
  let camPreset = 1, pitchTarget = CAM_PRESETS[1].pitch;
  try {
    const saved = JSON.parse(localStorage.getItem(LS_CAM));
    if (saved && typeof saved.p === "number") {
      pitchTarget = Math.max(12, Math.min(80, saved.p));
      camPreset = typeof saved.i === "number" ? saved.i : -1;
    }
  } catch (e) {}
  let camPitch = pitchTarget;   // smoothed
  let followZ = 0;              // smoothed camera anchor along the bridge
  // per-frame camera basis, rebuilt by computeCam()
  const cam = { cy: 0, cz: 0, fy: 0, fz: 0, charZC: 3.5, nearZ: -10, horizonY: 100 };

  function computeCam() {
    const phi = (camPitch * Math.PI) / 180;
    const R = 3.4 + (camPitch / 80) * 2.2;      // back off a bit as the view goes overhead
    cam.cy = R * Math.sin(phi) + 0.5;
    cam.cz = followZ - R * Math.cos(phi);
    // look at a point on the bridge a little ahead of the character
    let fy = 0.3 - cam.cy, fz = followZ + 1.5 - cam.cz;
    const n = Math.hypot(fy, fz); fy /= n; fz /= n;
    cam.fy = fy; cam.fz = fz;
    cam.charZC = Math.max(0.3, -cam.cy * fy + (ch.z - cam.cz) * fz);
    cam.nearZ = cam.cz + (0.3 + cam.cy * fy) / fz;              // world z where zc hits the clip plane
    const far = projRaw(0, followZ + 90, 0);                    // where the bridge vanishes
    cam.horizonY = Math.max(10, Math.min(H * 0.6, far.y));
  }
  function projRaw(x, z, h) {
    const vy = h - cam.cy, vz = z - cam.cz;
    const zc = Math.max(0.3, vy * cam.fy + vz * cam.fz);
    const yc = vy * cam.fz - vz * cam.fy;      // camera-space "up"
    const s = FOCAL / zc;
    return { x: W / 2 + x * LAT * s, y: SCREEN_CY - yc * s, s: s, d: zc };
  }
  // Panel geometry: two glass panels per row, centered at ±PANEL_CX
  const PANEL_CX = 0.52, PANEL_HW = 0.40, PANEL_HD = 0.36; // half-width (lateral), half-depth
  const DECK_HW = 1.06;               // the solid starting deck
  const JUMP_DUR = 0.55, JUMP_H = 0.9; // seconds, world units
  const KEY_SPEED = 2.4;               // lateral world units / s
  const X_CLAMP = 1.02;

  // The bridge itself. Persists across deaths (until the page is reloaded):
  // each row's safe side is rolled ONCE and never swapped, and a shattered fake
  // panel stays a broken hole on your next attempt.
  let bridge = []; // { safe: 0|1, broken: bool (fake panel shattered), proven: bool (safe panel landed on) }
  function ensureRows(n) {
    while (bridge.length < n) bridge.push({ safe: Math.random() < 0.5 ? 0 : 1, broken: false, proven: false });
  }
  // Which panel is under lateral position x? 0 = left, 1 = right, -1 = the void.
  function panelAt(x) {
    if (Math.abs(-PANEL_CX - x) <= PANEL_HW + 0.03) return 0;
    if (Math.abs(PANEL_CX - x) <= PANEL_HW + 0.03) return 1;
    return -1;
  }

  // state: "ready" | "playing" | "jumping" | "falling" | "dead"
  let state, ch, score, shards, shakeT, deathCause;
  let pointerX = null, lastInput = "keys";
  const keys = {};

  function respawn() { // back to the start deck — the bridge is NOT regenerated
    ch = { x: 0, z: 0, h: 0, row: 0, jumpT: 0, jumpFromX: 0, vh: 0, spin: 0 };
    score = 0; shards = []; shakeT = 0; deathCause = "";
    followZ = ch.z;
    pointerX = null;
    ensureRows(14);
  }
  respawn();
  state = "ready";

  function startJump() {
    state = "jumping";
    ch.jumpT = 0;
    ch.jumpFrom = ch.z;
    sndJump();
  }

  function land() {
    const row = ch.row + 1;         // rows are 1-indexed; bridge[row-1] holds its layout
    const side = panelAt(ch.x);
    ch.z = row; ch.h = 0;
    if (side === -1) { die("gap", row); return; }
    const r = bridge[row - 1];
    if (r.broken && side !== r.safe) { die("hole", row); return; } // jumped into an old hole
    if (side === r.safe) {
      state = "playing";
      ch.row = row; score = row; r.proven = true;
      if (score > best) { best = score; showBest(); }
      ensureRows(row + 14);
      sndLand();
    } else {
      r.broken = true;
      spawnShards(side === 0 ? -PANEL_CX : PANEL_CX, row);
      shakeT = 0.3;
      sndShatter();
      die("glass", row);
    }
  }

  function die(cause, row) {
    state = "falling";
    deathCause = cause;
    ch.vh = cause === "glass" ? -0.5 : -1.2; // glass gives way, gaps you just drop into
    ch.spin = (Math.random() < 0.5 ? -1 : 1) * (2 + Math.random() * 2);
    sndFall();
  }

  function spawnShards(cx, z) {
    for (let i = 0; i < 30; i++) {
      const a = Math.random() * Math.PI * 2, sp = 0.4 + Math.random() * 1.4;
      shards.push({
        x: cx + (Math.random() - 0.5) * PANEL_HW * 1.6,
        z: z + (Math.random() - 0.5) * PANEL_HD * 1.6,
        h: 0,
        vx: Math.cos(a) * sp * 0.4, vz: Math.sin(a) * sp * 0.25, vh: 0.6 + Math.random() * 1.6,
        rot: Math.random() * Math.PI, vrot: (Math.random() - 0.5) * 10,
        size: 0.03 + Math.random() * 0.05, life: 1,
      });
    }
  }

  function startOrRestart() {
    initAudio();
    if (state === "ready") { state = "playing"; }
    else if (state === "playing") { startJump(); }
    else if (state === "dead") { respawn(); state = "playing"; }
  }

  function update(dt) {
    // lateral steering works on the ground and mid-air
    if (state === "playing" || state === "jumping" || state === "ready") {
      if (keys["arrowleft"] || keys["a"]) { ch.x -= KEY_SPEED * dt; lastInput = "keys"; }
      if (keys["arrowright"] || keys["d"]) { ch.x += KEY_SPEED * dt; lastInput = "keys"; }
      if (lastInput === "pointer" && pointerX !== null) {
        ch.x += (pointerX - ch.x) * Math.min(1, 12 * dt);
      }
      ch.x = Math.max(-X_CLAMP, Math.min(X_CLAMP, ch.x));
    }

    if (state === "jumping") {
      ch.jumpT += dt / JUMP_DUR;
      if (ch.jumpT >= 1) { land(); }
      else {
        ch.z = ch.jumpFrom + ch.jumpT;
        ch.h = 4 * JUMP_H * ch.jumpT * (1 - ch.jumpT);
      }
    }

    if (state === "falling") {
      ch.vh -= 6 * dt;
      ch.h += ch.vh * dt;
      ch.spin *= 0.99;
      if (ch.h < -3) { state = "dead"; submit(score); }
    }

    // camera eases along behind the character; pitch eases toward the chosen angle
    followZ += (ch.z - followZ) * Math.min(1, 6 * dt);
    if (keys["q"] || keys["e"]) {
      pitchTarget = Math.max(12, Math.min(80, pitchTarget + (keys["e"] ? 40 : -40) * dt));
      camPreset = -1; saveCam();
    }
    camPitch += (pitchTarget - camPitch) * Math.min(1, 8 * dt);
    if (shakeT > 0) shakeT -= dt;

    for (const s of shards) {
      s.vh -= 6 * dt;
      s.x += s.vx * dt; s.z += s.vz * dt; s.h += s.vh * dt;
      s.rot += s.vrot * dt;
      if (s.h < -0.2) s.life -= 3 * dt;
    }
    shards = shards.filter((s) => s.life > 0 && s.h > -3);
  }

  // ---- projection ----
  const proj = projRaw;
  function quad(x0, z0, x1, z1) { // fill path for a flat rect on the bridge plane
    const a = proj(x0, z0, 0), b = proj(x1, z0, 0), c = proj(x1, z1, 0), d = proj(x0, z1, 0);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.closePath();
  }
  // deterministic per-row jitter so broken holes keep their jagged shape
  function jag(seed) { const t = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return t - Math.floor(t); }

  function drawPanel(cx, z, row, r, isFake) {
    const x0 = cx - PANEL_HW, x1 = cx + PANEL_HW, z0 = z - PANEL_HD, z1 = z + PANEL_HD;
    if (isFake && r.broken) {
      // a permanent hole: dark void + jagged glass teeth around the frame
      quad(x0, z0, x1, z1);
      ctx.fillStyle = "rgba(4,3,10,0.88)"; ctx.fill();
      ctx.strokeStyle = "rgba(140,200,235,0.35)"; ctx.lineWidth = 1;
      for (let i = 0; i < 7; i++) {
        const t0 = i / 7, t1 = (i + 0.5 + jag(row * 13 + i) * 0.4) / 7;
        const ax = x0 + (x1 - x0) * t0, bx = x0 + (x1 - x0) * Math.min(1, t1);
        const depth = 0.05 + jag(row * 7 + i) * 0.12;
        const a = proj(ax, z0, 0), b = proj(bx, z0 + depth, 0), c = proj(Math.min(x1, bx + 0.06), z0, 0);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.closePath();
        ctx.fillStyle = "rgba(150,210,240,0.18)"; ctx.fill(); ctx.stroke();
        const a2 = proj(ax, z1, 0), b2 = proj(bx, z1 - depth, 0), c2 = proj(Math.min(x1, bx + 0.06), z1, 0);
        ctx.beginPath(); ctx.moveTo(a2.x, a2.y); ctx.lineTo(b2.x, b2.y); ctx.lineTo(c2.x, c2.y); ctx.closePath();
        ctx.fillStyle = "rgba(150,210,240,0.12)"; ctx.fill();
      }
      return;
    }
    quad(x0, z0, x1, z1);
    if (r.proven && !isFake) {
      ctx.fillStyle = "rgba(46,230,166,0.20)";            // a panel you've stood on — proven safe
      ctx.strokeStyle = "rgba(46,230,166,0.55)";
    } else {
      ctx.fillStyle = "rgba(127,196,255,0.14)";
      ctx.strokeStyle = "rgba(185,225,255,0.45)";
    }
    ctx.fill(); ctx.lineWidth = 1.5; ctx.stroke();
    // glare streak
    const g0 = proj(cx - PANEL_HW * 0.5, z - PANEL_HD * 0.4, 0), g1 = proj(cx + PANEL_HW * 0.1, z + PANEL_HD * 0.5, 0);
    ctx.strokeStyle = "rgba(255,255,255,0.10)"; ctx.lineWidth = Math.max(1, g0.s * 0.05);
    ctx.beginPath(); ctx.moveTo(g0.x, g0.y); ctx.lineTo(g1.x, g1.y); ctx.stroke();
  }

  function drawRow(row) {
    const z = row;
    const r = bridge[row - 1];
    // steel frame under the row
    quad(-DECK_HW, z - PANEL_HD - 0.06, DECK_HW, z - PANEL_HD, 0); ctx.fillStyle = "#241c3a"; ctx.fill();
    quad(-DECK_HW, z + PANEL_HD, DECK_HW, z + PANEL_HD + 0.06, 0); ctx.fillStyle = "#241c3a"; ctx.fill();
    drawPanel(-PANEL_CX, z, row, r, r.safe !== 0);
    drawPanel(PANEL_CX, z, row, r, r.safe !== 1);
    // faint row number on the frame between the panels
    const p = proj(0, z, 0);
    ctx.fillStyle = "rgba(243,238,252,0.28)";
    ctx.font = Math.max(7, p.s * 0.14) + "px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(row, p.x, p.y + p.s * 0.03);
  }

  function drawRails() {
    const zNear = Math.max(followZ - 4, cam.nearZ + 0.1), zFar = followZ + 16;
    for (const rx of [-DECK_HW - 0.06, DECK_HW + 0.06]) {
      const a = proj(rx, zNear, 0.55), b = proj(rx, zFar, 0.55), c = proj(rx, zFar, 0.62), d = proj(rx, zNear, 0.62);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.closePath();
      ctx.fillStyle = "rgba(90,74,140,0.5)"; ctx.fill();
      // posts
      for (let z = Math.ceil(zNear); z < zFar; z += 2) {
        const t = proj(rx, z, 0.55), bo = proj(rx, z, 0);
        ctx.strokeStyle = "rgba(90,74,140,0.4)"; ctx.lineWidth = Math.max(1, t.s * 0.02);
        ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(bo.x, bo.y); ctx.stroke();
      }
    }
  }

  function drawCharacter() {
    const p = proj(ch.x, ch.z, Math.max(ch.h, -3));
    const s = p.s;
    // shadow on the bridge plane while above it
    if (ch.h >= 0 && state !== "dead") {
      const sh = proj(ch.x, ch.z, 0);
      ctx.fillStyle = "rgba(0,0,0," + Math.max(0, 0.35 - ch.h * 0.25) + ")";
      ctx.beginPath(); ctx.ellipse(sh.x, sh.y, s * 0.13, s * 0.045, 0, 0, Math.PI * 2); ctx.fill();
    }
    const fade = state === "falling" || state === "dead" ? Math.max(0, 1 + ch.h / 3) : 1;
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.translate(p.x, p.y);
    if (state === "falling") ctx.rotate(ch.spin * ch.h * 0.15);
    const bw = s * 0.15, bh = s * 0.26, tuck = state === "jumping" ? 0.6 : 1;
    // legs
    ctx.strokeStyle = "#0f8a68"; ctx.lineWidth = s * 0.045; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-bw * 0.3, -bh * 0.35); ctx.lineTo(-bw * 0.35, -bh * 0.35 * (1 - tuck)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bw * 0.3, -bh * 0.35); ctx.lineTo(bw * 0.35, -bh * 0.35 * (1 - tuck)); ctx.stroke();
    // body (teal tracksuit, seen from behind)
    ctx.fillStyle = "#17c3a2";
    ctx.beginPath();
    ctx.roundRect(-bw / 2, -bh * 1.15, bw, bh * 0.85, s * 0.04);
    ctx.fill();
    // arms — up when jumping
    ctx.strokeStyle = "#17c3a2"; ctx.lineWidth = s * 0.04;
    const ay = state === "jumping" ? -bh * 1.35 : -bh * 0.6;
    ctx.beginPath(); ctx.moveTo(-bw * 0.55, -bh * 1.05); ctx.lineTo(-bw * 0.85, ay); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bw * 0.55, -bh * 1.05); ctx.lineTo(bw * 0.85, ay); ctx.stroke();
    // number on the back
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.font = "bold " + s * 0.07 + "px system-ui, sans-serif"; ctx.textAlign = "center";
    ctx.fillText("456", 0, -bh * 0.72);
    // head
    ctx.fillStyle = "#f2c9a0";
    ctx.beginPath(); ctx.arc(0, -bh * 1.3, s * 0.062, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#1d1428";
    ctx.beginPath(); ctx.arc(0, -bh * 1.32, s * 0.062, Math.PI, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawShards() {
    for (const sd of shards) {
      const p = proj(sd.x, sd.z, sd.h);
      ctx.save();
      ctx.globalAlpha = Math.max(0, sd.life) * 0.8;
      ctx.translate(p.x, p.y); ctx.rotate(sd.rot);
      const sz = sd.size * p.s;
      ctx.fillStyle = "rgba(170,220,250,0.8)";
      ctx.beginPath(); ctx.moveTo(0, -sz); ctx.lineTo(sz * 0.8, sz * 0.6); ctx.lineTo(-sz * 0.7, sz * 0.5); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    computeCam();
    ctx.save();
    if (shakeT > 0) ctx.translate((Math.random() - 0.5) * shakeT * 30, (Math.random() - 0.5) * shakeT * 30);

    // abyss glow under the bridge
    const gy = cam.horizonY;
    const grad = ctx.createLinearGradient(0, gy, 0, H);
    grad.addColorStop(0, "rgba(255,93,143,0.06)");
    grad.addColorStop(1, "rgba(255,93,143,0)");
    ctx.fillStyle = grad; ctx.fillRect(0, gy, W, H - gy);

    drawRails();

    // start deck (solid) — visible until you're a few rows in
    if (followZ < 5) {
      quad(-DECK_HW, Math.max(followZ - 5, cam.nearZ + 0.05), DECK_HW, 0.5, 0);
      ctx.fillStyle = "#2b2248"; ctx.fill();
      ctx.strokeStyle = "rgba(255,93,143,0.5)"; ctx.lineWidth = 2;
      const e0 = proj(-DECK_HW, 0.5, 0), e1 = proj(DECK_HW, 0.5, 0);
      ctx.beginPath(); ctx.moveTo(e0.x, e0.y); ctx.lineTo(e1.x, e1.y); ctx.stroke();
    }

    // rows far → near so nearer glass overlaps
    const first = Math.max(1, Math.floor(Math.max(followZ - 4, cam.nearZ) + 0.5));
    const last = Math.floor(followZ + 16);
    ensureRows(last);
    for (let row = last; row >= first; row--) drawRow(row);

    drawShards();
    drawCharacter();
    ctx.restore();

    // HUD — row counter
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(255,209,102,0.95)"; ctx.font = "56px system-ui, sans-serif";
    ctx.fillText(score, W / 2, 64);
    ctx.fillStyle = "rgba(243,238,252,0.4)"; ctx.font = "13px system-ui, sans-serif";
    ctx.fillText("ROW", W / 2, 82);

    if (state === "ready") {
      banner("GLASS BRIDGE", "One panel holds. One shatters. Tap / Space to jump — steer with ← → or mouse");
    } else if (state === "dead") {
      const why = deathCause === "glass" ? "The glass gave way" : deathCause === "hole" ? "You jumped into the hole" : "You missed the panels";
      banner(score > 0 && score >= best ? "New best!" : why, "Tap or press Space to retry — the bridge remembers");
    }
  }

  function banner(title, sub) {
    ctx.fillStyle = "rgba(10,7,22,0.62)"; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#ff5d8f"; ctx.font = "bold 40px system-ui, sans-serif"; ctx.fillText(title, W / 2, H / 2 - 26);
    if (state === "dead") {
      ctx.fillStyle = "#f3eefc"; ctx.font = "20px system-ui, sans-serif";
      ctx.fillText("This run: row " + score + "   ·   Best: " + Math.max(best, score), W / 2, H / 2 + 14);
    }
    ctx.fillStyle = "#cfc2e8"; ctx.font = "16px system-ui, sans-serif"; ctx.fillText(sub, W / 2, H / 2 + 54);
  }

  let lastT = 0;
  function loop(t) {
    const dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
    lastT = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // input — pointer steers, tap/click jumps
  function localX(clientX) {
    const rect = canvas.getBoundingClientRect();
    const sx = (clientX - rect.left) * (W / rect.width);
    return (sx - W / 2) * cam.charZC / (LAT * FOCAL);
  }
  // camera angle: button / C cycles presets, Q/E fine-tilts
  const camBtn = el("camBtn");
  function saveCam() {
    camBtn.textContent = "📷 " + (camPreset >= 0 ? CAM_PRESETS[camPreset].name : Math.round(pitchTarget) + "°");
    try { localStorage.setItem(LS_CAM, JSON.stringify({ p: pitchTarget, i: camPreset })); } catch (e) {}
  }
  function cycleCam() {
    camPreset = (camPreset + 1 + CAM_PRESETS.length) % CAM_PRESETS.length;
    pitchTarget = CAM_PRESETS[camPreset].pitch;
    saveCam();
  }
  camBtn.addEventListener("click", (e) => { e.stopPropagation(); cycleCam(); });
  saveCam();

  canvas.addEventListener("mousemove", (e) => { pointerX = localX(e.clientX); lastInput = "pointer"; });
  canvas.addEventListener("mousedown", (e) => { e.preventDefault(); startOrRestart(); });
  canvas.addEventListener("touchmove", (e) => { e.preventDefault(); pointerX = localX(e.touches[0].clientX); lastInput = "pointer"; }, { passive: false });
  canvas.addEventListener("touchstart", (e) => { e.preventDefault(); startOrRestart(); }, { passive: false });
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    keys[k] = true;
    if (k === "arrowleft" || k === "arrowright" || k === "a" || k === "d") lastInput = "keys";
    if (k === "c") cycleCam();
    if (e.key === " " || e.key === "Enter" || e.key === "ArrowUp" || k === "w") { e.preventDefault(); startOrRestart(); }
  });
  window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

  requestAnimationFrame(loop);
  loadMe();
  refreshBoard();
})();
</script>
</body>
</html>
