<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<script src="/arcade/_sdk/marshellis.js"></script>
<script src="/arcade/_sdk/rounds.js" data-game="tumble-rush"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Tumble Rush</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Trebuchet MS", "Arial Rounded MT Bold", system-ui, -apple-system, sans-serif;
    background: radial-gradient(ellipse at top, #2a3f8f 0%, #141f4d 60%, #0d1536 100%); color: #fff;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 10px; user-select: none; -webkit-user-select: none; overflow-x: hidden;
  }
  .col { width: min(96vw, 900px); }
  #top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #bestChip { font-size: 14px; color: #cbd5e1; background: rgba(255,255,255,.08); padding: 5px 12px; border-radius: 999px; }
  #bestChip b { color: #ffd84d; font-size: 16px; }
  #stage {
    position: relative; width: min(96vw, 900px); aspect-ratio: 16 / 10; max-height: 78vh;
    border-radius: 20px; overflow: hidden; box-shadow: 0 0 0 4px #ffffff22, 0 16px 40px rgba(0,0,0,.55);
    background: linear-gradient(#5aa8ff, #c9ecff); touch-action: none;
  }
  @media (max-aspect-ratio: 1/1) { #stage { aspect-ratio: 3 / 4; } }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 16px;
    background: radial-gradient(ellipse at center, rgba(20,31,77,.05) 0%, rgba(20,31,77,.5) 100%);
  }
  .hidden { display: none !important; }
  h1 {
    margin: 0; font-size: clamp(40px, 8.5vw, 84px); letter-spacing: 2px; line-height: .95; color: #ffe14d;
    -webkit-text-stroke: 3px #7a2a00; paint-order: stroke fill;
    text-shadow: 0 6px 0 #e2591d, 0 12px 0 #7a2a00, 0 18px 26px rgba(0,0,0,.45);
    animation: wobble 2.4s ease-in-out infinite;
  }
  h1 span { color: #7ff0ff; }
  @keyframes wobble { 0%,100% { transform: rotate(-3deg) scale(1); } 50% { transform: rotate(2deg) scale(1.04); } }
  h2 {
    margin: 0; font-size: clamp(32px, 6vw, 56px); color: #ffe14d; -webkit-text-stroke: 2px #7a2a00; paint-order: stroke fill;
    text-shadow: 0 5px 0 #e2591d, 0 10px 18px rgba(0,0,0,.4); animation: popin .45s cubic-bezier(.2,1.6,.4,1);
  }
  #resEmoji { font-size: 54px; animation: popin .6s cubic-bezier(.2,1.6,.4,1); filter: drop-shadow(0 6px 8px rgba(0,0,0,.35)); }
  @keyframes popin { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .sub { color: #fff; font-size: 16px; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,.5); }
  .modes { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  .card {
    position: relative; width: 200px; padding: 14px 14px 16px; border-radius: 18px; text-align: left; border: 0; font: inherit;
    background: linear-gradient(#ffffff, #eef6ff); color: #1e293b; cursor: pointer;
    box-shadow: 0 7px 0 #8fb3ff, 0 14px 22px rgba(0,0,0,.3); transition: transform .12s, box-shadow .12s;
  }
  .card:hover { transform: translateY(-4px) rotate(-1deg); box-shadow: 0 11px 0 #8fb3ff, 0 18px 26px rgba(0,0,0,.3); }
  .card:active { transform: translateY(4px); box-shadow: 0 3px 0 #8fb3ff, 0 6px 10px rgba(0,0,0,.3); }
  .card .ic { font-size: 30px; display: block; margin-bottom: 2px; }
  .card b { font-size: 19px; display: block; color: #e2591d; margin-bottom: 3px; }
  .card small { color: #475569; font-size: 13px; line-height: 1.35; display: block; }
  .card.inf b { color: #7c3aed; }
  .card.inf { box-shadow: 0 7px 0 #c4b5fd, 0 14px 22px rgba(0,0,0,.3); }
  .card.soon { background: rgba(255,255,255,.55); cursor: default; box-shadow: 0 7px 0 rgba(255,255,255,.25); }
  .card.soon:hover { transform: none; }
  .card.soon b { color: #475569; }
  .ribbon { position: absolute; top: 10px; right: -6px; background: #ff5d8f; color: #fff; font-size: 11px; font-weight: 900;
            padding: 3px 8px; border-radius: 6px 0 0 6px; box-shadow: 0 2px 0 #b3264f; }
  .btn {
    font: inherit; font-weight: 900; font-size: 19px; padding: 12px 26px; border: 0; border-radius: 16px;
    background: linear-gradient(#ffe97a, #ffc93c); color: #7a2a00; box-shadow: 0 6px 0 #e2591d, 0 10px 18px rgba(0,0,0,.3); cursor: pointer;
    transition: transform .1s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #e2591d; }
  .btn.alt { background: linear-gradient(#ffffff, #dbeafe); color: #1e3a8a; box-shadow: 0 6px 0 #60a5fa, 0 10px 18px rgba(0,0,0,.3); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .keys { font-size: 13px; color: #fff; background: rgba(20,31,77,.55); padding: 6px 14px; border-radius: 999px; }
  .keys kbd { background: #fff; color: #1e293b; border-radius: 5px; padding: 1px 6px; font: inherit; font-weight: 800; box-shadow: 0 2px 0 #94a3b8; }
  #hud { position: absolute; top: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; pointer-events: none; }
  .pill { background: linear-gradient(rgba(30,45,110,.88), rgba(20,31,77,.88)); padding: 6px 14px; border-radius: 999px; font-weight: 800; font-size: 16px;
          box-shadow: 0 0 0 2px rgba(255,255,255,.25), 0 4px 10px rgba(0,0,0,.25); }
  .pill span { color: #ffe14d; }
  #banner { position: absolute; top: 30%; left: 0; right: 0; text-align: center; pointer-events: none;
            font-size: clamp(48px, 11vw, 110px); font-weight: 900; color: #fff; -webkit-text-stroke: 3px #7a2a00; paint-order: stroke fill;
            text-shadow: 0 6px 0 #e2591d, 0 14px 22px rgba(0,0,0,.4); }
  #banner.pop { animation: bannerpop .5s cubic-bezier(.2,1.8,.4,1); }
  @keyframes bannerpop { from { transform: scale(2.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #tags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #stage.menu #tags { display: none; }
  .tag { position: absolute; left: 0; top: 0; font-size: 11px; font-weight: 900; color: #fff; padding: 1px 7px; border-radius: 999px;
         background: rgba(20,31,77,.6); white-space: nowrap; will-change: transform; }
  .tag.you { background: #ffd84d; color: #7a2a00; font-size: 12px; box-shadow: 0 2px 0 #e2591d; }
  #pop { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .popt { position: absolute; font-weight: 900; font-size: 24px; color: #ffe14d; -webkit-text-stroke: 1.5px #7a2a00; paint-order: stroke fill;
          animation: rise .9s ease-out forwards; transform: translate(-50%, -50%); }
  @keyframes rise { 0% { transform: translate(-50%,-50%) scale(.5); } 20% { transform: translate(-50%,-50%) scale(1.25); } 100% { opacity: 0; margin-top: -60px; transform: translate(-50%,-50%) scale(1); } }
  #touch { position: absolute; inset: 0; pointer-events: none; }
  #stick { position: absolute; width: 116px; height: 116px; border-radius: 50%; border: 3px solid rgba(255,255,255,.6);
           background: radial-gradient(rgba(255,255,255,.05), rgba(255,255,255,.22)); transform: translate(-50%, -50%); pointer-events: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%;
          background: radial-gradient(circle at 35% 35%, #fff, #cfe3ff); box-shadow: 0 4px 10px rgba(0,0,0,.3); }
  #jumpBtn { position: absolute; right: 18px; bottom: 18px; width: 92px; height: 92px; border-radius: 50%; border: 0;
             background: radial-gradient(circle at 35% 30%, #fff3a8, #ffc93c 60%, #f59e0b); color: #7a2a00; font: inherit; font-weight: 900; font-size: 18px;
             box-shadow: 0 6px 0 #c2410c, 0 10px 16px rgba(0,0,0,.35); pointer-events: auto; touch-action: none; }
  #jumpBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c2410c; }
  .stats { font-size: 18px; line-height: 1.7; background: rgba(20,31,77,.6); padding: 10px 18px; border-radius: 16px; }
  .stats b { color: #ffe14d; }
</style>
</head>
<body>
  <div id="top" class="col">
    <div id="mg-chip"></div>
    <div id="bestChip">Infinite best <b id="best">0</b></div>
  </div>

  <div id="stage">
    <div id="hud" class="hidden">
      <div class="pill" id="hudA"></div>
      <div class="pill" id="hudB"></div>
      <div class="pill" id="hudC"></div>
    </div>
    <div id="tags"></div>
    <div id="pop"></div>
    <div id="banner"></div>
    <div id="touch" class="hidden">
      <div id="stick" class="hidden"><div id="knob"></div></div>
      <button id="jumpBtn">JUMP</button>
    </div>

    <div id="menu" class="overlay">
      <h1>TUMBLE<br><span>RUSH</span></h1>
      <div class="sub">A wobbly party in the sky. Pick a mode!</div>
      <div class="modes">
        <button class="card" id="playClassic"><span class="ic">🎉</span><b>Hop Deck: Classic</b><small>You and 7 rivals on a floating deck. Jump the spinning bar and the sliding blocks. Last one standing (or survive 60s) wins!</small></button>
        <button class="card inf" id="playInfinite"><span class="ic">♾️</span><b>Hop Deck: Infinite</b><small>Just you. It keeps getting faster forever. How long can you last? Scores go on the global leaderboard.</small></button>
        <div class="card soon"><span class="ribbon">SOON</span><span class="ic">🌐</span><b>Online party</b><small>Play Hop Deck with friends over the internet. Coming next!</small></div>
      </div>
      <div class="keys">Move <kbd>WASD</kbd> / <kbd>←↑↓→</kbd> · Jump <kbd>Space</kbd> · Phone: drag to move, tap JUMP</div>
    </div>

    <div id="result" class="overlay hidden">
      <div id="resEmoji"></div>
      <h2 id="resTitle"></h2>
      <div class="stats" id="resStats"></div>
      <div class="row">
        <button class="btn" id="again">Play again</button>
        <button class="btn alt" id="toMenu">Modes</button>
      </div>
    </div>
  </div>

  <div id="mg-picker" class="col"></div>
  <div id="mg-account" class="col"></div>
  <div id="mg-board" class="col"></div>

<script src="./three.min.js"></script>
<script>
(function () {
  "use strict";
  // ======================= platform (accounts, leaderboard, play time) =======================
  const GAME = "tumble-rush";            // the Infinite-mode board is the game's own board
  const LS_BEST = "tumble-rush:best";
  const $ = (id) => document.getElementById(id);
  const mg = window.Marshellis ? Marshellis.init({ game: GAME, chip: "#mg-chip", account: "#mg-account", board: "#mg-board", picker: "#mg-picker" }) : null;
  let best = Number(localStorage.getItem(LS_BEST) || 0) || 0;
  function showBest() { $("best").textContent = best; }
  showBest();
  async function submitInfinite(score) {
    if (score > best) { best = score; localStorage.setItem(LS_BEST, String(best)); }
    showBest();
    if (!mg) return;
    const r = await mg.submitScore(score);
    if (r && r.best > best) { best = r.best; showBest(); }
  }
  function roundOver() { window.MGRounds && MGRounds.end(); }

  // ======================= tuning =======================
  const R = 10;              // deck radius
  const PILLAR = 0.9;        // centre pillar radius
  const BODY = 0.42;         // blob radius
  const GRAV = -24, JUMP_V = 9, MOVE = 6.2;   // a jump clears 0.6 high from 0.07s to 0.68s after take-off
  const ARM_H = 0.6;         // sweeper bar top
  const ARM_W = 0.32;
  const CLASSIC_TIME = 60;
  const COLORS = [0xff5d8f, 0x4dd8ff, 0x8cff5a, 0xffa94d, 0xb07cff, 0xffe14d, 0x47e0b3, 0xff7a5c];
  const NAMES = ["You", "Pip", "Mochi", "Zoom", "Bean", "Wobbles", "Tofu", "Squish"];

  // ======================= three.js scene =======================
  const stage = $("stage");
  const lite = (window.devicePixelRatio || 1) < 1.5 && /Mobi|Android/i.test(navigator.userAgent);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.insertBefore(renderer.domElement, stage.firstChild);
  const scene = new THREE.Scene();
  const HORIZON = 0xc9ecff;
  scene.fog = new THREE.Fog(HORIZON, 45, 110);
  const camera = new THREE.PerspectiveCamera(50, 16 / 10, 0.1, 300);

  // Sky: a big gradient dome (deep blue up top, pale at the horizon, a warm pink glow below) and a soft sun.
  const sky = new THREE.Mesh(new THREE.SphereGeometry(150, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(0x2f7bff) }, mid: { value: new THREE.Color(HORIZON) }, low: { value: new THREE.Color(0x8fc9ff) } },
    vertexShader: "varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
    fragmentShader: "uniform vec3 top; uniform vec3 mid; uniform vec3 low; varying vec3 vP; void main(){ float h = vP.y;" +
      " vec3 c = h > 0.0 ? mix(mid, top, pow(h, 0.6)) : mix(mid, low, pow(-h, 0.7)); gl_FragColor = vec4(c, 1.0); }",
  }));
  scene.add(sky);
  function glowTexture(inner, outer) {
    const c = document.createElement("canvas"); c.width = c.height = 128;
    const g = c.getContext("2d"), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, inner); gr.addColorStop(0.35, outer); gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c);
  }
  const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture("rgba(255,255,240,1)", "rgba(255,240,180,0.55)"), fog: false, depthWrite: false }));
  sunGlow.scale.set(40, 40, 1); sunGlow.position.set(-60, 55, -110); scene.add(sunGlow);

  // Cartoon (toon) shading: three flat bands of light instead of smooth gradients.
  const ramp = new THREE.DataTexture(new Uint8Array([110, 110, 110, 255, 190, 190, 190, 255, 255, 255, 255, 255]), 3, 1, THREE.RGBAFormat);
  ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
  const toon = (color, extra) => new THREE.MeshToonMaterial(Object.assign({ color, gradientMap: ramp }, extra || {}));

  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a9cff, 0.55));
  const sun = new THREE.DirectionalLight(0xfff4e0, 0.95);
  sun.position.set(-8, 20, 6); sun.castShadow = true;
  sun.shadow.mapSize.set(lite ? 1024 : 2048, lite ? 1024 : 2048);
  Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 50 });
  sun.shadow.bias = -0.0015;
  scene.add(sun);
  const shade = (m, cast, receive) => { m.castShadow = cast !== false; m.receiveShadow = !!receive; return m; };

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // Fit the whole deck: portrait screens need a wider view and a higher camera.
    camera.fov = camera.aspect < 1 ? 62 : 48;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);

  // ---- the deck: candy-striped disc, bumper pads around the rim, a floating island underneath
  function deckTexture() {
    const c = document.createElement("canvas"); c.width = c.height = 1024;
    const g = c.getContext("2d"), C = 512, seg = 20;
    for (let i = 0; i < seg; i++) {
      g.beginPath(); g.moveTo(C, C);
      g.arc(C, C, C, (i / seg) * Math.PI * 2, ((i + 1) / seg) * Math.PI * 2);
      g.fillStyle = i % 2 ? "#fff3c4" : "#ffd36b"; g.fill();
    }
    // soft dots so the floor reads as a surface while you move
    g.fillStyle = "rgba(255,255,255,0.35)";
    for (let r = 120; r < 500; r += 46) for (let a = 0; a < Math.PI * 2; a += 46 / r) {
      g.beginPath(); g.arc(C + Math.cos(a) * r, C + Math.sin(a) * r, 5, 0, Math.PI * 2); g.fill();
    }
    g.lineWidth = 16; g.strokeStyle = "#ff9b4a";
    for (const r of [170, 340]) { g.beginPath(); g.arc(C, C, r, 0, Math.PI * 2); g.stroke(); }
    g.lineWidth = 30; g.strokeStyle = "#ff6f91"; g.beginPath(); g.arc(C, C, 497, 0, Math.PI * 2); g.stroke();
    const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
  }
  const deck = new THREE.Group(); scene.add(deck);
  const top = shade(new THREE.Mesh(new THREE.CylinderGeometry(R, R, 0.3, 72), [
    toon(0xff6f91), new THREE.MeshLambertMaterial({ map: deckTexture() }), toon(0xff6f91),
  ]), false, true);
  top.position.y = -0.15; deck.add(top);
  for (let i = 0; i < 36; i++) {
    const a = (i / 36) * Math.PI * 2;
    const pad = shade(new THREE.Mesh(new THREE.SphereGeometry(0.42, 14, 10), toon(i % 2 ? 0x4dd8e8 : 0xffffff)));
    pad.scale.set(0.55, 0.55, 1.15); pad.position.set(Math.cos(a) * (R + 0.08), -0.2, Math.sin(a) * (R + 0.08)); pad.rotation.y = -a;
    deck.add(pad);
  }
  // Floating island: a lumpy rock cone with grass on top and crystals hanging off it.
  const rockGeo = new THREE.CylinderGeometry(R - 0.1, 1.2, 7, 14, 4);
  const rp = rockGeo.attributes.position;
  for (let i = 0; i < rp.count; i++) {
    const y = rp.getY(i);
    if (y < 3.4) { const k = 1 + (Math.sin(i * 12.9898) * 43758.5453 % 1) * 0.18; rp.setX(i, rp.getX(i) * k); rp.setZ(i, rp.getZ(i) * k); }
  }
  rockGeo.computeVertexNormals();
  const rock = new THREE.Mesh(rockGeo, toon(0x9b7bd8, { flatShading: true }));
  rock.position.y = -3.85; deck.add(rock);
  const grass = new THREE.Mesh(new THREE.CylinderGeometry(R + 0.05, R - 0.3, 0.4, 72), toon(0x5fd16b));
  grass.position.y = -0.48; deck.add(grass);
  const crystalMat = toon(0x7ff0ff, { emissive: 0x1a5f7a });
  const crystals = [];
  for (let i = 0; i < 9; i++) {
    const a = Math.random() * Math.PI * 2, d = 2 + Math.random() * 5;
    const c = new THREE.Mesh(new THREE.ConeGeometry(0.35 + Math.random() * 0.3, 1.5 + Math.random() * 1.8, 5), crystalMat);
    c.rotation.x = Math.PI; c.position.set(Math.cos(a) * d, -6.2 - Math.random() * 1.2 + d * 0.35, Math.sin(a) * d); deck.add(c);
  }
  // Little rocks that orbit under the island.
  for (let i = 0; i < 7; i++) {
    const m = new THREE.Mesh(new THREE.DodecahedronGeometry(0.5 + Math.random() * 0.7), toon(0x9b7bd8, { flatShading: true }));
    m.userData.orbit = { a: Math.random() * Math.PI * 2, d: 9 + Math.random() * 5, y: -6 - Math.random() * 5, s: 0.08 + Math.random() * 0.12 };
    scene.add(m); crystals.push(m);
  }
  // Centre tower: base, a gear that turns with the bar, a dome and a spinning star.
  const pillar = shade(new THREE.Mesh(new THREE.CylinderGeometry(PILLAR, PILLAR * 1.15, 1.3, 32), toon(0x5b6cff)));
  pillar.position.y = 0.65; deck.add(pillar);
  const gear = new THREE.Group(); gear.position.y = 0.42; deck.add(gear);
  gear.add(shade(new THREE.Mesh(new THREE.CylinderGeometry(PILLAR + 0.12, PILLAR + 0.12, 0.3, 32), toon(0xffd84d))));
  for (let i = 0; i < 12; i++) {
    const tooth = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.28, 0.22), toon(0xffb400));
    const a = (i / 12) * Math.PI * 2; tooth.position.set(Math.cos(a) * (PILLAR + 0.2), 0, Math.sin(a) * (PILLAR + 0.2)); gear.add(tooth);
  }
  const cap = shade(new THREE.Mesh(new THREE.SphereGeometry(PILLAR * 0.95, 28, 14, 0, Math.PI * 2, 0, Math.PI / 2), toon(0xff5d8f)));
  cap.position.y = 1.3; deck.add(cap);
  const topStar = shade(new THREE.Mesh(new THREE.OctahedronGeometry(0.38), toon(0xffe14d, { emissive: 0x664400 })));
  topStar.position.y = 2.6; topStar.scale.set(1, 1.3, 0.5); deck.add(topStar);

  // Clouds: puffy toon clusters below and around the island.
  const cloudMat = toon(0xffffff, { transparent: true, opacity: 0.96 });
  for (let i = 0; i < 30; i++) {
    const g = new THREE.Group();
    const n = 4 + Math.floor(Math.random() * 3);
    for (let k = 0; k < n; k++) {
      const s = new THREE.Mesh(new THREE.SphereGeometry(1.2 + Math.random() * 1.7, 14, 10), cloudMat);
      s.position.set(k * 1.7 - n * 0.85, Math.random() * 0.9, Math.random() * 1.4); s.scale.y = 0.75; g.add(s);
    }
    const a = Math.random() * Math.PI * 2, d = 18 + Math.random() * 40;
    g.position.set(Math.cos(a) * d, -7 - Math.random() * 16, Math.sin(a) * d);
    g.userData.spin = (Math.random() - 0.5) * 0.01;
    scene.add(g);
  }
  const clouds = scene.children.filter((o) => o.userData && o.userData.spin !== undefined);

  // ======================= particles =======================
  const parts = [];
  const partGeo = { puff: new THREE.SphereGeometry(0.18, 8, 6), star: new THREE.OctahedronGeometry(0.16), cube: new THREE.BoxGeometry(0.16, 0.16, 0.04) };
  function burst(kind, x, y, z, n, color, speed, life) {
    for (let i = 0; i < n && parts.length < 260; i++) {

    for (let i = 0; i < blobs.length; i++) for (let j = i + 1; j < blobs.length; j++) {
      const a = blobs[i], c = blobs[j];
      if (!a.alive || !c.alive || Math.abs(a.y - c.y) > 0.8) continue;
      const dx = c.x - a.x, dz = c.z - a.z, d = Math.hypot(dx, dz), min = BODY * 2;
      if (d > 0 && d < min) {
        const nx = dx / d, nz = dz / d, push = (min - d) / 2;
        a.x -= nx * push; a.z -= nz * push; c.x += nx * push; c.z += nz * push;
        // A gentle bump: trade a little momentum so crowds jostle.
        const rel = (a.vx - c.vx) * nx + (a.vz - c.vz) * nz;
        if (rel > 0) { a.vx -= nx * rel * 0.6; a.vz -= nz * rel * 0.6; c.vx += nx * rel * 0.6; c.vz += nz * rel * 0.6; }
      }
    }
  }

  function stepArms(dt, D) {
    if (D.arm2 && arms.length < 2) arms.push(makeArm(arms[0].angle + Math.PI, -1));
    arms[0].omega = D.omega1;
    if (arms[1]) arms[1].omega = D.omega2;
    for (const arm of arms) {
      arm.angle += arm.dir * arm.omega * dt;
      arm.g.rotation.y = -arm.angle;
      const ca = Math.cos(arm.angle), sa = Math.sin(arm.angle);
      for (const b of blobs) {
        if (!b.alive) continue;
        const u = b.x * ca + b.z * sa, v = -b.x * sa + b.z * ca;
        const prev = arm.prevV.get(b);
        arm.prevV.set(b, v);
        const inReach = u > PILLAR - 0.3 && u < R + 0.6;
        const immune = (b.armImmune.get(arm) || 0) > t;
        if (!immune && inReach && Math.abs(v) < ARM_W / 2 + BODY && b.y < ARM_H && b.y > -0.8) {
          // Knocked along the direction the bar is sweeping.
          const s = arm.dir;
          const tx = -sa * s, tz = ca * s;
          // Bonked up and over: the bar sweeps on underneath instead of bulldozing the blob off the deck.
          knock(b, tx, tz, Math.min(6.5, 2.5 + arm.omega * Math.max(u, 2) * 0.6), 7, "bar");
          b.armImmune.set(arm, t + 1.0);
        } else if (b.isPlayer && inReach && prev !== undefined && prev * v < 0 && b.hitCd === 0 && Math.abs(v) < 2) {
          scoreHop(b);
        }
      }
    }
  }

  function stepBlocks(dt, D) {
    blockTimer -= dt;
    if (blockTimer <= 0) {
      blocks.push(spawnBlock(D.blockSpeed * (0.85 + Math.random() * 0.3), Math.random() < D.tallChance));
      blockTimer = D.blockEvery * (0.75 + Math.random() * 0.5);
    }
    for (let i = blocks.length - 1; i >= 0; i--) {
      const k = blocks[i];
      const step = k.speed * dt;
      k.x += k.dx * step; k.z += k.dz * step; k.travelled += step;
      k.mesh.position.set(k.x, k.h / 2, k.z);
      for (const b of blobs) {
        if (!b.alive) continue;
        const px = b.x - k.x, pz = b.z - k.z;
        const a = px * k.dx + pz * k.dz;           // along the block's travel
        const l = -px * k.dz + pz * k.dx;          // across it
        const prevA = k.prevA.get(b); k.prevA.set(b, a);
        const lateral = Math.abs(l) < k.w / 2 + BODY;
        if (lateral && Math.abs(a) < k.depth / 2 + BODY && b.y < k.h - 0.05 && b.y > -0.8) {
          k.hitIds.add(b);
          knock(b, k.dx, k.dz, Math.min(7.5, k.speed + 1), 5, "block");
        } else if (b.isPlayer && lateral && prevA !== undefined && prevA > 0 && a <= 0 && !k.hitIds.has(b) && b.y >= 0) {
          scoreHop(b);
        }
      }
      if (k.travelled > k.total) { scene.remove(k.mesh); blocks.splice(i, 1); }
    }
  }

  function scoreHop(b) {
    if (!b.isPlayer || state !== "play") return;
    hops++; sfx.hop(); popText("+HOP", b);
    burst("star", b.x, b.y + 0.6, b.z, 5, [0x7ff0ff, 0xffffff], 2.2, 0.5);
  }

  function eliminate(b) {
    if (!b.alive) return;
    b.alive = false; b.mesh.visible = false; b.shadow.visible = false; b.tag.style.display = "none";
    outLog.push({ name: b.name, t: +t.toFixed(1), by: b.lastHit || "walked off" });
    outCount++;
    const aliveCount = blobs.filter((x) => x.alive).length;
    if (b.isPlayer) {
      sfx.out(); finalPlace = aliveCount + 1;
      finish(false);
    } else if (mode === "classic" && state === "play") {
      flash(b.name + " is out!", 900);
      if (aliveCount === 1 && player.alive) { finalPlace = 1; finish(true); }
    }
  }

  // ======================= bots =======================
  function botThink(b, dt) {
    const out = { ix: 0, iz: 0, jump: false };
    if (!b.alive) return out;
    b.retarget -= dt;
    const r = Math.hypot(b.x, b.z);
    if (b.retarget <= 0 || Math.hypot(b.tx - b.x, b.tz - b.z) < 0.6) {
      const a = Math.random() * Math.PI * 2, d = 2.5 + Math.random() * 4.5;
      b.tx = Math.cos(a) * d; b.tz = Math.sin(a) * d; b.retarget = 1.5 + Math.random() * 2.5;
    }
    let mx = b.tx - b.x, mz = b.tz - b.z;
    const ml = Math.hypot(mx, mz) || 1; mx /= ml; mz /= ml;
    let speed = 0.55;
    if (r > R - 1.6) { mx = -b.x / r; mz = -b.z / r; speed = 1; }   // keep away from the edge
    // Threat: the sweeping bars.
    for (const arm of arms) {
      const ang = Math.atan2(b.z, b.x);
      let d = (ang - arm.angle) * arm.dir;
      d = ((d % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      const reachTime = (d - (ARM_W / 2 + BODY) / Math.max(r, 1)) / Math.max(arm.omega, 0.1);
      considerJump(b, arm, reachTime, out);
    }
    // Threat: blocks heading this way.
    for (const k of blocks) {
      const px = b.x - k.x, pz = b.z - k.z;
      const a = px * k.dx + pz * k.dz, l = -px * k.dz + pz * k.dx;
      if (a < 0 || Math.abs(l) > k.w / 2 + BODY + 0.3) continue;
      const reachTime = (a - k.depth / 2 - BODY) / k.speed;
      if (k.tall) {
        if (reachTime < 1.2) { const side = l >= 0 ? 1 : -1; mx = -k.dz * side; mz = k.dx * side; speed = 1; }
      } else considerJump(b, k, reachTime, out);
    }
    out.ix = mx * speed; out.iz = mz * speed;
    return out;
  }
  // Each bot decides ONCE per incoming threat whether it will time the jump well, so better bots survive longer.
  function considerJump(b, threat, reachTime, out) {
    if (reachTime < -0.3 || reachTime > 0.7) { b.plan.delete(threat); return; }
    let p = b.plan.get(threat);
    if (!p) {
      const good = Math.random() < b.skill;
      p = { at: good ? 0.09 + Math.random() * 0.11 : (Math.random() < 0.5 ? 0.35 + Math.random() * 0.2 : -1) };
      b.plan.set(threat, p);
    }
    if (p.at >= 0 && reachTime <= p.at) { out.jump = true; p.at = -2; }
  }

  // ======================= rendering =======================
  function updateMeshes(dt, keepCamera) {
    const W = stage.clientWidth, H = stage.clientHeight;
    for (const b of blobs) {
      if (!b.alive) continue;
      const u = b.mesh.userData;
      b.mesh.position.set(b.x, b.y, b.z);
      let diff = b.face - b.mesh.rotation.y;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      b.mesh.rotation.y += diff * Math.min(1, dt * 12);
      b.squash += (0 - b.squash) * Math.min(1, dt * 10);
      const sq = b.squash + (b.onGround ? 0 : -0.08);
      u.body.scale.set(1 + sq * 0.5, 1.12 * (1 - sq), 1 + sq * 0.5);
      // Walk cycle: feet step and arms swing with ground speed; arms fly up in the air.
      const speed = Math.hypot(b.vx, b.vz);
      u.walk += dt * (4 + speed * 2.2) * (b.onGround ? 1 : 0.2);
      const stride = b.onGround ? Math.min(1, speed / MOVE) : 0;
      const sw = Math.sin(u.walk * 2);
      u.feet[0].position.z = 0.05 + sw * 0.16 * stride; u.feet[1].position.z = 0.05 - sw * 0.16 * stride;
      u.feet[0].position.y = 0.08 + Math.max(0, sw) * 0.08 * stride; u.feet[1].position.y = 0.08 + Math.max(0, -sw) * 0.08 * stride;
      const armUp = b.onGround ? 0 : 1.6;
      u.arms[0].rotation.x = -sw * 0.7 * stride; u.arms[1].rotation.x = sw * 0.7 * stride;
      u.arms[0].rotation.z += (-armUp - u.arms[0].rotation.z) * Math.min(1, dt * 10);
      u.arms[1].rotation.z += (armUp - u.arms[1].rotation.z) * Math.min(1, dt * 10);
      u.body.position.y = BODY * 1.12 + 0.08 + Math.abs(Math.sin(u.walk * 2)) * 0.05 * stride;
      // Blink every few seconds; squeeze the eyes shut while dizzy.
      u.blink -= dt;
      const shut = b.stun > 0 || u.blink < 0.12;
      if (u.blink < 0) u.blink = 2 + Math.random() * 3;
      for (const e of u.eyes) e.scale.y = shut ? 0.15 : 1;
      if (u.spin) u.spin.rotation.y += dt * (b.isPlayer ? 3 : 14);
      b.mesh.rotation.z = b.stun > 0 ? Math.sin(t * 30) * 0.25 : 0;
      const r = Math.hypot(b.x, b.z);
      b.shadow.visible = r < R && b.y > 0.05;
      b.shadow.position.set(b.x, 0.02, b.z);
      const s = Math.max(0.4, 1 - b.y * 0.12); b.shadow.scale.set(s, s, s);
    }
    stepParticles(dt);
    gear.rotation.y = arms[0] ? -arms[0].angle : 0;
    topStar.rotation.y += dt * 2; topStar.position.y = 2.6 + Math.sin(performance.now() / 400) * 0.12;
    for (const c of crystals) { const o = c.userData.orbit; o.a += o.s * dt; c.position.set(Math.cos(o.a) * o.d, o.y + Math.sin(o.a * 3) * 0.4, Math.sin(o.a) * o.d); c.rotation.x += dt * 0.5; c.rotation.y += dt * 0.3; }
    if (!keepCamera) {
      // Camera: high, slightly behind, drifting a little toward the player. A bonk shakes it.
      const portrait = camera.aspect < 1;
      const px = player && player.alive ? player.x : 0, pz = player && player.alive ? player.z : 0;
      const cx = px * 0.18, cz = pz * 0.12;
      shake = Math.max(0, shake - dt);
      const sk = shake * shake * 2.2;
      camera.position.set(cx + (Math.random() - 0.5) * sk, (portrait ? 22 : 15.5) + (Math.random() - 0.5) * sk, (portrait ? 13 : 14.5) + cz);
      camera.lookAt(cx, -0.5, cz + (portrait ? 0.5 : 0.8));
    }
    camera.updateMatrixWorld();
    // Name tags.
    for (const b of blobs) {
      if (!b.alive) continue;
      tmpV.set(b.x, b.y + 1.55, b.z).project(camera);
      const vis = tmpV.z < 1 && Math.abs(tmpV.x) < 1.1 && Math.abs(tmpV.y) < 1.1;
      b.tag.style.display = vis ? "" : "none";
      if (vis) b.tag.style.transform = "translate(" + ((tmpV.x + 1) / 2 * W) + "px," + ((1 - tmpV.y) / 2 * H) + "px) translate(-50%,-100%)";
    }
  }

  // ======================= flow =======================
  const banner = $("banner");
  let bannerUntil = 0;
  function flash(text, ms) {
    banner.textContent = text; bannerUntil = performance.now() + ms; banner.style.fontSize = text.length > 8 ? "clamp(24px,5vw,44px)" : "";
    banner.classList.remove("pop"); void banner.offsetWidth; banner.classList.add("pop");
  }

  let starting = false;
  async function startMode(m) {
    if (starting) return;
    starting = true;
    if (mg) { const ok = await mg.gate(); if (!ok) { starting = false; return; } }
    starting = false;
    $("menu").classList.add("hidden"); $("result").classList.add("hidden"); stage.classList.remove("menu");
    setupRound(m);
    state = "countdown"; countdown = 3.0;
    $("hud").classList.remove("hidden");
    $("touch").classList.toggle("hidden", !isTouch);
    mg && mg.startPlaying();
  }

  function finish(won) {
    if (state !== "play") return;
    state = "over"; endTimer = 0;
    roundOver();
    const secs = Math.floor(t);
    let title, stats;
    if (mode === "infinite") {
      const score = secs + hops * 2;
      title = score > best ? "NEW BEST!" : "You tumbled!";
      stats = "Survived <b>" + t.toFixed(1) + "s</b> · Hops <b>" + hops + "</b><br>Score <b>" + score + "</b> (1 per second + 2 per hop)";
      if (!player.god) submitInfinite(score);   // the test hook's no-fall mode never reaches the leaderboard
    } else {
      const alive = blobs.filter((b) => b.alive).length;
      if (won && alive === 1) { title = "VICTORY! 👑"; stats = "Last blob standing after <b>" + t.toFixed(1) + "s</b> · Hops <b>" + hops + "</b>"; }
      else if (won) { title = "QUALIFIED!"; stats = "You survived the full minute with <b>" + (alive - 1) + "</b> other" + (alive === 2 ? "" : "s") + " · Hops <b>" + hops + "</b>"; }
      else { title = "ELIMINATED"; stats = "You finished <b>#" + finalPlace + "</b> of 8 after <b>" + t.toFixed(1) + "s</b> · Hops <b>" + hops + "</b>"; }
    }
    $("resTitle").textContent = title; $("resStats").innerHTML = stats;
    $("resEmoji").textContent = won || title === "NEW BEST!" ? (finalPlace === 1 && mode === "classic" && blobs.filter((b) => b.alive).length === 1 ? "👑" : "🏆") : "💫";
    if (won || title === "NEW BEST!") for (let k = 0; k < 4; k++) setTimeout(() => burst("cube", (Math.random() - 0.5) * 8, 6, (Math.random() - 0.5) * 6, 30, [0xff5d8f, 0xffd84d, 0x4dd8ff, 0x8cff5a, 0xb07cff], 4, 2.4), k * 250);
    setTimeout(() => { if (state === "over") { $("result").classList.remove("hidden"); $("touch").classList.add("hidden"); } }, 900);
  }

  function hud() {
    if (mode === "infinite") {
      $("hudA").innerHTML = "Time <span>" + t.toFixed(1) + "</span>";
      $("hudB").innerHTML = "Hops <span>" + hops + "</span>";
      $("hudC").innerHTML = "Best <span>" + best + "</span>";
    } else {
      $("hudA").innerHTML = "Time left <span>" + Math.max(0, CLASSIC_TIME - t).toFixed(0) + "</span>";
      $("hudB").innerHTML = "Alive <span>" + blobs.filter((b) => b.alive).length + "/8</span>";
      $("hudC").innerHTML = "Hops <span>" + hops + "</span>";
    }
  }

  $("playClassic").onclick = () => startMode("classic");
  $("playInfinite").onclick = () => startMode("infinite");
  $("again").onclick = () => startMode(mode);
  $("toMenu").onclick = () => {
    state = "menu"; setupMenu(); stage.classList.add("menu");
    $("result").classList.add("hidden"); $("hud").classList.add("hidden"); $("menu").classList.remove("hidden");
  };

  // ======================= main loop =======================
  let last = performance.now(), menuSpin = 0;
  function frame(now) {
    const dt = Math.min(0.04, (now - last) / 1000); last = now;
    for (const c of clouds) c.rotation.y += c.userData.spin;
    if (state === "menu") {
      menuSpin += dt * 0.12;
      stepMenu(dt);
      camera.position.set(Math.sin(menuSpin) * 19, 10, Math.cos(menuSpin) * 19); camera.lookAt(0, -1, 0);
      updateMeshes(dt, true);
    } else if (state === "countdown") {
      countdown -= dt;
      const n = Math.ceil(countdown);
      if (n > 0) { if (banner.textContent !== String(n)) { flash(String(n), 1000); beep(440, 0.12, "square", 0.04); } }
      else { state = "play"; flash("GO!", 700); sfx.go(); }
      updateMeshes(dt); hud();
    } else if (state === "play" || state === "over") {
      const D = difficulty(t);
      if (state === "play") t += dt;
      else endTimer += dt;
      const sub = 2, h = dt / sub;
      for (let s = 0; s < sub; s++) {
        stepArms(h, D);
        if (state === "play" || state === "over") stepBlocks(h, D);
        for (const b of blobs) {
          if (!b.alive) continue;
          if (b.isPlayer) {
            const inp = s === 0 ? playerInput() : { ix: lastInp.ix, iz: lastInp.iz, jump: false };
            if (s === 0) lastInp = inp;
            stepBlob(b, h, inp.ix, inp.iz, inp.jump);
          } else {
            const ai = botThink(b, h);
            stepBlob(b, h, ai.ix, ai.iz, ai.jump);
          }
        }
        collideBlobs();
      }
      if (state === "play" && mode === "classic" && t >= CLASSIC_TIME) { finalPlace = 1; finish(true); }
      updateMeshes(dt); hud();
    }
    if (bannerUntil && now > bannerUntil) { banner.textContent = ""; bannerUntil = 0; }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  let lastInp = { ix: 0, iz: 0, jump: false };

  resize();
  setupMenu(); stage.classList.add("menu");
  requestAnimationFrame(frame);
  // Test hook: lets automated checks read the game state without poking at internals.
  window.__tumble = { get state() { return state; }, get mode() { return mode; }, get t() { return t; }, get hops() { return hops; },
                      get alive() { return blobs.filter((b) => b.alive).length; },
                      get outs() { return outLog.slice(); },
                      god(on) { if (player) player.god = !!on; } };   // automated tests only
})();
</script>
</body>
</html>
