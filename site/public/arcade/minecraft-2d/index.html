<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Minecraft 2D</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden; }
canvas { display:block; image-rendering:pixelated; }
#ui { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
#overlay { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85);
  display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; font-family:monospace; }
#overlay h1 { font-size:48px; color:#4cff4c; text-shadow:3px 3px #000; margin-bottom:10px; }
#overlay p { font-size:16px; color:#ccc; margin:4px 0; }
#overlay button { margin-top:20px; padding:12px 40px; font-size:20px; background:#4cff4c; color:#000;
  border:none; cursor:pointer; font-family:monospace; font-weight:bold; border-radius:4px; pointer-events:all; }
#overlay button:hover { background:#2dd; }
#deathscreen { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(80,0,0,0.85);
  display:none; flex-direction:column; align-items:center; justify-content:center; color:#fff; font-family:monospace; }
#deathscreen h1 { font-size:48px; color:#f44; margin-bottom:10px; }
#deathscreen button { margin-top:20px; padding:12px 40px; font-size:20px; background:#f44; color:#fff;
  border:none; cursor:pointer; font-family:monospace; font-weight:bold; border-radius:4px; pointer-events:all; }
#craftUI { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  background:#555; border:3px solid #222; padding:20px; display:none; font-family:monospace; color:#fff; pointer-events:all; border-radius:4px; min-width:340px; }
#craftUI h2 { text-align:center; margin-bottom:12px; color:#ff0; }
.craftRow { display:flex; align-items:center; gap:8px; margin:6px 0; cursor:pointer; padding:6px; border-radius:4px; }
.craftRow:hover { background:#777; }
.craftIcon { width:32px; height:32px; border:2px solid #888; display:flex; align-items:center; justify-content:center; font-size:18px; background:#333; }
.craftResult { font-size:13px; }
#craftClose { float:right; cursor:pointer; color:#f88; font-size:18px; pointer-events:all; }
#touchControls { position:fixed; bottom:0; left:0; right:0; display:none; justify-content:space-between;
  align-items:flex-end; padding:8px 12px 12px; pointer-events:none; z-index:200; }
@media (pointer:coarse) { #touchControls { display:flex; } canvas { touch-action:none; } }
.touch-left,.touch-right { display:flex; gap:5px; flex-direction:column; align-items:center; pointer-events:all; }
.trow { display:flex; gap:5px; }
.tbtn { width:58px; height:58px; border-radius:14px; background:rgba(0,0,0,0.45);
  border:2px solid rgba(255,255,255,0.4); color:#fff; font-size:22px;
  display:flex; align-items:center; justify-content:center;
  touch-action:none; user-select:none; -webkit-user-select:none; cursor:pointer; }
.tbtn:active,.tbtn.pressed { background:rgba(255,255,255,0.3); border-color:#fff; }
.tbtn.mine { background:rgba(80,40,0,0.6); }
.tbtn.place { background:rgba(0,80,0,0.6); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touchControls">
  <div class="touch-left">
    <div class="trow"><div style="width:58px"></div><div class="tbtn" id="tb-up">↑</div><div style="width:58px"></div></div>
    <div class="trow"><div class="tbtn" id="tb-left">←</div><div style="width:58px"></div><div class="tbtn" id="tb-right">→</div></div>
  </div>
  <div class="touch-right">
    <div class="trow"><div class="tbtn mine" id="tb-mine">⛏️</div><div class="tbtn place" id="tb-place">🧱</div></div>
    <div class="trow"><div class="tbtn" id="tb-punch">👊</div><div class="tbtn" id="tb-craft">⚒️</div></div>
  </div>
</div>
<div id="overlay">
  <h1>⛏️ Minecraft 2D</h1>
  <p>Arrow keys or WASD to move &amp; jump</p>
  <p><b>Z</b> to mine the block you're looking at</p>
  <p><b>X</b> to place your selected block</p>
  <p>1-9 to select hotbar slot</p>
  <p>E to open crafting</p>
  <p>Survive the night and find diamonds!</p>
  <button id="startBtn">Play!</button>
</div>
<div id="deathscreen">
  <h1>You Died!</h1>
  <p id="deathMsg"></p>
  <button id="respawnBtn">Respawn</button>
</div>
<div id="craftUI">
  <span id="craftClose">✕</span>
  <h2>⚒️ Crafting</h2>
  <div id="craftList"></div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 800, H = 550;
canvas.width = W; canvas.height = H;

// Block types
const AIR=0, GRASS=1, DIRT=2, STONE=3, WOOD=4, LEAVES=5, SAND=6,
      COAL=7, IRON=8, DIAMOND=9, PLANK=10, TORCH=11, CHEST_B=12,
      GRAVEL=13, GLASS=14, CRAFTING=15, BEDROCK=16, WATER=17, GOLD=18;

const BLOCK_DATA = {
  [GRASS]:    { name:'Grass',    color:'#4a8',  top:'#5c4',  hardness:1,  drop:DIRT },
  [DIRT]:     { name:'Dirt',     color:'#964',  hardness:1,  drop:DIRT },
  [STONE]:    { name:'Stone',    color:'#888',  hardness:4,  drop:STONE },
  [WOOD]:     { name:'Wood',     color:'#864',  hardness:2,  drop:WOOD },
  [LEAVES]:   { name:'Leaves',   color:'#393',  hardness:0.5,drop:LEAVES },
  [SAND]:     { name:'Sand',     color:'#ec9',  hardness:0.8,drop:SAND },
  [COAL]:     { name:'Coal Ore', color:'#666',  spot:'#111', hardness:5,  drop:COAL },
  [IRON]:     { name:'Iron Ore', color:'#888',  spot:'#ca8', hardness:6,  drop:IRON },
  [DIAMOND]:  { name:'Diamond',  color:'#778',  spot:'#4ef', hardness:8,  drop:DIAMOND },
  [GOLD]:     { name:'Gold Ore', color:'#888',  spot:'#fd4', hardness:7,  drop:GOLD },
  [PLANK]:    { name:'Plank',    color:'#b84',  hardness:2,  drop:PLANK },
  [TORCH]:    { name:'Torch',    color:'#ff8',  hardness:0.1,drop:TORCH },
  [CHEST_B]:  { name:'Chest',    color:'#a63',  hardness:2,  drop:CHEST_B },
  [GRAVEL]:   { name:'Gravel',   color:'#887',  hardness:1,  drop:GRAVEL },
  [GLASS]:    { name:'Glass',    color:'rgba(180,220,255,0.3)', hardness:0.5, drop:GLASS },
  [CRAFTING]: { name:'Crafting Table', color:'#974', top:'#b85', hardness:2, drop:CRAFTING },
  [BEDROCK]:  { name:'Bedrock',  color:'#333',  hardness:999,drop:BEDROCK },
  [WATER]:    { name:'Water',    color:'rgba(30,100,200,0.5)', hardness:999, drop:AIR },
};

// World dimensions
const BS = 20; // block size pixels
const WW = 200; // world width in blocks
const WH = 100; // world height in blocks

let world = [];
let cameraX = 0, cameraY = 0;

// Player
let player = {};
let keys = {};
let mineTarget = null, mineProgress = 0;
let gameRunning = false;

// Entities
let zombies = [], drops = [], particles = [];

// Time
let dayTimer = 0;
const DAY_LENGTH = 3600; // frames per full cycle

// Hotbar
let hotbar = [];
let hotbarSel = 0;

// Inventory (counts)
let inv = {};

function addInv(type, count=1) {
  inv[type] = (inv[type]||0) + count;
  syncHotbar();
}
function useInv(type, count=1) {
  if (!inv[type] || inv[type] < count) return false;
  inv[type] -= count;
  if (inv[type] <= 0) delete inv[type];
  syncHotbar();
  return true;
}

function syncHotbar() {
  // Rebuild hotbar from inventory, keep selected types
  const types = Object.keys(inv).filter(k=>inv[k]>0).map(Number);
  // Keep existing slots if still in inv
  for (let i=0;i<9;i++) {
    if (hotbar[i] !== undefined && !types.includes(hotbar[i])) {
      hotbar[i] = undefined;
    }
  }
  // Fill empty slots with new types
  for (const t of types) {
    if (!hotbar.includes(t)) {
      const empty = hotbar.findIndex(h=>h===undefined);
      if (empty>=0) hotbar[empty]=t;
      else if (hotbar.length<9) hotbar.push(t);
    }
  }
}

// Crafting recipes
const RECIPES = [
  { result: PLANK, count: 4, need: [[WOOD,1]], name:'Wooden Planks', icon:'🪵' },
  { result: CRAFTING, count: 1, need: [[PLANK,4]], name:'Crafting Table', icon:'🔨' },
  { result: GLASS, count: 1, need: [[SAND,1]], name:'Glass', icon:'🪟' },
  { result: TORCH, count: 4, need: [[COAL,1],[WOOD,1]], name:'Torches (x4)', icon:'🔦' },
];

// Noise helper
function noise(x, seed=0) {
  let n = Math.sin(x*127.1+seed*311.7)*43758.5453;
  return n - Math.floor(n);
}
function smoothNoise(x, seed=0) {
  const i=Math.floor(x), f=x-i;
  const a=noise(i,seed), b=noise(i+1,seed);
  const t=f*f*(3-2*f);
  return a+(b-a)*t;
}
function fractal(x, seed=0, octaves=4) {
  let v=0, amp=1, freq=1, max=0;
  for(let o=0;o<octaves;o++){v+=smoothNoise(x*freq,seed+o*100)*amp;max+=amp;amp*=0.5;freq*=2;}
  return v/max;
}

function generateWorld() {
  world = [];
  for (let x=0;x<WW;x++) {
    world[x]=[];
    for (let y=0;y<WH;y++) world[x][y]=AIR;
  }

  // Terrain heights
  const heights = [];
  for (let x=0;x<WW;x++) {
    const h = Math.floor(30 + fractal(x/50, 42) * 18);
    heights[x] = h;
  }

  // Sand/beach areas
  for (let x=0;x<WW;x++) {
    const h = heights[x];
    for (let y=h;y<WH-1;y++) {
      if (y===h) {
        // surface: grass or sand near sea level
        world[x][y] = (h > 42) ? SAND : GRASS;
      } else if (y<h+4) {
        world[x][y] = (h > 42) ? SAND : DIRT;
      } else if (y<WH-2) {
        world[x][y] = STONE;
      } else {
        world[x][y] = BEDROCK;
      }
    }
    world[x][WH-1]=BEDROCK;
  }

  // Caves
  for (let i=0;i<60;i++) {
    let cx=Math.floor(Math.random()*WW);
    let cy=Math.floor(heights[cx]+10+Math.random()*30);
    let dx=(Math.random()-.5)*2, dy=(Math.random()-.5)*0.5;
    let len=20+Math.floor(Math.random()*40);
    for (let s=0;s<len;s++) {
      cx+=dx; cy+=dy;
      dx+=(Math.random()-.5)*0.4; dy+=(Math.random()-.5)*0.2;
      const r=2+Math.floor(Math.random()*3);
      for (let ox=-r;ox<=r;ox++) for (let oy=-r;oy<=r;oy++) {
        if (ox*ox+oy*oy<=r*r) {
          const bx=Math.round(cx)+ox, by=Math.round(cy)+oy;
          if (bx>0&&bx<WW-1&&by>heights[bx]&&by<WH-2&&world[bx][by]!==BEDROCK)
            world[bx][by]=AIR;
        }
      }
    }
  }

  // Ore veins
  function placeOre(type, count, minY, maxY, veinSize) {
    for (let i=0;i<count;i++) {
      const ox=Math.floor(Math.random()*WW);
      const oy=Math.floor(minY+Math.random()*(maxY-minY));
      const r=veinSize;
      for (let dx=-r;dx<=r;dx++) for (let dy=-r;dy<=r;dy++) {
        if (Math.random()<0.6&&dx*dx+dy*dy<=r*r) {
          const bx=ox+dx,by=oy+dy;
          if (bx>=0&&bx<WW&&by>=0&&by<WH&&world[bx][by]===STONE)
            world[bx][by]=type;
        }
      }
    }
  }
  placeOre(COAL,80,5,90,2);
  placeOre(IRON,50,15,90,1);
  placeOre(GOLD,30,40,90,1);
  placeOre(DIAMOND,20,60,90,1);

  // Gravel patches
  placeOre(GRAVEL,40,5,80,2);

  // Trees
  for (let x=5;x<WW-5;x++) {
    if (world[x][heights[x]]===GRASS && Math.random()<0.12) {
      const trunkH=4+Math.floor(Math.random()*3);
      for (let dy=1;dy<=trunkH;dy++) {
        if (heights[x]-dy>=0) world[x][heights[x]-dy]=WOOD;
      }
      const ty=heights[x]-trunkH;
      for (let lx=-2;lx<=2;lx++) for (let ly=-2;ly<=2;ly++) {
        const bx=x+lx,by=ty+ly;
        if (bx>=0&&bx<WW&&by>=0&&by<WH&&world[bx][by]===AIR)
          world[bx][by]=LEAVES;
      }
    }
  }

  // Water pools in low areas
  for (let x=2;x<WW-2;x++) {
    if (heights[x]>44 && Math.random()<0.05) {
      world[x][heights[x]-1]=WATER;
    }
  }
}

function initPlayer() {
  // Find spawn: surface near middle
  let sx = Math.floor(WW/2);
  while (world[sx][0]!==AIR && sx<WW) sx++;
  let sy = 0;
  while (sy<WH && world[sx][sy]===AIR) sy++;
  sy--;

  player = {
    x: sx*BS+BS/2, y: sy*BS-30,
    vx:0, vy:0,
    w:14, h:28,
    hp:20, maxHp:20,
    onGround:false,
    iframes:0,
    dead:false,
  };
  hotbar = [undefined,undefined,undefined,undefined,undefined,undefined,undefined,undefined,undefined];
  hotbarSel = 0;
  inv = {};
  addInv(DIRT, 5);
  addInv(PLANK, 10);
  addInv(TORCH, 5);
}

function spawnZombie() {
  // Spawn off-screen
  const side = Math.random()<0.5?-1:1;
  const sx = player.x + side*(W/2+BS*3);
  const bx = Math.floor(sx/BS);
  if (bx<0||bx>=WW) return;
  let by=0; while(by<WH&&world[bx][by]===AIR) by++;
  if (by>=WH) return;
  zombies.push({
    x:bx*BS+BS/2, y:(by-1)*BS,
    vx:0, vy:0, hp:10, maxHp:10,
    w:12, h:24, iframes:0,
    dead:false,
  });
}

// Physics
const GRAVITY = 0.4;
const JUMP_FORCE = -9;
const MOVE_SPEED = 3;

function blockAt(bx,by) {
  if (bx<0||bx>=WW||by<0||by>=WH) return BEDROCK;
  return world[bx][by];
}
function isSolid(b) {
  return b!==AIR && b!==WATER && b!==LEAVES && b!==TORCH;
}

function moveEntity(e) {
  e.vy += GRAVITY;
  if (e.vy>12) e.vy=12;

  // Horizontal
  e.x += e.vx;
  const bx1=Math.floor((e.x-e.w/2)/BS), bx2=Math.floor((e.x+e.w/2-1)/BS);
  const by1=Math.floor((e.y)/BS), by2=Math.floor((e.y+e.h-1)/BS);
  if (e.vx>0 && (isSolid(blockAt(bx2,by1))||isSolid(blockAt(bx2,by2)))) {
    e.x = bx2*BS - e.w/2; e.vx=0;
  }
  if (e.vx<0 && (isSolid(blockAt(bx1,by1))||isSolid(blockAt(bx1,by2)))) {
    e.x = (bx1+1)*BS + e.w/2; e.vx=0;
  }

  // Vertical
  e.y += e.vy;
  const bx3=Math.floor((e.x-e.w/2)/BS), bx4=Math.floor((e.x+e.w/2-1)/BS);
  const by3=Math.floor((e.y)/BS), by4=Math.floor((e.y+e.h-1)/BS);
  e.onGround=false;
  if (e.vy>0 && (isSolid(blockAt(bx3,by4))||isSolid(blockAt(bx4,by4)))) {
    e.y = by4*BS - e.h; e.vy=0; e.onGround=true;
  }
  if (e.vy<0 && (isSolid(blockAt(bx3,by3))||isSolid(blockAt(bx4,by3)))) {
    e.y = (by3+1)*BS; e.vy=0;
  }
}

function update() {
  if (!gameRunning) return;

  dayTimer++;
  const timeOfDay = (dayTimer % DAY_LENGTH) / DAY_LENGTH; // 0..1
  const isNight = timeOfDay > 0.5;

  // Zombie spawning at night
  if (isNight && zombies.length < 8 && Math.random() < 0.01) spawnZombie();
  // Despawn zombies at dawn
  if (!isNight) zombies = zombies.filter(z=>!z.dead && Math.hypot(z.x-player.x,z.y-player.y)<600);

  // Player movement
  if (keys['ArrowLeft']||keys['a']) { player.vx=-MOVE_SPEED; facingX=-1; }
  else if (keys['ArrowRight']||keys['d']) { player.vx=MOVE_SPEED; facingX=1; }
  else { player.vx*=0.8; }
  if (keys['ArrowDown']||keys['s']) facingY=1;
  else if (keys['ArrowUp']||keys['w']) facingY=-1;
  else facingY=0;
  if ((keys['ArrowUp']||keys['w']||keys[' ']) && player.onGround) {
    player.vy=JUMP_FORCE;
  }
  if (placeCooldown>0) placeCooldown--;
  if (attackCooldown>0) attackCooldown--;
  // Hold Z to keep mining
  if (keys['z']||keys['Z']) startMine(); else if (!keys['z']&&!keys['Z']&&mineTarget) { mineTarget=null; mineProgress=0; }

  moveEntity(player);

  // Clamp player in world
  player.x = Math.max(player.w/2, Math.min(WW*BS-player.w/2, player.x));
  player.y = Math.min((WH-1)*BS, player.y);

  // Camera
  cameraX = player.x - W/2;
  cameraY = player.y - H*0.4;
  cameraX = Math.max(0, Math.min(WW*BS-W, cameraX));
  cameraY = Math.max(0, Math.min(WH*BS-H, cameraY));

  // Mining
  if (mineTarget) {
    const {bx,by} = mineTarget;
    const b = blockAt(bx,by);
    if (b===AIR||b===WATER) { mineTarget=null; mineProgress=0; }
    else {
      mineProgress += 1/(BLOCK_DATA[b]?.hardness||1) * 0.12;
      if (mineProgress>=1) {
        const drop = BLOCK_DATA[b]?.drop;
        if (drop && drop!==AIR) {
          addInv(drop,1);
          spawnDrop(bx*BS+BS/2, by*BS+BS/2, drop);
        }
        world[bx][by]=AIR;
        mineTarget=null; mineProgress=0;
      }
    }
  }

  // Zombies
  for (const z of zombies) {
    if (z.dead) continue;
    if (z.iframes>0) z.iframes--;
    // Move toward player
    const dx=player.x-z.x;
    z.vx = dx>0?1.2:-1.2;
    moveEntity(z);
    // Zombie attacks player
    if (Math.abs(z.x-player.x)<14 && Math.abs(z.y-player.y)<28 && player.iframes<=0) {
      player.hp-=1;
      player.iframes=30;
      if (player.hp<=0) die();
    }
    // Player attacks zombie (punching - no weapon for now)
  }
  zombies = zombies.filter(z=>!z.dead);

  // Player iframes
  if (player.iframes>0) player.iframes--;

  // Drops pickup
  drops = drops.filter(d=>{
    if (Math.hypot(d.x-player.x,d.y-player.y)<20) {
      addInv(d.type,1);
      return false;
    }
    return true;
  });

  // Particles
  for (const p of particles) { p.x+=p.vx; p.y+=p.vy; p.life--; p.vy+=0.1; }
  particles = particles.filter(p=>p.life>0);
}

function spawnDrop(x,y,type) {
  drops.push({x,y,type});
  for(let i=0;i<4;i++) particles.push({x,y,vx:(Math.random()-.5)*3,vy:-Math.random()*3,life:20,color:BLOCK_DATA[type]?.color||'#888'});
}

function die() {
  gameRunning=false;
  const ds=document.getElementById('deathscreen');
  ds.style.display='flex';
  document.getElementById('deathMsg').textContent='You lost all your hearts!';
}

// Player facing direction: 1=right, -1=left, vertical offset: -1=up, 0=mid, 1=down
let facingX=1, facingY=0;
let placeCooldown=0;
let attackCooldown=0;

// Input
window.addEventListener('keydown', e=>{
  keys[e.key]=true;
  if (e.key>='1'&&e.key<='9') hotbarSel=parseInt(e.key)-1;
  if (e.key==='e'||e.key==='E') toggleCraft();
  if ((e.key==='x'||e.key==='X') && gameRunning && placeCooldown<=0) { placeBlock(); placeCooldown=15; }
  if ((e.key==='f'||e.key==='F') && gameRunning) punchZombies();
  if (e.key==='z'||e.key==='Z') startMine();
  e.preventDefault();
});
window.addEventListener('keyup', e=>{
  keys[e.key]=false;
  if (e.key==='z'||e.key==='Z') { mineTarget=null; mineProgress=0; }
});

function getTargetBlock() {
  // Target block in front of player based on facing direction
  const px=Math.floor(player.x/BS);
  const py=Math.floor((player.y+player.h/2)/BS); // mid-body height
  const tx=px+facingX;
  const ty=py+facingY;
  if (tx<0||tx>=WW||ty<0||ty>=WH) return null;
  return {bx:tx, by:ty};
}

function getPlaceBlock() {
  // Place block adjacent to where we're targeting — prefer in front, then above/below
  const t=getTargetBlock();
  if (!t) return null;
  // If the target is solid, place in front of it (between player and target)
  if (blockAt(t.bx,t.by)!==AIR) {
    // Place on the near side of the target
    const px=Math.floor(player.x/BS);
    const py=Math.floor((player.y+player.h/2)/BS);
    return {bx:px+facingX, by:py}; // same spot as target but check if air
  }
  return t;
}

function startMine() {
  const t=getTargetBlock();
  if (!t) { mineTarget=null; return; }
  if (!mineTarget||mineTarget.bx!==t.bx||mineTarget.by!==t.by) {
    mineTarget=t; mineProgress=0;
  }
}

function placeBlock() {
  const px=Math.floor(player.x/BS);
  const py=Math.floor(player.y/BS);
  // Try placing in front at mid and head height
  const candidates=[
    {bx:px+facingX, by:py+1},
    {bx:px+facingX, by:py},
    {bx:px, by:py-1},
  ];
  for (const {bx,by} of candidates) {
    if (bx<0||bx>=WW||by<0||by>=WH) continue;
    if (blockAt(bx,by)!==AIR) continue;
    // Don't place inside player
    const px1=Math.floor((player.x-player.w/2)/BS), px2=Math.floor((player.x+player.w/2-1)/BS);
    const py1=Math.floor(player.y/BS), py2=Math.floor((player.y+player.h-1)/BS);
    if (bx>=px1&&bx<=px2&&by>=py1&&by<=py2) continue;
    const type=hotbar[hotbarSel];
    if (type===undefined) return;
    if (!useInv(type,1)) return;
    world[bx][by]=type;
    return;
  }
}

function punchZombies() {
  if (attackCooldown>0) return;
  const px=Math.floor(player.x/BS);
  for (const z of zombies) {
    if (z.dead||z.iframes>0) continue;
    if (Math.hypot(z.x-player.x,z.y-(player.y+player.h/2))<40) {
      z.hp-=5; z.iframes=20;
      z.vx=(z.x>player.x?4:-4); z.vy=-5;
      if (z.hp<=0) { z.dead=true; for(let i=0;i<8;i++) particles.push({x:z.x,y:z.y,vx:(Math.random()-.5)*4,vy:-Math.random()*4,life:30,color:'#373'}); }
    }
  }
  attackCooldown=20;
}

// Draw
function getSkyColor(timeOfDay) {
  // 0=midnight,0.25=dawn,0.5=noon,0.75=dusk,1=midnight
  if (timeOfDay<0.2) return '#000820'; // night
  if (timeOfDay<0.3) { // dawn
    const t=(timeOfDay-0.2)/0.1;
    return lerpColor('#000820','#ff7040',t);
  }
  if (timeOfDay<0.7) { // day
    const t=Math.min(1,(timeOfDay-0.3)/0.1);
    return lerpColor('#ff7040','#4af',t);
  }
  if (timeOfDay<0.8) { // dusk
    const t=(timeOfDay-0.7)/0.1;
    return lerpColor('#4af','#ff4020',t);
  }
  return '#000820'; // night
}

function lerpColor(a,b,t) {
  const ar=parseInt(a.slice(1,3),16),ag=parseInt(a.slice(3,5),16),ab=parseInt(a.slice(5,7),16);
  const br=parseInt(b.slice(1,3),16),bg=parseInt(b.slice(3,5),16),bb=parseInt(b.slice(5,7),16);
  const r=Math.round(ar+(br-ar)*t),g=Math.round(ag+(bg-ag)*t),bv=Math.round(ab+(bb-ab)*t);
  return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${bv.toString(16).padStart(2,'0')}`;
}

function drawBlock(bx,by,sx,sy) {
  const b=world[bx][by];
  if (b===AIR) return;
  const bd=BLOCK_DATA[b];
  if (!bd) return;

  ctx.fillStyle=bd.color;
  ctx.fillRect(sx,sy,BS,BS);

  // Top color for grass/crafting
  if (bd.top && by>0 && world[bx][by-1]===AIR) {
    ctx.fillStyle=bd.top;
    ctx.fillRect(sx,sy,BS,3);
  }

  // Ore spots
  if (bd.spot) {
    ctx.fillStyle=bd.spot;
    ctx.fillRect(sx+3,sy+3,4,4);
    ctx.fillRect(sx+11,sy+11,4,4);
    ctx.fillRect(sx+11,sy+3,3,3);
  }

  // Wood rings
  if (b===WOOD) {
    ctx.strokeStyle='rgba(0,0,0,0.2)';
    ctx.lineWidth=1;
    ctx.strokeRect(sx+2,sy+2,BS-4,BS-4);
  }

  // Torch flame
  if (b===TORCH) {
    ctx.fillStyle='#f80';
    ctx.fillRect(sx+8,sy+2,4,5);
    ctx.fillStyle='#ff0';
    ctx.fillRect(sx+9,sy+3,2,3);
    // Emit light (handled by overlay)
  }

  // Block border
  ctx.strokeStyle='rgba(0,0,0,0.15)';
  ctx.lineWidth=0.5;
  ctx.strokeRect(sx+0.5,sy+0.5,BS-1,BS-1);
}

function draw() {
  const timeOfDay = (dayTimer % DAY_LENGTH) / DAY_LENGTH;
  const sky = getSkyColor(timeOfDay);
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);

  // Sun/Moon
  const sunAngle = timeOfDay * Math.PI * 2;
  const sunX = W/2 + Math.cos(sunAngle-Math.PI/2)*350;
  const sunY = H/2 + Math.sin(sunAngle-Math.PI/2)*250;
  if (timeOfDay<0.5) {
    ctx.fillStyle='#ff0';
    ctx.beginPath(); ctx.arc(sunX,sunY,20,0,Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle='#dde';
    ctx.beginPath(); ctx.arc(sunX,sunY,15,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#889';
    ctx.beginPath(); ctx.arc(sunX+5,sunY-3,10,0,Math.PI*2); ctx.fill();
  }

  // Blocks
  const x0=Math.floor(cameraX/BS), x1=Math.min(WW,x0+Math.ceil(W/BS)+2);
  const y0=Math.floor(cameraY/BS), y1=Math.min(WH,y0+Math.ceil(H/BS)+2);
  for (let bx=x0;bx<x1;bx++) for (let by=y0;by<y1;by++) {
    const sx=bx*BS-cameraX, sy=by*BS-cameraY;
    drawBlock(bx,by,sx,sy);
  }

  // Mine progress
  if (mineTarget && mineProgress>0) {
    const {bx,by}=mineTarget;
    const sx=bx*BS-cameraX, sy=by*BS-cameraY;
    ctx.fillStyle=`rgba(0,0,0,${mineProgress*0.7})`;
    ctx.fillRect(sx,sy,BS,BS);
    // Crack lines
    ctx.strokeStyle='rgba(0,0,0,0.8)';
    ctx.lineWidth=1;
    const n=Math.floor(mineProgress*5);
    for(let i=0;i<n;i++){
      ctx.beginPath();
      ctx.moveTo(sx+Math.random()*BS,sy+Math.random()*BS);
      ctx.lineTo(sx+Math.random()*BS,sy+Math.random()*BS);
      ctx.stroke();
    }
  }

  // Drops
  for (const d of drops) {
    const sx=d.x-cameraX, sy=d.y-cameraY;
    const bd=BLOCK_DATA[d.type];
    ctx.fillStyle=bd?.color||'#888';
    ctx.fillRect(sx-5,sy-5,10,10);
    ctx.strokeStyle='#fff';
    ctx.lineWidth=1;
    ctx.strokeRect(sx-5,sy-5,10,10);
  }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha=p.life/30;
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-cameraX-3,p.y-cameraY-3,6,6);
  }
  ctx.globalAlpha=1;

  // Zombies
  for (const z of zombies) {
    if (z.dead) continue;
    const sx=z.x-cameraX, sy=z.y-cameraY;
    // Body
    ctx.fillStyle='#373';
    ctx.fillRect(sx-z.w/2,sy,z.w,z.h*0.6);
    // Head
    ctx.fillStyle='#484';
    ctx.fillRect(sx-6,sy-14,12,12);
    // Eyes
    ctx.fillStyle='#f00';
    ctx.fillRect(sx-4,sy-11,3,3);
    ctx.fillRect(sx+1,sy-11,3,3);
    // HP bar
    ctx.fillStyle='#f44';
    ctx.fillRect(sx-10,sy-18,20,3);
    ctx.fillStyle='#4f4';
    ctx.fillRect(sx-10,sy-18,20*(z.hp/z.maxHp),3);
  }

  // Player
  {
    const sx=player.x-cameraX, sy=player.y-cameraY;
    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(sx,sy+player.h,8,4,0,0,Math.PI*2); ctx.fill();
    // Legs
    ctx.fillStyle='#448';
    ctx.fillRect(sx-5,sy+player.h*0.55,8,player.h*0.45);
    ctx.fillRect(sx-1,sy+player.h*0.55,8,player.h*0.45);
    // Body
    ctx.fillStyle='#c84';
    ctx.fillRect(sx-player.w/2,sy+player.h*0.3,player.w,player.h*0.35);
    // Head
    ctx.fillStyle='#fca';
    ctx.fillRect(sx-6,sy,12,12);
    // Eyes
    ctx.fillStyle='#222';
    ctx.fillRect(sx-3,sy+4,3,3);
    ctx.fillRect(sx+1,sy+4,3,3);
    // Iframes flash
    if (player.iframes>0 && Math.floor(player.iframes/4)%2===0) {
      ctx.fillStyle='rgba(255,0,0,0.3)';
      ctx.fillRect(sx-player.w/2,sy,player.w,player.h);
    }
  }

  // Night darkness overlay
  if (timeOfDay>0.45) {
    const darkAmt = Math.min(1,(timeOfDay-0.45)/0.1)*0.82;
    if (timeOfDay<0.85) {
      // compute dark amount at night too
    }
    const nightDark = timeOfDay<0.5 ? (timeOfDay-0.45)/0.05 : (timeOfDay>0.85 ? (1-timeOfDay)/0.15 : 1);
    const alpha = Math.min(0.82, nightDark*0.82);
    if (alpha>0) {
      // Add torch lights as holes
      ctx.save();
      ctx.globalCompositeOperation='source-over';
      // Draw dark overlay with holes for torches/player
      const offscreen=document.createElement('canvas');
      offscreen.width=W; offscreen.height=H;
      const oc=offscreen.getContext('2d');
      oc.fillStyle=`rgba(0,0,20,${alpha})`;
      oc.fillRect(0,0,W,H);
      oc.globalCompositeOperation='destination-out';
      // Player light
      const pg=oc.createRadialGradient(player.x-cameraX,player.y-cameraY,0,player.x-cameraX,player.y-cameraY,120);
      pg.addColorStop(0,'rgba(0,0,0,1)');
      pg.addColorStop(1,'rgba(0,0,0,0)');
      oc.fillStyle=pg;
      oc.beginPath(); oc.arc(player.x-cameraX,player.y-cameraY,120,0,Math.PI*2); oc.fill();
      // Torch lights
      for (let bx=x0;bx<x1;bx++) for (let by=y0;by<y1;by++) {
        if (world[bx][by]===TORCH) {
          const tx=bx*BS+BS/2-cameraX, ty=by*BS+BS/2-cameraY;
          const tg=oc.createRadialGradient(tx,ty,0,tx,ty,80);
          tg.addColorStop(0,'rgba(0,0,0,1)');
          tg.addColorStop(1,'rgba(0,0,0,0)');
          oc.fillStyle=tg;
          oc.beginPath(); oc.arc(tx,ty,80,0,Math.PI*2); oc.fill();
        }
      }
      ctx.drawImage(offscreen,0,0);
      ctx.restore();
    }
  }

  // HUD - hearts
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.fillRect(5,5,170,24);
  for (let i=0;i<player.maxHp;i+=2) {
    const hx=8+i*8, hy=9;
    ctx.font='16px serif';
    ctx.fillText(i<player.hp?'❤️':'🖤', hx, hy+12);
  }

  // Time indicator
  const tod = timeOfDay<0.5 ? '☀️ Day' : '🌙 Night';
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.fillRect(W-90,5,85,22);
  ctx.fillStyle='#fff';
  ctx.font='13px monospace';
  ctx.fillText(tod, W-85, 20);

  // Hotbar
  const hbW=9*42+4;
  const hbX=(W-hbW)/2, hbY=H-50;
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.fillRect(hbX,hbY,hbW,42);
  for (let i=0;i<9;i++) {
    const sx=hbX+2+i*42, sy=hbY+2;
    ctx.fillStyle=i===hotbarSel?'rgba(255,255,100,0.4)':'rgba(80,80,80,0.5)';
    ctx.fillRect(sx,sy,38,38);
    ctx.strokeStyle=i===hotbarSel?'#ff0':'#555';
    ctx.lineWidth=2;
    ctx.strokeRect(sx,sy,38,38);
    const type=hotbar[i];
    if (type!==undefined) {
      const bd=BLOCK_DATA[type];
      if (bd) {
        ctx.fillStyle=bd.color;
        ctx.fillRect(sx+5,sy+5,28,22);
        if (bd.top) { ctx.fillStyle=bd.top; ctx.fillRect(sx+5,sy+5,28,4); }
        if (bd.spot) { ctx.fillStyle=bd.spot; ctx.fillRect(sx+10,sy+10,5,5); }
        ctx.fillStyle='#fff';
        ctx.font='11px monospace';
        ctx.fillText(bd.name.slice(0,6), sx+3, sy+36);
        const cnt=inv[type]||0;
        ctx.fillStyle='#ff0';
        ctx.font='10px monospace';
        ctx.fillText(cnt, sx+26, sy+14);
      }
    }
    ctx.fillStyle='#aaa';
    ctx.font='10px monospace';
    ctx.fillText(i+1, sx+2, sy+12);
  }

  // Diamond goal
  if (inv[DIAMOND]&&inv[DIAMOND]>0) {
    ctx.fillStyle='rgba(0,80,200,0.8)';
    ctx.fillRect(W/2-120,10,240,30);
    ctx.fillStyle='#4ef';
    ctx.font='bold 14px monospace';
    ctx.textAlign='center';
    ctx.fillText(`💎 Diamonds found: ${inv[DIAMOND]} — Keep mining!`, W/2,30);
    ctx.textAlign='left';
  }

  // Highlight target block (where Z will mine)
  const t=getTargetBlock();
  if (t && blockAt(t.bx,t.by)!==AIR && blockAt(t.bx,t.by)!==WATER) {
    const sx=t.bx*BS-cameraX, sy=t.by*BS-cameraY;
    ctx.strokeStyle='rgba(255,255,255,0.8)';
    ctx.lineWidth=2;
    ctx.strokeRect(sx,sy,BS,BS);
    if (mineProgress>0) {
      ctx.fillStyle=`rgba(0,0,0,${mineProgress*0.6})`;
      ctx.fillRect(sx,sy,BS,BS);
    }
  }

  // Controls reminder bottom-left
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.fillRect(5,H-75,170,70);
  ctx.fillStyle='#fff';
  ctx.font='11px monospace';
  ctx.fillText('Z - Mine  X - Place', 10, H-58);
  ctx.fillText('F - Punch zombies', 10, H-44);
  ctx.fillText('E - Crafting', 10, H-30);
  ctx.fillText('← → move  ↑/Space jump', 10, H-16);
}

function loop() {
  update();
  draw();
  if (gameRunning) requestAnimationFrame(loop);
}

// Crafting UI
function toggleCraft() {
  const ui=document.getElementById('craftUI');
  if (ui.style.display==='block') { ui.style.display='none'; return; }
  buildCraftList();
  ui.style.display='block';
}

function buildCraftList() {
  const list=document.getElementById('craftList');
  list.innerHTML='';
  for (const r of RECIPES) {
    const canMake=r.need.every(([t,n])=>(inv[t]||0)>=n);
    const row=document.createElement('div');
    row.className='craftRow';
    row.style.opacity=canMake?'1':'0.4';
    row.innerHTML=`
      <div class="craftIcon">${r.icon}</div>
      <div class="craftResult">
        <b>${r.name}</b> (x${r.count})<br>
        <span style="font-size:11px;color:#aaa">Needs: ${r.need.map(([t,n])=>`${n}x ${BLOCK_DATA[t]?.name}`).join(', ')}</span>
      </div>`;
    if (canMake) row.addEventListener('click',()=>{ craft(r); buildCraftList(); });
    list.appendChild(row);
  }
}

function craft(r) {
  for (const [t,n] of r.need) useInv(t,n);
  addInv(r.result, r.count);
}

// ── Touch controls ──────────────────────────────────────────────────────────
function tbHold(id, downFn, upFn) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('touchstart', e=>{ e.preventDefault(); el.classList.add('pressed'); downFn(); }, {passive:false});
  const release = e=>{ e.preventDefault(); el.classList.remove('pressed'); upFn(); };
  el.addEventListener('touchend', release, {passive:false});
  el.addEventListener('touchcancel', release, {passive:false});
}
function tbTap(id, fn) { tbHold(id, fn, ()=>{}); }

tbHold('tb-left',  ()=>{ keys['ArrowLeft']=true; },  ()=>{ keys['ArrowLeft']=false; });
tbHold('tb-right', ()=>{ keys['ArrowRight']=true; }, ()=>{ keys['ArrowRight']=false; });
tbHold('tb-up',    ()=>{ keys['ArrowUp']=true; if(player&&player.onGround){ player.vy=JUMP_FORCE; } }, ()=>{ keys['ArrowUp']=false; });
tbHold('tb-mine',  ()=>{ keys['z']=true; startMine(); }, ()=>{ keys['z']=false; mineTarget=null; mineProgress=0; });
tbTap('tb-place',  ()=>{ if(placeCooldown<=0){ placeBlock(); placeCooldown=15; } });
tbTap('tb-punch',  ()=>{ punchZombies(); });
tbTap('tb-craft',  ()=>{ toggleCraft(); });

// Tap canvas hotbar to select slot
canvas.addEventListener('touchstart', e=>{
  if (!gameRunning) return;
  const r=canvas.getBoundingClientRect(), sx=canvas.width/r.width, sy=canvas.height/r.height;
  for (const t of e.changedTouches) {
    const mx=(t.clientX-r.left)*sx, my=(t.clientY-r.top)*sy;
    const hbW=9*42+4, hbX=(W-hbW)/2, hbY=H-50;
    if (my>=hbY && my<=hbY+42) {
      const slot=Math.floor((mx-hbX)/42);
      if (slot>=0 && slot<9) hotbarSel=slot;
    }
  }
}, {passive:true});

// Scale canvas to fit screen on mobile
function resizeForMobile() {
  const avH = window.innerHeight * (window.innerWidth < 600 ? 0.72 : 1);
  const scale = Math.min(window.innerWidth/W, avH/H, 1);
  canvas.style.width  = Math.round(W*scale)+'px';
  canvas.style.height = Math.round(H*scale)+'px';
}
window.addEventListener('resize', resizeForMobile);
resizeForMobile();
// ────────────────────────────────────────────────────────────────────────────

document.getElementById('craftClose').addEventListener('click',()=>{
  document.getElementById('craftUI').style.display='none';
});

// Start
document.getElementById('startBtn').addEventListener('click',()=>{
  document.getElementById('overlay').style.display='none';
  generateWorld();
  initPlayer();
  zombies=[]; drops=[]; particles=[];
  dayTimer=0;
  gameRunning=true;
  requestAnimationFrame(loop);
});

document.getElementById('respawnBtn').addEventListener('click',()=>{
  document.getElementById('deathscreen').style.display='none';
  generateWorld();
  initPlayer();
  zombies=[]; drops=[]; particles=[];
  dayTimer=0;
  gameRunning=true;
  requestAnimationFrame(loop);
});
</script>
