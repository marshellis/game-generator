<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<script src="/arcade/_sdk/marshellis.js"></script>
<script src="/arcade/_sdk/rounds.js" data-game="laser-hop"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Laser Hop</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Trebuchet MS", "Arial Rounded MT Bold", system-ui, -apple-system, sans-serif;
    background: radial-gradient(ellipse at top, #33206b 0%, #160f38 60%, #0b0820 100%); color: #fff;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 10px; user-select: none; -webkit-user-select: none; overflow-x: hidden;
  }
  .col { width: min(96vw, 900px); }
  #top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #bestChip { font-size: 14px; color: #ddd6fe; background: rgba(255,255,255,.08); padding: 5px 12px; border-radius: 999px; }
  #bestChip b { color: #7ff9ff; font-size: 16px; }
  #stage {
    position: relative; width: min(96vw, 900px); aspect-ratio: 16 / 10; max-height: 78vh;
    border-radius: 20px; overflow: hidden; box-shadow: 0 0 0 4px #ffffff1f, 0 16px 40px rgba(0,0,0,.6);
    background: linear-gradient(#6b5cff, #ffb3e6); touch-action: none;
  }
  @media (max-aspect-ratio: 1/1) { #stage { aspect-ratio: 3 / 4; } }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
             gap: 14px; text-align: center; padding: 16px; }
  #menu { justify-content: space-between; padding: 22px 16px; background: linear-gradient(rgba(22,15,56,.55), rgba(22,15,56,0) 35%, rgba(22,15,56,0) 62%, rgba(22,15,56,.7)); }
  #result { background: radial-gradient(ellipse at center, rgba(22,15,56,.2), rgba(22,15,56,.75)); }
  .hidden { display: none !important; }
  h1 {
    margin: 0; font-size: clamp(40px, 8.5vw, 80px); letter-spacing: 2px; line-height: .95; color: #fff;
    -webkit-text-stroke: 3px #3b0a6b; paint-order: stroke fill;
    text-shadow: 0 0 18px #ff3df2, 0 6px 0 #ff3df2, 0 11px 0 #3b0a6b, 0 18px 26px rgba(0,0,0,.45);
    animation: wob 2.6s ease-in-out infinite;
  }
  h1 span { color: #7ff9ff; }
  @keyframes wob { 0%,100% { transform: rotate(-2deg) scale(1); } 50% { transform: rotate(2deg) scale(1.04); } }
  h2 { margin: 0; font-size: clamp(32px, 6vw, 56px); color: #fff; -webkit-text-stroke: 2px #3b0a6b; paint-order: stroke fill;
       text-shadow: 0 0 14px #ff3df2, 0 5px 0 #ff3df2, 0 10px 18px rgba(0,0,0,.4); animation: popin .45s cubic-bezier(.2,1.6,.4,1); }
  @keyframes popin { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .sub { font-size: 16px; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,.6); }
  .swatches { display: flex; gap: 10px; justify-content: center; align-items: center; background: rgba(22,15,56,.55); padding: 8px 14px; border-radius: 999px; }
  .swatches span { font-weight: 800; font-size: 14px; margin-right: 4px; }
  .sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.4); cursor: pointer; padding: 0;
        box-shadow: 0 3px 0 rgba(0,0,0,.35); transition: transform .1s; }
  .sw.on { border-color: #fff; transform: scale(1.18); box-shadow: 0 0 0 3px #ff3df2, 0 3px 0 rgba(0,0,0,.35); }
  .btn { font: inherit; font-weight: 900; font-size: 22px; padding: 13px 34px; border: 0; border-radius: 18px; cursor: pointer;
         background: linear-gradient(#a8fbff, #3fe0ff); color: #1a0a4a; box-shadow: 0 6px 0 #1597c4, 0 0 22px rgba(63,224,255,.55), 0 12px 20px rgba(0,0,0,.35);
         transition: transform .1s; }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1597c4; }
  .btn.alt { font-size: 18px; padding: 11px 24px; background: linear-gradient(#ffffff, #e9d5ff); box-shadow: 0 6px 0 #a855f7, 0 12px 20px rgba(0,0,0,.35); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .keys { font-size: 13px; background: rgba(22,15,56,.6); padding: 6px 14px; border-radius: 999px; }
  .keys kbd { background: #fff; color: #1e1b4b; border-radius: 5px; padding: 1px 6px; font: inherit; font-weight: 800; box-shadow: 0 2px 0 #a5b4fc; }
  #hud { position: absolute; top: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; pointer-events: none; }
  .pill { background: linear-gradient(rgba(50,30,110,.9), rgba(22,15,56,.9)); padding: 6px 14px; border-radius: 999px; font-weight: 800; font-size: 16px;
          box-shadow: 0 0 0 2px rgba(255,255,255,.22), 0 4px 10px rgba(0,0,0,.3); }
  .pill span { color: #7ff9ff; }
  #hearts { letter-spacing: 2px; }
  #banner { position: absolute; top: 28%; left: 0; right: 0; text-align: center; pointer-events: none;
            font-size: clamp(46px, 11vw, 108px); font-weight: 900; color: #fff; -webkit-text-stroke: 3px #3b0a6b; paint-order: stroke fill;
            text-shadow: 0 0 20px #ff3df2, 0 6px 0 #ff3df2, 0 14px 22px rgba(0,0,0,.4); }
  #banner.pop { animation: bpop .5s cubic-bezier(.2,1.8,.4,1); }
  @keyframes bpop { from { transform: scale(2.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #pop { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .popt { position: absolute; font-weight: 900; font-size: 24px; color: #7ff9ff; -webkit-text-stroke: 1.5px #3b0a6b; paint-order: stroke fill;
          animation: rise .9s ease-out forwards; transform: translate(-50%, -50%); }
  .popt.bad { color: #ff5d7a; }
  @keyframes rise { 0% { transform: translate(-50%,-50%) scale(.5); } 20% { transform: translate(-50%,-50%) scale(1.25); } 100% { opacity: 0; margin-top: -60px; transform: translate(-50%,-50%) scale(1); } }
  #flashRed { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(255,0,60,0) 40%, rgba(255,0,60,.55)); opacity: 0; transition: opacity .35s; }
  #touch { position: absolute; inset: 0; pointer-events: none; }
  .tb { position: absolute; bottom: 16px; width: 84px; height: 84px; border-radius: 50%; border: 0; pointer-events: auto; touch-action: none;
        font: inherit; font-weight: 900; font-size: 30px; color: #1a0a4a; background: radial-gradient(circle at 35% 30%, #fff, #c4b5fd);
        box-shadow: 0 6px 0 #7c3aed, 0 10px 16px rgba(0,0,0,.35); }
  .tb:active, .tb.down { transform: translateY(4px); box-shadow: 0 2px 0 #7c3aed; }
  #stick { position: absolute; width: 116px; height: 116px; border-radius: 50%; border: 3px solid rgba(255,255,255,.6);
           background: radial-gradient(rgba(255,255,255,.05), rgba(255,255,255,.22)); transform: translate(-50%, -50%); pointer-events: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%;
          background: radial-gradient(circle at 35% 35%, #fff, #cfe3ff); box-shadow: 0 4px 10px rgba(0,0,0,.3); }
  #tags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #stage.menu #tags { display: none; }
  .tag { position: absolute; left: 0; top: 0; font-size: 11px; font-weight: 900; color: #fff; padding: 1px 7px; border-radius: 999px;
         background: rgba(22,15,56,.65); white-space: nowrap; will-change: transform; }
  .tag.you { background: #7ff9ff; color: #1a0a4a; font-size: 12px; box-shadow: 0 2px 0 #1597c4; }
  #tJump { right: 16px; width: 96px; height: 96px; font-size: 18px; background: radial-gradient(circle at 35% 30%, #e0fdff, #3fe0ff 60%, #0ea5e9); box-shadow: 0 6px 0 #0369a1, 0 10px 16px rgba(0,0,0,.35); }
  .stats { font-size: 18px; line-height: 1.7; background: rgba(22,15,56,.65); padding: 10px 18px; border-radius: 16px; }
  .stats b { color: #7ff9ff; }
</style>
</head>
<body>
  <div id="top" class="col">
    <div id="mg-chip"></div>
    <div id="bestChip">Best <b id="best">0</b> s</div>
  </div>

  <div id="stage">
    <div id="hud" class="hidden">
      <div class="pill">Time <span id="hudTime">0</span> s</div>
      <div class="pill">Players <span id="hudAlive">6</span></div>
      <div class="pill">Outlasted <span id="hudOut">0</span></div>
    </div>
    <div id="tags"></div>
    <div id="pop"></div>
    <div id="flashRed"></div>
    <div id="banner"></div>
    <div id="touch" class="hidden">
      <div id="stick" class="hidden"><div id="knob"></div></div>
      <button class="tb" id="tJump">JUMP</button>
    </div>

    <div id="menu" class="overlay">
      <h1>LASER<br><span>HOP</span></h1>
      <div class="col" style="display:flex;flex-direction:column;align-items:center;gap:12px">
        <div class="swatches" id="swatches"><span>Your color</span></div>
        <button class="btn" id="play">▶ PLAY</button>
        <div class="keys">Move <kbd>WASD</kbd> / arrows · Jump <kbd>Space</kbd> · Don't get shoved off the edge!</div>
      </div>
    </div>

    <div id="result" class="overlay hidden">
      <div id="resEmoji" style="font-size:54px"></div>
      <h2 id="resTitle"></h2>
      <div class="stats" id="resStats"></div>
      <div class="row">
        <button class="btn" id="again">Play again</button>
        <button class="btn alt" id="toMenu">Menu</button>
      </div>
    </div>
  </div>

  <div id="mg-picker" class="col"></div>
  <div id="mg-account" class="col"></div>
  <div id="mg-board" class="col"></div>

<script src="./three.min.js"></script>
<script>
(function () {
  "use strict";
  // ======================= platform: accounts, leaderboard, play time =======================
  const GAME = "laser-hop";
  // Scores are seconds survived on their own board (an earlier version scored metres on the "laser-hop" board).
  const BOARD = "laser-hop-survive";
  const LS_BEST = "laser-hop:survive-best", LS_COLOR = "laser-hop:color";
  const $ = (id) => document.getElementById(id);
  const mg = window.Marshellis ? Marshellis.init({ game: GAME, chip: "#mg-chip", account: "#mg-account", board: "#mg-board", picker: "#mg-picker" }) : null;
  let best = Number(localStorage.getItem(LS_BEST) || 0) || 0;
  const showBest = () => { $("best").textContent = best; };
  if (mg) mg.refreshBoard(BOARD);
  showBest();
  async function submit(score) {
    if (score > best) { best = score; localStorage.setItem(LS_BEST, String(best)); }
    showBest();
    if (!mg) return;
    const r = await mg.submitScore(score, BOARD);
    if (r && r.best > best) { best = r.best; showBest(); }
  }

  // ======================= tuning =======================
  const HALF_W = 3.6;          // the laser walls sit at x = ±HALF_W

  // ======================= renderer, sky, light =======================
  const stage = $("stage");
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.insertBefore(renderer.domElement, stage.firstChild);
  const scene = new THREE.Scene();
  const FOGC = 0xd6b8ff;
  scene.fog = new THREE.Fog(FOGC, 30, 75);
  const camera = new THREE.PerspectiveCamera(55, 16 / 10, 0.1, 300);

  const sky = new THREE.Mesh(new THREE.SphereGeometry(160, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(0x4a2fd6) }, mid: { value: new THREE.Color(0xffb0e0) }, low: { value: new THREE.Color(0x8c6bff) } },
    vertexShader: "varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
    fragmentShader: "uniform vec3 top; uniform vec3 mid; uniform vec3 low; varying vec3 vP; void main(){ float h = vP.y;" +
      " vec3 c = h > 0.0 ? mix(mid, top, pow(h, 0.55)) : mix(mid, low, pow(-h, 0.6)); gl_FragColor = vec4(c, 1.0); }",
  }));
  scene.add(sky);
  function glowTex(inner, outer) {
    const c = document.createElement("canvas"); c.width = c.height = 128;
    const g = c.getContext("2d"), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, inner); gr.addColorStop(0.3, outer); gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c);
  }
  const sunS = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex("rgba(255,250,230,1)", "rgba(255,190,240,.6)"), fog: false, depthWrite: false }));
  sunS.scale.set(60, 60, 1); sunS.position.set(20, 30, -140); scene.add(sunS);

  const ramp = new THREE.DataTexture(new Uint8Array([105, 105, 115, 255, 185, 185, 195, 255, 255, 255, 255, 255]), 3, 1, THREE.RGBAFormat);
  ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
  const toon = (color, extra) => new THREE.MeshToonMaterial(Object.assign({ color, gradientMap: ramp }, extra || {}));
  const glow = (color, opacity) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity: opacity == null ? 1 : opacity, blending: THREE.AdditiveBlending, depthWrite: false });

  scene.add(new THREE.HemisphereLight(0xffffff, 0x9b7bff, 0.6));
  const sun = new THREE.DirectionalLight(0xfff0f5, 0.95);
  sun.position.set(5, 16, 8); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 12, bottom: -30, near: 1, far: 60 });
  sun.shadow.bias = -0.0015;
  scene.add(sun); scene.add(sun.target);


  // Cartoon outline: a slightly bigger, inside-out, dark copy of the mesh.
  const outlineMat = new THREE.MeshBasicMaterial({ color: 0x24123f, side: THREE.BackSide });
  function outline(mesh, k) {
    const o = new THREE.Mesh(mesh.geometry, outlineMat);
    o.scale.setScalar(k || 1.07); mesh.add(o); return mesh;
  }
  const cast = (m) => { m.castShadow = true; return m; };

  // ======================= the hero: an original round critter =======================
  const COLORS = [
    { name: "Sky", body: 0x4cc3ff, belly: 0xe6f8ff, scarf: 0xff3d7f, shoe: 0xff7a1a, iris: 0x2b6cff },
    { name: "Berry", body: 0xff6fb5, belly: 0xfff0f7, scarf: 0x7ff9ff, shoe: 0x7c3aed, iris: 0x9b30d9 },
    { name: "Lime", body: 0x8ee35a, belly: 0xf3ffe6, scarf: 0xffcf33, shoe: 0x2563eb, iris: 0x16803c },
    { name: "Grape", body: 0xa77bff, belly: 0xf4eeff, scarf: 0xffe14d, shoe: 0xff3d7f, iris: 0x5b21b6 },
    { name: "Mango", body: 0xffad33, belly: 0xfff6e0, scarf: 0x2dd4bf, shoe: 0xe11d48, iris: 0xb45309 },
  ];
  let colorIx = Math.min(COLORS.length - 1, Math.max(0, Number(localStorage.getItem(LS_COLOR) || 0) || 0));

  function makeHero(c) {
    const root = new THREE.Group();
    const rig = new THREE.Group(); rig.position.y = 0.8; root.add(rig);         // spins on a flip
    const body = new THREE.Group(); rig.add(body);                                // squashes and bobs
    const bodyMat = toon(c.body), bellyMat = toon(c.belly), dark = new THREE.MeshBasicMaterial({ color: 0x24123f });
    const torso = outline(cast(new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 24), bodyMat)), 1.06);
    torso.scale.set(1, 1, 0.94); body.add(torso);
    const belly = new THREE.Mesh(new THREE.SphereGeometry(0.38, 24, 16), bellyMat);
    belly.scale.set(1, 1.02, 0.42); belly.position.set(0, -0.12, 0.33); body.add(belly);
    // Ears with pink insides, and a little tuft of fluff on top.
    const ears = [];
    for (const sx of [-1, 1]) {
      const ear = new THREE.Group(); ear.position.set(sx * 0.27, 0.4, -0.04); ear.rotation.z = -sx * 0.38; body.add(ear);
      ear.add(outline(cast(new THREE.Mesh(new THREE.ConeGeometry(0.17, 0.42, 16), bodyMat)), 1.1));
      const inner = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.28, 12), toon(0xff9ec7)); inner.position.set(0, -0.03, 0.07); inner.scale.z = 0.5; ear.add(inner);
      ear.children[0].position.y = 0.17; inner.position.y = 0.13;
      ears.push(ear);
    }
    for (const [x, y, z, r] of [[0, 0.5, 0.06, 0.1], [0.09, 0.47, 0.12, 0.08], [-0.08, 0.48, 0.13, 0.075]]) {
      const tuft = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 10), bodyMat); tuft.position.set(x, y, z); body.add(tuft);
    }
    // Big eyes: white, coloured iris, pupil, two shines. Lids close for blinks; brows show mood.
    const face = new THREE.Group(); body.add(face);
    const eyes = [], brows = [];
    for (const sx of [-1, 1]) {
      const e = new THREE.Group(); e.position.set(sx * 0.18, 0.08, 0.4); face.add(e);
      const white = outline(new THREE.Mesh(new THREE.SphereGeometry(0.15, 20, 16), toon(0xffffff)), 1.08); white.scale.set(0.9, 1.15, 0.55); e.add(white);
      const iris = new THREE.Mesh(new THREE.SphereGeometry(0.095, 18, 14), toon(c.iris)); iris.scale.set(0.9, 1.1, 0.45); iris.position.set(sx * -0.01, -0.01, 0.065); e.add(iris);
      const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.055, 14, 10), dark); pupil.scale.set(0.9, 1.1, 0.45); pupil.position.set(sx * -0.01, -0.01, 0.095); e.add(pupil);
      const s1 = new THREE.Mesh(new THREE.SphereGeometry(0.03, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffffff })); s1.position.set(0.03, 0.045, 0.115); e.add(s1);
      const s2 = new THREE.Mesh(new THREE.SphereGeometry(0.014, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffffff })); s2.position.set(-0.035, -0.045, 0.11); e.add(s2);
      eyes.push(e);
      const brow = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.03, 0.03), dark); brow.position.set(sx * 0.18, 0.3, 0.43); face.add(brow); brows.push(brow);
      const blush = new THREE.Mesh(new THREE.CircleGeometry(0.065, 16), new THREE.MeshBasicMaterial({ color: 0xff7fae, transparent: true, opacity: 0.75 }));
      blush.position.set(sx * 0.31, -0.06, 0.39); blush.rotation.y = sx * 0.55; face.add(blush);
    }
    const nose = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), toon(0x3b1f4f)); nose.scale.set(1.3, 0.9, 0.8); nose.position.set(0, -0.06, 0.48); face.add(nose);
    const smile = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.015, 6, 14, Math.PI), dark); smile.rotation.z = Math.PI; smile.position.set(0, -0.12, 0.47); face.add(smile);
    const mouthO = new THREE.Mesh(new THREE.SphereGeometry(0.06, 14, 10), toon(0x5a1035)); mouthO.scale.set(1, 1.1, 0.4); mouthO.position.set(0, -0.15, 0.45); mouthO.visible = false; face.add(mouthO);
    const tongue = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), toon(0xff6f91)); tongue.position.set(0, -0.03, 0.02); tongue.scale.z = 0.5; mouthO.add(tongue);
    // Scarf: a ring round the neck and two tails that flap in the wind behind.
    const scarfMat = toon(c.scarf);
    const ring = outline(cast(new THREE.Mesh(new THREE.TorusGeometry(0.37, 0.075, 10, 28), scarfMat)), 1.08);
    ring.rotation.x = Math.PI / 2 - 0.15; ring.position.y = -0.27; body.add(ring);
    const tails = [];
    for (const sx of [-1, 1]) {
      const pivot = new THREE.Group(); pivot.position.set(sx * 0.1, -0.27, -0.33); body.add(pivot);
      const seg1 = new THREE.Group(); pivot.add(seg1);
      const p1 = outline(cast(new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.04, 0.3), scarfMat)), 1.12); p1.position.z = -0.15; seg1.add(p1);
      const seg2 = new THREE.Group(); seg2.position.z = -0.3; seg1.add(seg2);
      const p2 = outline(cast(new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.04, 0.26), scarfMat)), 1.12); p2.position.z = -0.13; seg2.add(p2);
      for (const z of [-0.08, -0.17]) { const st = new THREE.Mesh(new THREE.BoxGeometry(0.135, 0.045, 0.035), toon(0xffffff)); st.position.z = z; seg2.add(st); }
      tails.push({ pivot, seg1, seg2, sx });
    }
    // Arms with mitten hands; legs with two-tone sneakers.
    const arms = [], legs = [];
    for (const sx of [-1, 1]) {
      const sh = new THREE.Group(); sh.position.set(sx * 0.44, -0.1, 0.02); body.add(sh);
      const arm = cast(new THREE.Mesh(new THREE.SphereGeometry(0.085, 12, 10), bodyMat)); arm.scale.set(1, 1.8, 1); arm.position.y = -0.12; sh.add(arm);
      const hand = outline(cast(new THREE.Mesh(new THREE.SphereGeometry(0.1, 14, 12), bellyMat)), 1.12); hand.position.y = -0.27; sh.add(hand);
      arms.push(sh);
      const hip = new THREE.Group(); hip.position.set(sx * 0.19, -0.42, 0); rig.add(hip);
      const leg = cast(new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.07, 0.2, 10), bodyMat)); leg.position.y = -0.1; hip.add(leg);
      const shoe = new THREE.Group(); shoe.position.set(0, -0.24, 0.05); hip.add(shoe);
      const top = outline(cast(new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 12), toon(c.shoe))), 1.1); top.scale.set(0.95, 0.68, 1.35); shoe.add(top);
      const sole = cast(new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.05, 0.36), toon(0xffffff))); sole.position.y = -0.07; shoe.add(sole);

    $("resEmoji").textContent = isBest ? "🏆" : how === "zap" ? "⚡" : "💫";
    $("resTitle").textContent = isBest ? "NEW BEST!" : how === "zap" ? "ZAPPED!" : "KNOCKED OFF!";
    $("resStats").innerHTML = "You survived <b>" + score + " s</b> and outlasted <b>" + outlasted + "</b> rival" + (outlasted === 1 ? "" : "s") + "<br>Best: <b>" + Math.max(best, score) + " s</b>";
    if (isBest) for (let k = 0; k < 4; k++) setTimeout(() => burst("cube", (Math.random() - 0.5) * 5, 5, 0, 30, [0xff3df2, 0x7ff9ff, 0xffe14d, 0x8ee35a], 3, 2.4), k * 220);
    setTimeout(() => { if (state === "over") { $("result").classList.remove("hidden"); $("touch").classList.add("hidden"); } }, 1100);
  }

  // ======================= physics =======================
  const PR = 0.36;           // player radius
  function supportUnder(p) {
    // Low blocks can be stood on (and ride you toward the edge!). Tall blocks and spikes can't.
    let s = -Infinity;
    if (Math.abs(p.x) < HALF_W + 0.3 && p.z > FRONT - 0.5 && p.z < BACK) s = 0;
    for (const b of blocks) {
      if (b.tall || b.spikes) continue;
      if (Math.abs(p.x - b.x) < b.w / 2 + PR * 0.4 && Math.abs(p.z - b.z) < b.d / 2 + PR * 0.4 && p.y >= b.h - 0.25) s = Math.max(s, b.h);
    }
    return s;
  }
  function bonk(p, spikes) {
    if (p.stun > 0.2) return;
    p.vz = spikes ? 9.5 : 6; p.vy = 6.5; p.grounded = false; p.stun = 0.6; p.hurt = 0.4; p.squash = 0.3;
    burst(spikes ? "spark" : "puff", p.x, p.y + 0.5, p.z, 10, spikes ? [0xdfe6ff, 0xff2d55, 0xffffff] : 0xffffff, 3, 0.5);
    if (p.you) { shake = 0.35; beep(spikes ? 240 : 180, 0.25, "sawtooth", 0.06, 70); popText(spikes ? "OUCH!" : "BONK!", p.x, p.y + 1.8, p.z, true); }
  }
  function stepPlayer(p, dt, ix, iz, wantJump) {
    if (!p.alive) return;
    p.stun = Math.max(0, p.stun - dt); p.hurt = Math.max(0, p.hurt - dt);
    const ctl = p.stun > 0 ? 0.15 : 1;
    const acc = (p.grounded ? 40 : 14) * ctl;
    const MOVE = 6.4;
    p.vx += Math.max(-acc * dt, Math.min(acc * dt, ix * MOVE - p.vx));
    p.vz += Math.max(-acc * dt, Math.min(acc * dt, iz * MOVE - p.vz));
    if (p.stun > 0 && p.grounded) { const sp = Math.hypot(p.vx, p.vz), dec = Math.min(sp, 14 * dt); if (sp > 0) { p.vx -= p.vx / sp * dec; p.vz -= p.vz / sp * dec; } }
    if (ix || iz) p.face = Math.atan2(ix, iz);
    if (wantJump && p.grounded && p.stun < 0.2) { p.vy = 9.2; p.grounded = false; p.squash = -0.3; if (p.you) beep(380, 0.16, "square", 0.035, 820); burst("puff", p.x, p.y + 0.1, p.z, 4, 0xffffff, 1.3, 0.45); }
    p.vy -= 26 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    const sup = supportUnder(p);
    if (sup > -Infinity && p.y <= sup && p.y > sup - 0.7 && p.vy <= 0) {
      if (!p.grounded && p.vy < -5) { p.squash = 0.3; burst("puff", p.x, p.y + 0.1, p.z, 5, 0xffffff, 1.6, 0.5); }
      p.y = sup; p.vy = 0; p.grounded = true;
      if (sup > 0) p.z += speed * dt;          // riding a block
    } else if (p.y > sup + 0.02) p.grounded = false;
    // the gate wall at the front
    if (p.z < FRONT + PR) { p.z = FRONT + PR; p.vz = Math.max(0, p.vz); }
    // laser walls
    if (Math.abs(p.x) + PR > HALF_W - 0.04 && p.y < 2 && p.z < BACK + 0.4) knockOut(p, "zap");
    // off the back edge
    if (p.y < -7) knockOut(p, "fall");
  }
  function pushByBlocks(p) {
    if (!p.alive) return;
    for (const b of blocks) {
      const ox = b.w / 2 + PR - Math.abs(p.x - b.x), oz = b.d / 2 + PR - Math.abs(p.z - b.z);
      if (ox <= 0 || oz <= 0) continue;
      if (p.y >= b.h - 0.05 || p.y < -1) continue;
      if (b.spikes) { bonk(p, true); continue; }
      if (ox < oz && ox < 0.35) { p.x += Math.sign(p.x - b.x || 1) * ox; p.vx = 0; }   // brushing a side: slide past it
      else if (p.z > b.z) { p.z = b.z + b.d / 2 + PR; p.vz = Math.max(p.vz, speed); if (b.tall && p.you && Math.random() < 0.02) popText("PUSH!", p.x, 2, p.z, true); }
      else { p.z = b.z - b.d / 2 - PR; p.vz = Math.min(p.vz, 0); }
    }
  }
  function bumpPlayers() {
    for (let i = 0; i < players.length; i++) for (let j = i + 1; j < players.length; j++) {
      const a = players[i], c = players[j];
      if (!a.alive || !c.alive || Math.abs(a.y - c.y) > 0.9) continue;
      const dx = c.x - a.x, dz = c.z - a.z, d = Math.hypot(dx, dz), min = PR * 2;
      if (d > 0 && d < min) {
        const nx = dx / d, nz = dz / d, push = (min - d) / 2;
        a.x -= nx * push; a.z -= nz * push; c.x += nx * push; c.z += nz * push;
        const rel = (a.vx - c.vx) * nx + (a.vz - c.vz) * nz;
        if (rel > 0) { a.vx -= nx * rel * 0.7; a.vz -= nz * rel * 0.7; c.vx += nx * rel * 0.7; c.vz += nz * rel * 0.7; }
      }
    }
  }

  // ======================= rival brains =======================
  function think(p) {
    const out = { ix: 0, iz: 0, jump: false };
    // Wander between spots on the deck, staying well away from the back edge.
    p.homeT -= 1 / 120;
    if (p.homeT <= 0) { p.homeT = 3 + Math.random() * 4; p.homeX = LANES[Math.floor(Math.random() * 3)] + (Math.random() - 0.5) * 0.8; p.homeZ = -5 + Math.random() * 7; }
    let tx = p.homeX, tz = p.homeZ;
    // Which blocks are coming at me soon?
    let dodge = 0;
    for (const b of blocks) {
      if (b.z > p.z) continue;
      const gap = (p.z - PR) - (b.z + b.d / 2);           // distance until the front face reaches me
      const tc = gap / speed;
      const inLane = Math.abs(p.x - b.x) < b.w / 2 + PR + 0.15;
      if (!inLane || tc > 1.4) { p.plan.delete(b); continue; }
      if (b.tall) {
        // Find the nearest clear spot sideways.
        dodge = p.x >= b.x ? 1 : -1;
        if (b.x + dodge * (b.w / 2 + PR + 0.5) > HALF_W - 0.6 || b.x + dodge * (b.w / 2 + PR + 0.5) < -HALF_W + 0.6) dodge = -dodge;
        tx = b.x + dodge * (b.w / 2 + PR + 0.6);
      } else {
        let plan = p.plan.get(b);
        if (!plan) { plan = { at: Math.random() < p.skill ? 0.06 + Math.random() * 0.1 : (Math.random() < 0.5 ? 0.45 : -1) }; p.plan.set(b, plan); }
        if (plan.at >= 0 && tc <= plan.at) { out.jump = true; plan.at = -2; }
      }
    }
    // Check the target spot isn't inside a tall block about to arrive; stay off the lasers.
    tx = Math.max(-HALF_W + 1.0, Math.min(HALF_W - 1.0, tx));
    let dx = tx - p.x, dz = tz - p.z;
    const l = Math.hypot(dx, dz);
    if (l > 0.25) { out.ix = dx / l; out.iz = dz / l; }
    if (p.z > BACK - 2.5) { out.iz = -1; }                // too close to the edge: run forward
    return out;
  }

  // ======================= per-frame =======================
  function animate(p, dt) {
    const u = p.h.userData, T = performance.now() / 1000;
    const speedXZ = Math.hypot(p.vx, p.vz);
    const running = speedXZ > 0.6 && p.grounded;
    u.run += dt * (5 + speedXZ * 1.6);
    const sw = Math.sin(u.run), stride = running ? Math.min(1, speedXZ / 5) : 0;
    u.legs[0].rotation.x = sw * 0.9 * stride; u.legs[1].rotation.x = -sw * 0.9 * stride;
    const armUp = p.grounded ? 0.15 : 2.4;
    u.arms[0].rotation.x = -sw * 0.9 * stride; u.arms[1].rotation.x = sw * 0.9 * stride;
    u.arms[0].rotation.z += (-armUp - u.arms[0].rotation.z) * Math.min(1, dt * 12);
    u.arms[1].rotation.z += (armUp - u.arms[1].rotation.z) * Math.min(1, dt * 12);
    if (!p.grounded) { u.legs[0].rotation.x = -0.6; u.legs[1].rotation.x = 0.4; }
    p.squash += (0 - p.squash) * Math.min(1, dt * 12);
    u.body.position.y = stride ? Math.abs(Math.cos(u.run)) * 0.06 : Math.sin(T * 2.5 + p.x) * 0.02;
    u.body.scale.set(1 + p.squash * 0.45, 1 - p.squash, 1 + p.squash * 0.45);
    u.body.rotation.x = stride * 0.15;
    if (!p.grounded && p.stun === 0) u.flip = Math.min(Math.PI * 2, u.flip + dt * 10.5); else u.flip = 0;
    u.rig.rotation.x = u.flip;
    u.rig.rotation.z = p.stun > 0 ? Math.sin(T * 30) * 0.3 : 0;
    for (let i = 0; i < 2; i++) u.ears[i].rotation.x = -0.15 - Math.sin(T * 10 + i) * 0.06 * (stride + 0.3);
    for (const tl of u.tails) {
      const w = stride + 0.35;
      tl.pivot.rotation.x = 0.55 + (p.grounded ? 0 : -0.5) + Math.sin(T * 13 + tl.sx) * 0.15 * w;
      tl.pivot.rotation.y = tl.sx * 0.25 + Math.sin(T * 9 + tl.sx * 2) * 0.2 * w;
      tl.seg1.rotation.x = Math.sin(T * 15 + tl.sx) * 0.3 * w; tl.seg2.rotation.x = Math.sin(T * 15 + tl.sx + 1.2) * 0.45 * w;
    }
    u.blink -= dt; const blinking = u.blink < 0.11; if (u.blink < 0) u.blink = 1.8 + Math.random() * 3;
    const hurt = p.hurt > 0;
    for (const e of u.eyes) e.scale.y = hurt ? 0.25 : blinking ? 0.12 : 1;
    u.brows[0].rotation.z = hurt ? 0.5 : !p.grounded ? -0.25 : 0; u.brows[1].rotation.z = hurt ? -0.5 : !p.grounded ? 0.25 : 0;
    u.brows[0].position.y = u.brows[1].position.y = !p.grounded ? 0.34 : 0.3;
    u.smile.visible = !(hurt || !p.grounded); u.mouthO.visible = !u.smile.visible;
    u.mats[0].emissive.setHex(hurt && Math.floor(T * 20) % 2 === 0 ? 0xff3355 : 0x000000);
    let dr = p.face - p.h.rotation.y; dr = Math.atan2(Math.sin(dr), Math.cos(dr));
    p.h.rotation.y += dr * Math.min(1, dt * 12);
    p.h.position.set(p.x, p.y, p.z);
  }

  function placeCamera(dt) {
    const portrait = camera.aspect < 1;
    shake = Math.max(0, shake - dt); const sk = shake * shake * 1.6;
    if (state === "menu") {
      const T = performance.now() / 1000;
      camera.position.set(Math.sin(T * 0.3) * 1.2, 1.3, 3.6); camera.lookAt(0, 0.85, 0); return;
    }
    // Fixed view from behind the open edge, so you can see the whole deck and the drop.
    const fx = you && you.alive ? you.x * 0.15 : 0;
    camera.position.set(fx + (Math.random() - 0.5) * sk, (portrait ? 17 : 11) + (Math.random() - 0.5) * sk, portrait ? 17 : 14);
    camera.lookAt(fx * 0.5, 0, portrait ? -1.5 : -1.2);
  }

  function frame(now) {
    const dt = Math.min(0.04, (now - last) / 1000); last = now;
    const T = now / 1000;
    if (state === "menu") {
      you.grounded = true; you.vx = 0; you.vz = 0;
      you.face = Math.sin(T * 0.7) * 0.5;
      animate(you, dt);
    } else if (state === "countdown") {
      countdown -= dt;
      const n = Math.ceil(countdown);
      if (n > 0) { if (banner.textContent !== String(n)) { flash(String(n), 1000); beep(440, 0.12, "square", 0.04); } }
      else { state = "play"; flash("GO!", 700); beep(660, 0.3, "square", 0.05, 990); }
      for (const p of players) animate(p, dt);
    } else {
      if (state === "play") t += dt;
      else overT += dt;
      speed = Math.min(8.5, 3.6 + t * 0.045);
      const level = t < 20 ? 0 : t < 45 ? 1 : 2;
      rowTimer -= dt;
      if (rowTimer <= 0) { spawnRow(level); rowTimer = Math.max(1.05, 2.5 - t * 0.016) + Math.random() * 0.6; }
      const sub = 2, h = dt / sub;
      for (let s = 0; s < sub; s++) {
        for (const b of blocks) { b.z += speed * h; b.m.position.z = b.z; }
        for (const p of players) {
          if (!p.alive) { p.vy -= 26 * h; p.y += p.vy * h; p.z += p.vz * h; continue; }
          let inp;
          if (p.you) {
            let ix = 0, iz = 0;
            if (keys.has("a") || keys.has("arrowleft")) ix -= 1;
            if (keys.has("d") || keys.has("arrowright")) ix += 1;
            if (keys.has("w") || keys.has("arrowup")) iz -= 1;
            if (keys.has("s") || keys.has("arrowdown")) iz += 1;
            if (stick.id !== null) { ix += stick.x; iz += stick.y; }
            const l = Math.hypot(ix, iz); if (l > 1) { ix /= l; iz /= l; }
            inp = { ix: state === "play" ? ix : 0, iz: state === "play" ? iz : 0, jump: state === "play" && s === 0 && (jumpQ || keys.has(" ")) };
            if (s === 0) jumpQ = false;
          } else inp = think(p);
          stepPlayer(p, h, inp.ix, inp.iz, inp.jump);
          pushByBlocks(p);
        }
        bumpPlayers();
      }
      for (let i = blocks.length - 1; i >= 0; i--) { const b = blocks[i]; if (b.z - b.d / 2 > BACK + 6) { scene.remove(b.m); blocks.splice(i, 1); } else if (b.z - b.d / 2 > BACK) { b.m.position.y -= dt * 6 * (b.z - b.d / 2 - BACK); } }
      // New rivals drop in from the sky so the deck stays busy.
      for (let i = respawns.length - 1; i >= 0; i--) if (t >= respawns[i].at && state === "play") {
        respawns.splice(i, 1);
        const p = addPlayer(false, (Math.random() * 2 - 1) * 2, -3 + Math.random() * 3, 9); p.vy = -2;
        burst("spark", p.x, 1, p.z, 12, [0x7ff9ff, 0xffffff], 2, 0.6);
      }
      for (const p of players) animate(p, dt);
    }
    for (const s of scenery) { if (s.userData.spin !== undefined) s.rotation.y += s.userData.spin; if (s.userData.bob !== undefined) { s.userData.bob += dt; s.position.y += Math.sin(s.userData.bob) * 0.004; } }
    for (const e of engines) e.scale.y = 0.85 + Math.random() * 0.3;
    for (const b of fenceBeams) b.material.opacity = 0.32 + Math.sin(T * 25 + b.position.y * 3) * 0.1;
    gateGlow.material.opacity = 0.25 + Math.sin(T * 4) * 0.1;
    stepParts(dt);
    placeCamera(dt);
    camera.updateMatrixWorld();
    // name tags
    const Wd = stage.clientWidth, Hd = stage.clientHeight;
    for (const p of players) {
      const show = state !== "menu" && p.alive && p.h.visible;
      if (!show) { p.tag.style.display = "none"; continue; }
      tmpV.set(p.x, p.y + 1.85, p.z).project(camera);
      p.tag.style.display = ""; p.tag.style.transform = "translate(" + ((tmpV.x + 1) / 2 * Wd) + "px," + ((1 - tmpV.y) / 2 * Hd) + "px) translate(-50%,-100%)";
    }
    if (state !== "menu") {
      $("hudTime").textContent = Math.floor(t);
      $("hudAlive").textContent = players.filter((p) => p.alive).length;
      $("hudOut").textContent = outlasted;
    }
    if (bannerUntil && now > bannerUntil) { banner.textContent = ""; bannerUntil = 0; }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  let last = performance.now();

  // ======================= menu =======================
  const sw = $("swatches");
  COLORS.forEach((c, i) => {
    const b = document.createElement("button"); b.className = "sw" + (i === colorIx ? " on" : ""); b.title = c.name;
    b.style.background = "radial-gradient(circle at 35% 30%, #fff 0, #" + c.body.toString(16).padStart(6, "0") + " 45%)";
    b.onclick = () => { colorIx = i; localStorage.setItem(LS_COLOR, String(i)); setupMenu(); [...sw.querySelectorAll(".sw")].forEach((x, k) => x.classList.toggle("on", k === i)); you.squash = 0.35; };
    sw.appendChild(b);
  });
  $("play").onclick = start;
  $("again").onclick = start;
  $("toMenu").onclick = () => { state = "menu"; setupMenu(); stage.classList.add("menu"); $("result").classList.add("hidden"); $("hud").classList.add("hidden"); $("menu").classList.remove("hidden"); };

  setupMenu(); stage.classList.add("menu");
  resize();
  requestAnimationFrame(frame);
  // Test hook. god() keeps YOU from going out (tests only) and never posts a score.
  window.__laserhop = { get state() { return state; }, get t() { return t; }, get alive() { return players.filter((p) => p.alive).length; },
                        get outlasted() { return outlasted; }, get you() { return you && { x: you.x, z: you.z, alive: you.alive }; }, god(on) { god = !!on; } };
})();
</script>
</body>
