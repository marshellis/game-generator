name: Diagnose Vercel env (temporary)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ping the leaderboard database (prints status only, never values)
        run: |
          npx --yes vercel@latest env pull .env.diag --environment=production --yes --token="${{ secrets.VERCEL_TOKEN }}" >/dev/null 2>&1
          set -a; . ./.env.diag; set +a
          echo "url host: $(echo "$KV_REST_API_URL" | sed -E 's#https?://([^/]*).*#\1#' | sed -E 's/^[^.]{4}/****/')"
          echo "--- PING"
          curl -s -m 20 -o /tmp/ping.txt -w "http %{http_code}\n" "$KV_REST_API_URL/ping" -H "Authorization: Bearer $KV_REST_API_TOKEN"
          head -c 300 /tmp/ping.txt | sed -E 's/[A-Za-z0-9_\-]{30,}/<redacted>/g'; echo
          echo "--- ZREVRANGE flappy (count only)"
          curl -s -m 20 -o /tmp/z.txt -w "http %{http_code}\n" "$KV_REST_API_URL" -H "Authorization: Bearer $KV_REST_API_TOKEN" -H "Content-Type: application/json" -d '["ZCARD","lb:flappy"]'
          head -c 200 /tmp/z.txt | sed -E 's/[A-Za-z0-9_\-]{30,}/<redacted>/g'; echo
          rm -f .env.diag
