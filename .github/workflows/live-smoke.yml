name: Live smoke (real browser)

# Read-only checks of the DEPLOYED site in headless Chromium: games load on the isolated arcade origin, see no
# cookies, cannot reach the family API, and the host relay still serves scores/boards. Creates nothing (guest only).
on:
  schedule:
    - cron: "17 14 * * *"   # daily; catches a bad deploy or a DNS/CSP regression
  workflow_dispatch:
  pull_request:
    paths: ["site/e2e/**", ".github/workflows/live-smoke.yml"]

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]   # webkit = the Safari engine (iPhone/iPad/Mac)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright && npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: site
      - run: node e2e/live-smoke.mjs
        working-directory: site
        env: { BROWSER: "${{ matrix.browser }}" }
