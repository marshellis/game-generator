name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group: # run the test gate against the merge-queue's combined commit
  workflow_dispatch:

concurrency:
  # Scope per ref so a PR/merge-queue test run is NOT cancelled by an unrelated
  # main deploy (they previously shared one group, cancelling each other).
  # main pushes still serialize against each other (one prod deploy at a time).
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generator tests
        working-directory: generator
        run: |
          npm ci
          npm test
      - name: Site tests
        working-directory: site
        run: |
          npm ci
          npm test

  deploy:
    needs: test
    # Only deploy on a real push to main. On pull_request the test job still runs
    # (a green check that gates auto-merge), but we never deploy a PR branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pin to 20: @astrojs/vercel@7 maps the build-time Node major to the
          # function runtime. Node 22 isn't recognized by v7 → falls back to the
          # now-invalid nodejs18.x and the deploy fails. Node 20 → nodejs20.x.
          node-version: 20

      - name: Check for Vercel token
        id: check
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL_TOKEN secret is not set — skipping deploy. Add it in repo Settings → Secrets and variables → Actions."
          fi

      - name: Install Vercel CLI
        if: steps.check.outputs.ready == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        if: steps.check.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build (Vercel)
        if: steps.check.outputs.ready == 'true'
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to production
        if: steps.check.outputs.ready == 'true'
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
